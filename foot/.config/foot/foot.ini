[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font Propo:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

# Send Alt+Backspace sequence for Ctrl+Backspace so Tmux/zsh deletes preceding word instead of C-h collision
\x1b\x7f=Control+BackSpace

# Send CSI u sequences for Ctrl+grave and Ctrl+number (for tmux window switching)
\x1b[96;5u=Control+grave Control+dead_grave
\x1b[49;5u=Control+1
\x1b[50;5u=Control+2
\x1b[51;5u=Control+3
\x1b[52;5u=Control+4
\x1b[53;5u=Control+5
\x1b[54;5u=Control+6
\x1b[55;5u=Control+7
\x1b[56;5u=Control+8
\x1b[57;5u=Control+9
