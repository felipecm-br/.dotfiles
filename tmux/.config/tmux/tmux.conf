# Tmux configuration file
# Basic settings
set -g default-terminal "tmux-256color"
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g extended-keys on
set -ga terminal-features ",xterm*:sync:margins"

# Colors from current Omarchy theme (auto-generated)
source-file ~/.local/state/omarchy/current/theme/tmux-colors.conf

# panes
set -g allow-passthrough all
# message/mode styles are set directly in the generated tmux-colors.conf


set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false
# tmux battery and tmux online status should be before tmux catppuccin
# Plugin management section
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|mm)(diff)?(-wrapped)?'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'


# Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

# Home-Row window hint letter mapping: 0:a, 1:s, 2:d, 3:f, 4:j, 5:k, 6:l, 7:;, 8:g, 9:h
HINT_KEY="#{?#{==:#I,0},a,#{?#{==:#I,1},s,#{?#{==:#I,2},d,#{?#{==:#I,3},f,#{?#{==:#I,4},j,#{?#{==:#I,5},k,#{?#{==:#I,6},l,#{?#{==:#I,7},;,#{?#{==:#I,8},g,#{?#{==:#I,9},h,#I}}}}}}}}}}"

set-option -g status-position top
set-option -g status 2

# Fake bottom margin under the top bar with an empty second status row
set-option -g status-format[1] " "

# Basic colors of the Statusbar are set in the generated tmux-colors.conf

# Show the window list centered between the left and the right section
set-option -g status-justify left

# Style and set contents on the left section
# Pill background turns PREFIX_COLOR when prefix or window_hints is active
set-option -g status-left "\
#[fg=#{?pane_in_mode,#{@COPY_COLOR},#{?#{||:#{client_prefix},#{==:#{client_key_table},window_hints}},#{@PREFIX_COLOR},#{@SEGMENT_BG}}},bg=default]${HALF_ROUND_OPEN}\
#[bg=#{?pane_in_mode,#{@COPY_COLOR},#{?#{||:#{client_prefix},#{==:#{client_key_table},window_hints}},#{@PREFIX_COLOR},#{@SEGMENT_BG}}},fg=#{?pane_in_mode,#{@SESSION_ACTIVE_FG},#{?#{||:#{client_prefix},#{==:#{client_key_table},window_hints}},#{@SESSION_ACTIVE_FG},#{@SESSION_COLOR}}}]#{?#{==:#{client_key_table},window_hints},󰌌 ,#{?client_prefix,⌨ ,}}#S \
#[fg=#{?pane_in_mode,#{@COPY_COLOR},#{?#{||:#{client_prefix},#{==:#{client_key_table},window_hints}},#{@PREFIX_COLOR},#{@SEGMENT_BG}}},bg=default]${TRIANGLE_CLOSE}  \
"

# Style and set contents on the right section
# @ai_agent_bell is set by hooker.ts when OpenCode needs attention (clears after 7s)
set-option -g status-right "\
#{@ai_agent_bell}\
#[fg=#{?pane_in_mode,#{@COPY_COLOR},#{?client_prefix,#{@PREFIX_COLOR},#{@SEGMENT_BG}}},bg=default]${TRIANGLE_OPEN}\
#[bg=#{?pane_in_mode,#{@COPY_COLOR},#{?client_prefix,#{@PREFIX_COLOR},#{@SEGMENT_BG}}},fg=#{?pane_in_mode,#{@SESSION_ACTIVE_FG},#{?client_prefix,#{@SESSION_ACTIVE_FG},#{@HOST_COLOR}}}] 󰮯 󱙝󱙝󱙝 \
#[fg=#{?pane_in_mode,#{@COPY_COLOR},#{?client_prefix,#{@PREFIX_COLOR},#{@SEGMENT_BG}}},bg=default]${HALF_ROUND_CLOSE}   \
"

# Set max length of left and right section
set-option -g status-left-length 100
set-option -g status-right-length 100

# Event-driven status bar (no periodic polling timer needed — updates on events and acpd notifications)
set -g status-interval 0

# Default global empty so windows without opencode show nothing
set -g @ai_agent_state ""

# Lazygitrs session icon — set by lazygit-hook.mjs when lazygitrs is online
set -g @lazygitrs_icon ""

# Bell segment — cleared by hooker.ts after 7s; init empty to avoid stale display
set -g @ai_agent_bell ""

# New windows/sessions inherit window options from whichever window was active — reset on creation
set-hook -g after-new-window  'set-option -w @ai_agent_state ""; set-option -w @ai_agent_state_color "#{@CURRENT_COLOR}"; set-option -w @lazygitrs_icon ""'
set-hook -g after-new-session 'set-option -w @ai_agent_state ""; set-option -w @ai_agent_state_color "#{@CURRENT_COLOR}"; set-option -w @lazygitrs_icon ""'
# Track active window state and capture unlinked windows for instant tab reopening (Ctrl+Shift+T)
set-hook -g pane-focus-in     'run-shell "~/.config/tmux/record-window-state.sh --track"'
set-hook -g window-unlinked   'run-shell "~/.config/tmux/record-window-state.sh --unlinked"'

# Style and set content for the inactive windows
# Shows agent state with @ai_agent_state_color and lazygitrs icon when connected (renders Home-Row link hints when window_hints is active)
set-option -g window-status-format "#{?#{==:#{client_key_table},window_hints}, #[fg=#{@PREFIX_COLOR}]#[bg=default]${HALF_ROUND_OPEN}#[bg=#{@PREFIX_COLOR}]#[fg=#{@SESSION_ACTIVE_FG}]#[bold]${HINT_KEY}#[fg=#{@PREFIX_COLOR}]#[bg=default]${HALF_ROUND_CLOSE} ,  #I:}#W#{?#{@ai_agent_state}, #[fg=#{@ai_agent_state_color}]#{@ai_agent_state},}#{?#{@lazygitrs_icon}, #[fg=#a6e3a1]#{s/#\\[fg=[^]]*\\]//:#{@lazygitrs_icon}},} "

# Active window: dynamic pill color driven by AI agent state (always @CURRENT_COLOR Cyan when no AI agent, shows [hint] when window_hints is active)
set-option -g window-status-current-format "#[fg=#{?#{@ai_agent_state},#{?#{!=:#{@ai_agent_state_color},},#{@ai_agent_state_color},#{@CURRENT_COLOR}},#{@CURRENT_COLOR}},bg=default]${HALF_ROUND_OPEN}#[bg=#{?#{@ai_agent_state},#{?#{!=:#{@ai_agent_state_color},},#{@ai_agent_state_color},#{@CURRENT_COLOR}},#{@CURRENT_COLOR}},fg=#{@SESSION_ACTIVE_FG},bold] #{?#{==:#{client_key_table},window_hints},[${HINT_KEY}] ,}#W#{?#{@ai_agent_state}, #[fg=#{@SESSION_ACTIVE_FG}]#{@ai_agent_state},}#{?#{@lazygitrs_icon}, #[fg=#{@SESSION_ACTIVE_FG}]#{s/#\\[fg=[^]]*\\]//:#{@lazygitrs_icon}},} #[fg=#{?#{@ai_agent_state},#{?#{!=:#{@ai_agent_state_color},},#{@ai_agent_state_color},#{@CURRENT_COLOR}},#{@CURRENT_COLOR}},bg=default]${HALF_ROUND_CLOSE}"

# Use spacing as the separator for a cleaner look
set-option -g window-status-separator " "

# pane border look and feel
# pane-border-style is set in the generated tmux-colors.conf
set -g pane-active-border-style "fg=#{?pane_in_mode,#{@COPY_COLOR},#{?client_prefix,#{@PREFIX_COLOR},#{@ACTIVE_BORDER_COLOR}}},bg=default"
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on

# Window Activity Monitoring (Highlight tabs when background panes have output)
# When 'monitor-activity' is ON, apps that stream to stdout (like 'agy') will highlight the tab.
# Apps with TUIs (like 'opencode') usually don't trigger it.
# To disable the highlight effect, change 'on' to 'off'.
setw -g monitor-activity off
set -g visual-activity off

# bind Scrollback - captures pane and opens in nvim with baleia.nvim (view-only, see scrollback-view.sh)
bind-key "E" run-shell "~/.config/tmux/scrollback-view.sh"
# Token yank / extract (extrakto-style via mm, see scrollback-extract.sh):
bind-key "y" run-shell "~/.config/tmux/scrollback-extract.sh '#{pane_id}' '#{pane_current_path}'"
# Files picker: browse workspace / origin cwd via mm files popup, Enter copies path(s), Ctrl+V inserts
unbind 'v'
unbind C-v
unbind 'V'
unbind 'e'
bind-key "e" run-shell "~/.config/tmux/files-picker.sh '#{pane_id}' '#{pane_current_path}'"
bind-key C-e run-shell "~/.config/tmux/files-picker.sh '#{pane_id}' '#{pane_current_path}'"

# Live ripgrep: full-text search in workspace via mm rg popup, Enter opens in nvim, Ctrl+V inserts
bind-key "/" run-shell "~/.config/tmux/grep-picker.sh '#{pane_id}' '#{pane_current_path}'"

# Scrollback
setw -g mode-keys vi

# Use xclip for copying to the system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Increase scroll history
set-option -g history-limit 10000

# start index at 1
set -g base-index 0
set -g pane-base-index 0

# renumber when window is closed
set -g renumber-window on

 # zero-out escape time delay to make key bindings more responsive (especially for vim users)
set -g escape-time 0

# key bindings
set -g prefix C-Space
bind C-Space send-prefix
bind-key x run-shell "~/.config/tmux/close-window.sh '#{pane_id}'" # skip prompt and record state for tab reopen

# Create vertical split
unbind '|'
bind '|' split-window -h

# Create horizontal split
unbind '-'
bind - split-window -v

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# OpenCode / AI agent bell popup (prefix+i to toggle popup HUD)
bind-key "i" if-shell -F '#{==:#{session_name},_popups}' 'detach-client' 'run-shell "~/.config/tmux/ai-agent-bell-popup.sh"'
# AI Agent Triage Jump: direct focus jump to next agent requiring attention (without popup)
bind-key "I" run-shell "~/.config/tmux/ai-agent-triage-jump.sh"


# Switch windows directly with Ctrl+number (no prefix needed)
bind-key -n 'C-`' select-window -t 0
bind-key -n 'C-1' select-window -t 1
bind-key -n 'C-2' select-window -t 2
bind-key -n 'C-3' select-window -t 3
bind-key -n 'C-4' select-window -t 4
bind-key -n 'C-5' select-window -t 5
bind-key -n 'C-6' select-window -t 6
bind-key -n 'C-7' select-window -t 7
bind-key -n 'C-8' select-window -t 8
bind-key -n 'C-9' select-window -t 9

# Move current window to a target index (shifts windows in between) with Ctrl+Shift+number
bind-key -n 'C-S-0' run-shell "~/.config/tmux/move-window-to.sh 0"
bind-key -n 'C-S-1' run-shell "~/.config/tmux/move-window-to.sh 1"
bind-key -n 'C-S-2' run-shell "~/.config/tmux/move-window-to.sh 2"
bind-key -n 'C-S-3' run-shell "~/.config/tmux/move-window-to.sh 3"
bind-key -n 'C-S-4' run-shell "~/.config/tmux/move-window-to.sh 4"
bind-key -n 'C-S-5' run-shell "~/.config/tmux/move-window-to.sh 5"
bind-key -n 'C-S-6' run-shell "~/.config/tmux/move-window-to.sh 6"
bind-key -n 'C-S-7' run-shell "~/.config/tmux/move-window-to.sh 7"
bind-key -n 'C-S-8' run-shell "~/.config/tmux/move-window-to.sh 8"
bind-key -n 'C-S-9' run-shell "~/.config/tmux/move-window-to.sh 9"

# Sesh session management with matchmaker
bind-key "t" run-shell "~/.config/tmux/sesh-picker.sh"

# Fast AI & Git Ergonomic Keybindings (Zero-Prefix & Popups)
# AI Attention Triage Jump: direct focus jump to next agent requiring attention (without popup)
# Prefix+I (C-Space then Shift+I) and Ctrl+Shift+I (C-S-i / C-S-I) provide Home-Row, no-Alt MacBook ergonomics.
# Root C-i is NOT bound because ASCII 0x09 is shared with Tab, preserving Tab completion across shells & editors.
bind-key -n 'C-S-i' run-shell "~/.config/tmux/ai-agent-triage-jump.sh"
bind-key -n 'C-S-I' run-shell "~/.config/tmux/ai-agent-triage-jump.sh"
bind-key -n M-i run-shell "~/.config/tmux/ai-agent-triage-jump.sh"
bind-key -n C-g run-shell "~/.config/tmux/lazygitrs-popup.sh '#{pane_current_path}'"
bind-key -n 'C-S-g' run-shell "~/.config/tmux/awt-popup.sh '#{pane_current_path}' || true"
bind-key -n 'C-S-G' run-shell "~/.config/tmux/awt-popup.sh '#{pane_current_path}' || true"
# Reopen last closed window/tab (VSCode-style Ctrl+Shift+T, zero-prefix)
bind-key -n 'C-S-t' run-shell "~/.config/tmux/reopen-window.sh"
bind-key -n 'C-S-T' run-shell "~/.config/tmux/reopen-window.sh"
bind-key o run-shell 'pane_cnt=$(tmux list-panes | wc -l); if [ "$pane_cnt" -gt 1 ]; then tmux kill-pane -t :.+; else tmux split-window -h -l 35% "opencode"; fi'

# Popup utilities
bind-key "N" display-popup -E -w 90% -h 90% -b rounded -S "fg=#fab387" -T "  " "nvim"
bind-key "C" clock-mode

# Window navigation (vim 2motions)
bind -r l next-window
bind -r h previous-window
bind -r Tab last-window
bind -r w run-shell "~/.config/tmux/close-window.sh '#{pane_id}'"
bind-key "n" new-window -c '#{pane_current_path}'
bind -r c choose-window

# Window picker with Matchmaker (reads tmux options populated by acpd)

bind-key "s" run-shell "~/.config/tmux/window-picker.sh"
bind-key "S" run-shell "~/.config/tmux/window-picker.sh --fullscreen"
unbind 'D'
unbind O

# Session navigation
bind L switch-client -l  # last session
bind W kill-session      # kill current session

# Pane resize (repeatable holding Ctrl: Prefix + C-h / C-j / C-k / C-l)
# Asymmetric 10% relative step: 20 columns horizontal (~10% of width), 5 lines vertical (~10% of height)
bind -r C-h resize-pane -L 20
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 20

# Maximize / Zoom toggle (Prefix + m for ergonomic bi-manual execution, Prefix + z preserved)
bind-key m resize-pane -Z
bind-key z resize-pane -Z

# Tell tpm to use ~/.tmux/plugins/ regardless of XDG detection
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Custom Overrides (must be AFTER TPM so plugins like tmux-sensible don't overwrite them)
bind-key "m" resize-pane -Z
bind-key "z" resize-pane -Z
bind-key "L" switch-client -l
unbind -T prefix "H"
unbind -T prefix "J"
unbind -T prefix "K"
bind-key -r C-h resize-pane -L 20
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 20
bind-key "t" run-shell "~/.config/tmux/sesh-picker.sh"
bind-key "T" run-shell "~/.config/tmux/reopen-window.sh"
bind-key "u" run-shell "~/.config/tmux/reopen-window.sh"
bind-key -n 'C-S-t' run-shell "~/.config/tmux/reopen-window.sh"
bind-key -n 'C-S-T' run-shell "~/.config/tmux/reopen-window.sh"
bind-key "n" new-window -c '#{pane_current_path}'
bind-key "i" if-shell -F '#{==:#{session_name},_popups}' 'detach-client' 'run-shell "~/.config/tmux/ai-agent-bell-popup.sh"'
bind-key "e" run-shell "~/.config/tmux/files-picker.sh '#{pane_id}' '#{pane_current_path}'"
bind-key C-e run-shell "~/.config/tmux/files-picker.sh '#{pane_id}' '#{pane_current_path}'"
bind-key "/" run-shell "~/.config/tmux/grep-picker.sh '#{pane_id}' '#{pane_current_path}'"

# Vimium-style In-situ Window Hints (Prefix + f -> Home-Row keys a, s, d, f, j, k, l, ;, g, h)
bind-key "f" switch-client -T window_hints \; refresh-client -S
bind-key -T window_hints a select-window -t 0 \; switch-client -T root
bind-key -T window_hints s select-window -t 1 \; switch-client -T root
bind-key -T window_hints d select-window -t 2 \; switch-client -T root
bind-key -T window_hints f select-window -t 3 \; switch-client -T root
bind-key -T window_hints j select-window -t 4 \; switch-client -T root
bind-key -T window_hints k select-window -t 5 \; switch-client -T root
bind-key -T window_hints l select-window -t 6 \; switch-client -T root
bind-key -T window_hints \; select-window -t 7 \; switch-client -T root
bind-key -T window_hints g select-window -t 8 \; switch-client -T root
bind-key -T window_hints h select-window -t 9 \; switch-client -T root
# Direct numbers fallback
bind-key -T window_hints 0 select-window -t 0 \; switch-client -T root
bind-key -T window_hints 1 select-window -t 1 \; switch-client -T root
bind-key -T window_hints 2 select-window -t 2 \; switch-client -T root
bind-key -T window_hints 3 select-window -t 3 \; switch-client -T root
bind-key -T window_hints 4 select-window -t 4 \; switch-client -T root
bind-key -T window_hints 5 select-window -t 5 \; switch-client -T root
bind-key -T window_hints 6 select-window -t 6 \; switch-client -T root
bind-key -T window_hints 7 select-window -t 7 \; switch-client -T root
bind-key -T window_hints 8 select-window -t 8 \; switch-client -T root
bind-key -T window_hints 9 select-window -t 9 \; switch-client -T root
# Cascading escape / cancel without action
bind-key -T window_hints Escape switch-client -T root \; refresh-client -S
bind-key -T window_hints Any switch-client -T root \; refresh-client -S

# Dedicated popup key-table (Esc to close modal popup immediately)
bind-key -T popup Escape detach-client
bind-key -T popup C-Space send-prefix

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
