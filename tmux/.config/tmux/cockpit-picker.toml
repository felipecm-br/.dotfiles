[start]
sort = false
ansi = true

[matcher.sort]
threshold = false

[start.command]
command = "$HOME/.config/tmux/cockpit-picker-items.sh"
additional = [
    "$HOME/.config/tmux/cockpit-picker-items.sh",
    "$HOME/.config/tmux/cockpit-picker-items.sh --agents",
]

[columns]
split = '\t'
max = 14
names = [
    { name = "title", ignore = true },
    { name = "idx" },
    { name = "name" },
    { name = "session" },
    { name = "pid" },
    { name = "path" },
    { name = "state" },
    { name = "agent" },
    { name = "age" },
    { name = "branch" },
    { name = "sync" },
    { name = "display", ignore = true }
]

[tui]
mouse = true
percentage = 100
max = 9999

[results]
spinner_prefix = "@SPIN@"
spinner_inline = true
current_prefix = ""
unselected_prefix = ""
multi = false
row_connection = "Full"
column_spacing = 0

[results.style]
modifier = "DIM"

[results.current_style]
modifier = "BOLD"

[results.current_nav_bar_style]
modifier = "BOLD"

[results.autoscroll]
enabled = false

[results.border]
sides = ""

[query]
status_inline = true
prompt = " "
show = true

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Jump}  •  {yellow,bold:[Tab]} {darkgray:Agents}  •  {yellow,bold:[w]} {darkgray:New WT}  •  {green,bold:[t]} {darkgray:New Win}  •  {yellow,bold:[s]} {darkgray:Sessions}  •  {magenta,bold:[g]} {darkgray:Git}  •  {blue,bold:[?]} {darkgray:Help}  •  {blue,bold:[Esc]} {darkgray:Exit}"
row_connection = "Full"
match_indent = false
separator = "light"

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"
color = "black"
hints = false

[ui.nav.binds]
"tab"           = "@reloadnext"
"shift-tab"     = "@reloadprev"
"backtab"       = "@reloadprev"
"shift-backtab" = "@reloadprev"
"/"             = "FocusFilter"
"s"             = ["Print(__SWITCH_SESSION__)", "Quit"]
"S"             = ["Print(__SHIP_WORKTREE__{=})", "Quit"]
"w"             = ["Print(__NEW_WORKTREE__{=})", "Quit"]
"W"             = ["Print(__SWEEP_WORKTREES__{=})", "Quit"]
"R"             = ["Print(__REAP_AGENTS__{=})", "Quit"]
"t"      = ["Print(__CREATE_WINDOW__{=})", "Quit"]
"T"      = ["Print(__CREATE_WINDOW__{=})", "Quit"]
"c"      = ["Print(__NEW_WORKTREE__{=})", "Quit"]
"C"      = ["Print(__NEW_WORKTREE__{=})", "Quit"]
"g"      = ["Print(__LAZYGIT__{=})", "Quit"]
"gg"     = ["Print(__LAZYGIT__{=})", "Quit"]
"G"      = ["Print(__LAZYGIT__{=})", "Quit"]
"ctrl-g" = ["Print(__LAZYGIT__{=})", "Quit"]
"?"         = "SwitchPreview(1)"
"shift-?"   = "SwitchPreview(1)"
"F1"        = "SwitchPreview(1)"
"y"      = ["ExecuteAsync(tmux send-keys -t '{=pid}' 'y' Enter)", "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"]
"Y"      = ["ExecuteAsync(tmux send-keys -t '{=pid}' 'y' Enter)", "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"]
"n"      = ["ExecuteAsync(tmux send-keys -t '{=pid}' 'n' Enter)", "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"]
"N"      = ["ExecuteAsync(tmux send-keys -t '{=pid}' 'n' Enter)", "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"]
"d"      = ["ExecuteAsync(printf '%s\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh; sleep 0.05)", "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"]
"D"      = ["ExecuteAsync(printf '%s\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh; sleep 0.05)", "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"]
"ctrl-r" = "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"
","      = []

[ui.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.initial]
tail = true

[preview.border]
sides = "LEFT"
color = "Darkgray"

[[preview.layout]]
command = '$HOME/.config/tmux/cockpit-picker-preview.sh "{=session}" "{=idx}" "{=pid}" "{=path}" "{=state}" "{=agent}" "{=age}" "{=branch}" "{=sync}"'
side = "right"
percentage = 60
scroll.tail = true

[[preview.layout]]
command = '$HOME/.config/tmux/cockpit-picker-help.sh'
side = "right"
percentage = 60

[binds]
Start    = [
    "ToggleColumn(title)", "ToggleColumn(name)", "ToggleColumn(session)",
    "ToggleColumn(idx)", "ToggleColumn(pid)", "ToggleColumn(path)",
    "ToggleColumn(state)", "ToggleColumn(agent)", "ToggleColumn(age)",
    "ToggleColumn(branch)", "ToggleColumn(sync)"
]
"tab"           = "@reloadnext"
"shift-tab"     = "@reloadprev"
"backtab"       = "@reloadprev"
"shift-backtab" = "@reloadprev"
"ctrl-s" = ["Print(__SWITCH_SESSION__)", "Quit"]
"ctrl-g" = ["Print(__LAZYGIT__{=})", "Quit"]
"ctrl-t" = ["Print(__CREATE_WINDOW__{=})", "Quit"]
"ctrl-r" = "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"
"?"         = "SwitchPreview(1)"
"shift-?"   = "SwitchPreview(1)"
"F1"        = "SwitchPreview(1)"
","      = []
"@reload"= "Reload($HOME/.config/tmux/cockpit-picker-items.sh)"
