[start]
sort = false
ansi = true

[matcher.sort]
threshold = false

[columns]
split = '\t'
names = [
    { name = "title", ignore = true },
    { name = "idx" },
    { name = "name" },
    { name = "session" },
    { name = "display", ignore = true }
]

[tui]
mouse = true
percentage = 100
max = 9999

[results]
spinner_prefix = "@SPIN@"
spinner_inline = true
current_prefix = ""
unselected_prefix = ""
multi = false
row_connection = "Full"
column_spacing = 0

[results.style]
modifier = "DIM"

[results.current_style]
modifier = "BOLD"

[results.current_nav_bar_style]
modifier = "BOLD"

[results.autoscroll]
enabled = false

[results.border]
sides = ""

[query]
status_inline = true
prompt = " "
show = true

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Switch Window}  •  {yellow,bold:[t]} {darkgray:Sessions}  •  {green,bold:[c]} {darkgray:New}  •  {red,bold:[d]} {darkgray:Kill}  •  {blue,bold:[Esc]} {darkgray:Cancel}  •  {magenta,bold:[?]} {darkgray:Help}"
row_connection = "Full"
match_indent = false
separator = "light"

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"             # Estilo da barra na lista: "Plain" (│), "Thick" (█), "Double" (║), "Rounded" (│), "QuadrantOutside" (▌), "QuadrantInside" (▐)
color = "black"           # Cor da barra: nomes ("black", "gray", "cyan", "lightblue", etc.) ou hex ("#000000", "#1e1e2e")
hints = false



[ui.nav.binds]
"t"      = ["Print(__SWITCH_SESSION__)", "Quit"]
"T"      = ["Print(__SWITCH_SESSION__)", "Quit"]
"c"      = ["ExecuteAsync(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-create.sh)", "Reload($HOME/.config/tmux/window-picker-items.sh)"]
"C"      = ["ExecuteAsync(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-create.sh)", "Reload($HOME/.config/tmux/window-picker-items.sh)"]
"d"      = ["ExecuteAsync(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh)", "Reload($HOME/.config/tmux/window-picker-items.sh)"]
"D"      = ["ExecuteAsync(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh)", "Reload($HOME/.config/tmux/window-picker-items.sh)"]
"ctrl-r" = "Reload($HOME/.config/tmux/window-picker-items.sh)"
","      = []

[ui.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.border]
sides = "LEFT"
color = "Darkgray"

[[preview.layout]]
command = 'sess="{=session}"; tmux capture-pane -ep -t "${sess}:{=idx}" 2>/dev/null || printf "  \033[38;2;146;131;116m(no preview)\033[0m\n"'
side = "right"
percentage = 60

[binds]
Start    = ["ToggleColumn(title)", "ToggleColumn(name)", "ToggleColumn(session)", "ToggleColumn(idx)"]
"ctrl-t" = ["Print(__SWITCH_SESSION__)", "Quit"]
"ctrl-r" = "Reload($HOME/.config/tmux/window-picker-items.sh)"
"?"      = "ToggleFooter"
"F1"     = "ToggleFooter"
","      = []
"@reload"= "Reload($HOME/.config/tmux/window-picker-items.sh)"
