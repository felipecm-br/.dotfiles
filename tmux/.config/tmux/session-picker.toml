[ui.nav]
active = true
basic = true
bar = "Plain"
color = "Darkgray"
prompt = ""
focus_on_start = "filter"
hints = false

[start]
sort = false
ansi = true

[start.command]
command = "wm session list --icons"

[tui]
percentage = 100
max = 9999

[matcher.sort]
threshold = false

[ui.border]
sides = ""

[query]
prompt = " "
status_inline = true

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Connect}  •  {magenta,bold:[s]} {darkgray:Windows}  •  {red,bold:[d]} {darkgray:Kill}  •  {yellow,bold:[a]} {darkgray:All}  •  {blue,bold:[t]} {darkgray:Tmux}  •  {green,bold:[x]} {darkgray:Frecency}"
row_connection = "Full"
match_indent = false

[results]
spinner_inline = true
current_prefix = " "
unselected_prefix = "  "
row_connection = "Disjoint"
column_spacing = 1

[results.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.border]
sides = "LEFT"
color = "Darkgray"

[[preview.layout]]
command = 'wm session preview {=}'
side = "right"
percentage = 55

[ui.nav.binds]
"s" = ["Print(__SWITCH_WINDOW__)", "Quit"]
"S" = ["Print(__SWITCH_WINDOW__)", "Quit"]
"a" = "Reload(wm session list --icons)"
"t" = "Reload(wm session list -t --icons)"
"g" = "Reload(wm session list -c --icons)"
"x" = "Reload(wm list --dirs)"
"f" = "Reload(fd -H -d 2 -t d -E .Trash . ~)"
"d" = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload(wm session list --icons)" ]
"," = []

[binds]
"ctrl-s" = ["Print(__SWITCH_WINDOW__)", "Quit"]
"ctrl-a" = [ "SetPrompt(⚡  )", "Reload(wm session list --icons)" ]
"ctrl-t" = [ "SetPrompt(🪟  )", "Reload(wm session list -t --icons)" ]
"ctrl-g" = [ "SetPrompt(⚙️  )", "Reload(wm session list -c --icons)" ]
"ctrl-x" = [ "SetPrompt(📁  )", "Reload(wm list --dirs)" ]
"ctrl-f" = [ "SetPrompt(🔎  )", "Reload(fd -H -d 2 -t d -E .Trash . ~)" ]
"ctrl-d" = [ 'ExecuteAsync(wm session kill "{=}")', "SetPrompt(⚡  )", "SetQuery()", "Reload(wm session list --icons)" ]
"," = []

