# ==============================================================================
#  Preset: The Great Wave off Kanagawa v8 (Key-Block Line Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - Kanagawa oki nami ura, Thirty-Six Views of Mount Fuji
#  Derived from: aaa.toml (Ukiyo-e Crest Edition)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph family: box-drawing lines U+2500-U+257F as the carved outline block, closed by a powerline flame
# The modules cascade through: Choppy Abyss -> Swell -> Reaching Claws -> Hanging Drops -> Crest -> Boats under Fuji's Outline
format = """
[](fg:color_abyss)\
$os\
[╱╲╱╲](fg:color_seafoam bg:color_abyss)\
[](fg:color_abyss bg:color_swell)\

$directory\
[╯╰╯╰](fg:color_foam bg:color_swell)\
[](fg:color_swell bg:color_seafoam)\

$git_branch$git_status\
[╮╭╮╭](fg:color_sumi bg:color_seafoam)\
[](fg:color_seafoam bg:color_foam)\

$c$rust$golang$nodejs$deno$python\
[┄┄](fg:color_seafoam bg:color_foam)\
[](fg:color_foam bg:color_ochre)\

$time\
[╱╲](fg:color_sumi bg:color_ochre)\
[](fg:color_ochre bg:transparent)\
\n$character"""

palette = 'kanagawa_v8'

[palettes.kanagawa_v8]
color_trench  = '#051329' # Midnight trench (dark text)
color_abyss   = '#071e3d' # Prussian Blue (Berlin blue, the wave's base)
color_swell   = '#1f4e70' # Ai indigo (the rising swell)
color_seafoam = '#6d94a6' # Seafoam slate (the curling claws)
color_foam    = '#f2f5f7' # Gofun shell white (breaking crest, Fuji snow)
color_ochre   = '#c7ad7f' # Yellow ochre (oshiokuri-bune boats)
color_sumi    = '#14110f' # Sumi key-block ink (Hokusai's carved outline)
color_hanko   = '#c84b31' # Shuniku cinnabar (Hokusai's seal)

# 1. THE CHOPPY ABYSS (zigzag chop cut into the block)
[os]
disabled = false
style = "bg:color_abyss fg:color_foam bold"
format = '[ 󰠳 ]($style)'

# 2. THE SWELL (rounded peaks reaching up: the claws)
[directory]
style = "bg:color_swell fg:color_foam bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THE SEAFOAM (sumi line hanging down: drops falling from the claws)
[git_branch]
symbol = " "
style = "bg:color_seafoam fg:color_trench bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_seafoam fg:color_trench bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE CREST (a dotted foam line on white)
[c]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

# 5. THE BOATS UNDER FUJI (two strokes, the mountain's outline)
[time]
disabled = false
time_format = "%R"
style = "bg:color_ochre fg:color_trench bold"
format = '[ $time ]($style)'

# 6. THE SWELL PROMPT AND THE HANKO SEAL
[character]
success_symbol = "[╱╲❯](bold color_seafoam)"
error_symbol = "[╱╲❯](bold color_hanko)"
