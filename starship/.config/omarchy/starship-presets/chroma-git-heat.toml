# ==============================================================================
#  Preset: Chroma Git Heat (Temperature of Work Edition)
#  Inspired by: How close the working tree is to shipping, read as heat
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Each git state gets its own cell, ordered from cold to hot by how close the work is to being
# shipped: untracked (frost violet), modified, renamed, deleted, staged (green), stashed, ahead
# (amber, waiting to push), behind, diverged, conflicted (red, needs attention now). Only the
# states present are drawn, and since they keep that order the cells always read as a rising
# temperature ramp; the bar cools back to slate for the languages and the clock.
# Self-chaining joints: every divider is drawn fg:prev_bg, the background of whatever segment came
# before it, so the bar hands off correctly whichever modules are present (no doubled dividers when
# the language segment is empty) and conditional segments can join or leave it.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_os)$os$directory$git_branch$git_status$c$rust$golang$nodejs$deno$python$time[](fg:prev_bg)
$character"""

palette = 'chroma_git_heat'

[palettes.chroma_git_heat]
color_os         = '#1c1b3a' # cool base, t=0.00
color_dir        = '#2c2f6e' # cool base, t=0.50
color_git        = '#3d3a8c' # cool base, t=1.00
color_untracked  = '#7b5cff' # untracked: not even known to git yet (coldest)
color_modified   = '#5879ff' # modified: work in progress
color_renamed    = '#319de9' # renamed
color_deleted    = '#2ec4b6' # deleted
color_staged     = '#7ddb86' # staged: ready to commit
color_stashed    = '#c1e05a' # stashed: parked work
color_ahead      = '#ffd23f' # ahead: committed, waiting to push
color_behind     = '#ffa33e' # behind: the remote moved on
color_diverged   = '#ff7348' # diverged: both sides moved
color_conflicted = '#ff3355' # conflicted: needs attention now (hottest)
color_lang       = '#1f2a44' # languages: back to a cool slate after the heat
color_time       = '#2c3e66' # time: cool slate
color_error      = '#ff3355' # Error: conflict red, paired with the ✗ shape
color_paper      = '#fbfbff' # Paper (text on dark fills)
color_ink        = '#15131a' # Ink (text on light fills)
color_black      = '#000000' # Pure black (contrast correction)

[os]
disabled = false
style = "bg:color_os fg:color_paper bold"
format = '[ 󰈸 ]($style)'

[directory]
style = "bg:color_dir fg:color_paper bold"
format = "[](fg:prev_bg bg:color_dir)[ 󰉋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_git fg:color_paper bold"
format = '[](fg:prev_bg bg:color_git)[ $symbol$branch ]($style)'

[git_status]
format = '$untracked$modified$renamed$deleted$staged$stashed$ahead_behind$conflicted'
untracked = '[](fg:prev_bg bg:color_untracked)[ ?$count ](bg:color_untracked fg:color_black bold)'
modified = '[](fg:prev_bg bg:color_modified)[ !$count ](bg:color_modified fg:color_ink bold)'
renamed = '[](fg:prev_bg bg:color_renamed)[ »$count ](bg:color_renamed fg:color_ink bold)'
deleted = '[](fg:prev_bg bg:color_deleted)[ ✘$count ](bg:color_deleted fg:color_ink bold)'
staged = '[](fg:prev_bg bg:color_staged)[ +$count ](bg:color_staged fg:color_ink bold)'
stashed = '[](fg:prev_bg bg:color_stashed)[ ≡$count ](bg:color_stashed fg:color_ink bold)'
ahead = '[](fg:prev_bg bg:color_ahead)[ ⇡$count ](bg:color_ahead fg:color_ink bold)'
behind = '[](fg:prev_bg bg:color_behind)[ ⇣$count ](bg:color_behind fg:color_ink bold)'
diverged = '[](fg:prev_bg bg:color_diverged)[ $ahead_count⇡$behind_count⇣ ](bg:color_diverged fg:color_ink bold)'
conflicted = '[](fg:prev_bg bg:color_conflicted)[ =$count ](bg:color_conflicted fg:color_ink bold)'

[c]
symbol = " "
style = "bg:color_lang fg:color_paper bold"
format = '[](fg:prev_bg bg:color_lang)[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_lang fg:color_paper bold"
format = '[](fg:prev_bg bg:color_lang)[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_lang fg:color_paper bold"
format = '[](fg:prev_bg bg:color_lang)[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_lang fg:color_paper bold"
format = '[](fg:prev_bg bg:color_lang)[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_lang fg:color_paper bold"
format = '[](fg:prev_bg bg:color_lang)[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_lang fg:color_paper bold"
format = '[](fg:prev_bg bg:color_lang)[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_time fg:color_paper bold"
format = '[](fg:prev_bg bg:color_time)[ $time ]($style)'

[character]
success_symbol = "[❯](bold color_staged)[❯](bold color_ahead)"
error_symbol = "[✗❯](bold color_error)"
