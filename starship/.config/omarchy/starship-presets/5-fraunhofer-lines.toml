# ==============================================================================
#  Preset: Fraunhofer Lines (Solar Spectrum 1814 Edition)
#  Inspired by: Joseph von Fraunhofer (1814) - Bestimmung des Brechungs- und Farbenzerstreuungs-Vermoegens
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
#
# The prompt is a slice of the solar spectrum from 381 to 770 nm, laid out left to right.
# Every half cell (U+258C, left in fg, right in bg) is coloured by its own wavelength (Dan Bruton's wavelength-to-RGB fit, with the
# natural fade into the ultraviolet and infrared), and the dark absorption lines Fraunhofer
# catalogued sit at their true positions: K and H (Ca II) in the lead, G, F (H-beta), the
# Mg b triplet, D1/D2 (sodium), C (H-alpha) and the telluric O2 bands B and A in the tail.
# A line darkens its own patch of continuum (it absorbs light, it is not a hole): strong lines
# are a half block (U+258C/U+2590) at 40% OKLab lightness, medium and weak ones a quarter
# or half block at 58% / 74%, on the side of the cell where the wavelength falls.

"$schema" = 'https://starship.rs/config-schema.json'

# The modules cascade through: Violet -> Blue -> Green -> Amber -> Red -> infrared fade
format = """
[▌](fg:color_nm382 bg:color_nm385)\
[▌](fg:color_nm387 bg:color_nm390)\
[▌](fg:color_abs393 bg:color_nm394)\
[▌](fg:color_abs397 bg:color_nm398)\
[▌](fg:color_nm402 bg:color_nm405)\
[▌](fg:color_nm407 bg:color_nm410)\
$os\
[▐](fg:color_abs431 bg:color_nm430)\
[▌](fg:color_nm437 bg:color_nm442)\
[▌](fg:color_nm446 bg:color_nm451)\
[▌](fg:color_nm455 bg:color_nm460)\
$directory\
[▌](fg:color_nm477 bg:color_nm482)\
[▌](fg:color_abs486 bg:color_nm490)\
[▌](fg:color_nm497 bg:color_nm503)\
[▌](fg:color_nm508 bg:color_nm513)\
[▌](fg:color_abs517 bg:color_nm521)\
$git_branch$git_status\
[▌](fg:color_nm541 bg:color_nm546)\
[▌](fg:color_nm552 bg:color_nm557)\
[▌](fg:color_nm562 bg:color_nm568)\
[▌](fg:color_nm573 bg:color_nm578)\
[▐](fg:color_abs589 bg:color_nm587)\
$c$rust$golang$nodejs$deno$python\
[▌](fg:color_nm607 bg:color_nm612)\
[▌](fg:color_nm617 bg:color_nm623)\
[▎](fg:color_abs628 bg:color_nm631)\
$time\
[▐](fg:color_abs656 bg:color_nm654)\
[▌](fg:color_nm665 bg:color_nm673)\
[▐](fg:color_abs687 bg:color_nm685)\
[▌](fg:color_nm696 bg:color_nm704)\
[▌](fg:color_nm712 bg:color_nm719)\
[▌](fg:color_nm727 bg:color_nm735)\
[▌](fg:color_nm743 bg:color_nm750)\
[▎](fg:color_abs759 bg:color_nm762)\
[▌](fg:color_nm773 bg:transparent)\
\n$character"""

palette = 'sci_fraunhofer'

[palettes.sci_fraunhofer]
color_nm382  = '#2c2348' # 382 nm continuum (left half-cell)
