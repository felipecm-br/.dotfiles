color_paper  = '#ffffff' # Lead white (text on the violet end)
color_ink    = '#06060a' # Lamp black (text on the bright continuum)

# 1. VIOLET 420 nm (just past Ca II H and K, the deepest lines)
[os]
disabled = false
style = "bg:color_nm420 fg:color_paper bold"
format = '[ 󰭎 ]($style)'

# 2. BLUE 468 nm (between the G band and H-beta)
[directory]
style = "bg:color_nm468 fg:color_paper bold"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3

# 3. GREEN 532 nm (just past the magnesium b triplet)
[git_branch]
symbol = " "
style = "bg:color_nm532 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_nm532 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. AMBER 598 nm (just past the sodium D doublet)
[c]
symbol = " "
style = "bg:color_nm598 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_nm598 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_nm598 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_nm598 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_nm598 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_nm598 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

# 5. RED 640 nm (before H-alpha and the telluric oxygen bands)
[time]
disabled = false
time_format = "%R"
style = "bg:color_nm640 fg:color_paper bold"
format = '[ $time ]($style)'


# 6. THE SLIT (success: the spectrum through the prism; error: one absorption line on H-alpha)
[character]
success_symbol = "[❯](bold color_nm420)[❯](bold color_nm532)[❯](bold color_nm640)"
error_symbol = "[▌](fg:color_abs656 bg:color_halpha)[✗❯](bold color_halpha)"
