# ==============================================================================
#  Preset: Chroma Holographic (Iridescent Foil Edition)
#  Inspired by: notMyShell Chroma treatment, extended (stops: #ffb3d9 #ffd6a5 #caffbf #9bf6ff #bdb2ff #ffc6ff)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Holographic foil shifts through pastel hues as it tilts. Segments sample six pastel stops in
# OKLab; each transition is a shade shimmer U+2593 U+2592 U+2591 cross-fading through two more
# samples, and the bar fades in from the terminal (U+2591 U+2592 U+2593) and back out at the end.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](fg:color_s0)\
$os\
[▓](fg:color_s0 bg:color_s01a)\
[▒](fg:color_s01a bg:color_s01b)\
[░](fg:color_s01b bg:color_s1)\

$directory\
[▓](fg:color_s1 bg:color_s12a)\
[▒](fg:color_s12a bg:color_s12b)\
[░](fg:color_s12b bg:color_s2)\

$git_branch$git_status\
[▓](fg:color_s2 bg:color_s23a)\
[▒](fg:color_s23a bg:color_s23b)\
[░](fg:color_s23b bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[▓](fg:color_s3 bg:color_s34a)\
[▒](fg:color_s34a bg:color_s34b)\
[░](fg:color_s34b bg:color_s4)\

$time\
[▓▒░](fg:color_s4)\
\n$character"""

palette = 'chroma_holographic'

[palettes.chroma_holographic]
color_s0    = '#ffb3d9' # t=0.00 segment fill
color_s1    = '#f4e1ab' # t=0.25 segment fill
color_s2    = '#b3fbe0' # t=0.50 segment fill
color_s3    = '#b7c3ff' # t=0.75 segment fill
color_s4    = '#ffc6ff' # t=1.00 segment fill
color_s01a  = '#ffc2c5' # t=0.083 transition step
color_s01b  = '#ffd1af' # t=0.167 transition step
color_s12a  = '#def2b6' # t=0.333 transition step
color_s12b  = '#c6fec5' # t=0.417 transition step
color_s23a  = '#9ff7fa' # t=0.583 transition step
color_s23b  = '#aae0ff' # t=0.667 transition step
color_s34a  = '#c8b6ff' # t=0.833 transition step
color_s34b  = '#e4beff' # t=0.917 transition step
color_ink   = '#15131a' # Ink (text on light fills)
color_error = '#ff3355' # Error (paired with the ✗ shape)

[os]
disabled = false
style = "bg:color_s0 fg:color_ink bold"
format = '[ 󱕅 ]($style)'

[directory]
style = "bg:color_s1 fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_ink bold"
format = '[ $time ]($style)'

# A three-step gradient chevron (starting at the first fill visible on a dark terminal); errors swap to a single-hue ✗ so they never blend into the gradient.
[character]
success_symbol = "[❯](bold color_s0)[❯](bold color_s2)[❯](bold color_s4)"
error_symbol = "[✗❯](bold color_error)"
