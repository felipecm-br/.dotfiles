# ==============================================================================
#  Preset: Chroma Dither Sunset (1-Bit Edition)
#  Inspired by: notMyShell Chroma treatment, extended (stops: #2d1b69 #7a2a8c #d1406f #ff7a4a #ffc65a)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# The transitions add no colors at all: each is a Braille dither ramp (U+28FF U+2877 U+2875 U+2815
# U+2802), fg = one segment over bg = the next, so the eye mixes the gradient from the dot density,
# like an ordered-dither GIF. The bar dithers in from the terminal and back out.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[⠅⠕⡷⣷⣿](fg:color_s0)\
$os\
[⣿⣷⡷⠕⠅⠂](fg:color_s0 bg:color_s1)\

$directory\
[⣿⣷⡷⠕⠅⠂](fg:color_s1 bg:color_s2)\

$git_branch$git_status\
[⣿⣷⡷⠕⠅⠂](fg:color_s2 bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[⣿⣷⡷⠕⠅⠂](fg:color_s3 bg:color_s4)\

$time\
[⣷⡷⠕⠅⠂](fg:color_s4)\
\n$character"""

palette = 'chroma_dither_sunset'

[palettes.chroma_dither_sunset]
color_s0       = '#2d1b69' # t=0.00 segment fill
color_s1       = '#7a2a8c' # t=0.25 segment fill
color_s2       = '#d1406f' # t=0.50 segment fill
color_s3       = '#ff7a4a' # t=0.75 segment fill
color_s4       = '#ffc65a' # t=1.00 segment fill
color_paper    = '#fbfbff' # Paper (text on dark fills)
color_ink_deep = '#000000' # Pure black (contrast correction)
color_ink      = '#15131a' # Ink (text on light fills)
color_error    = '#ff3355' # Error (paired with the ✗ shape)

[os]
disabled = false
style = "bg:color_s0 fg:color_paper bold"
format = '[ 󰖚 ]($style)'

[directory]
style = "bg:color_s1 fg:color_paper bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink_deep bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink_deep bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_ink bold"
format = '[ $time ]($style)'

# A three-step gradient chevron (starting at the first fill visible on a dark terminal); errors swap to a single-hue ✗ so they never blend into the gradient.
[character]
success_symbol = "[❯](bold color_s2)[❯](bold color_s3)[❯](bold color_s4)"
error_symbol = "[✗❯](bold color_error)"
