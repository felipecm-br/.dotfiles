# ==============================================================================
#  Preset: Circuit Board (Through-Hole Edition)
#  Inspired by: Printed circuit boards - copper traces, solder pads and components on green FR-4
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: each component (segment) is soldered to the next by a copper trace drawn in box
# drawing (U+257C, U+2501, U+2533, U+253B) with a tin solder pad U+25CF where traces branch to
# a via. The error prompt is a short circuit: the trace ends in U+2573.
# The modules cascade through: Microcontroller -> Resistor -> Capacitor -> Logic IC -> Status LED
format = """
[](fg:color_chip bg:transparent)\
$os\
[](fg:color_chip bg:color_pcb)\
[╼](fg:color_copper bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[┳](fg:color_copper bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[](fg:color_resistor bg:color_pcb)\

$directory\
[](fg:color_resistor bg:color_pcb)\
[╼](fg:color_copper bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[●](fg:color_solder bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[](fg:color_cap bg:color_pcb)\

$git_branch$git_status\
[](fg:color_cap bg:color_pcb)\
[╼](fg:color_copper bg:color_pcb)\
[┻](fg:color_copper bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[●](fg:color_solder bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[](fg:color_chip bg:color_pcb)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_chip bg:color_pcb)\
[╼](fg:color_copper bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[┳](fg:color_copper bg:color_pcb)\
[━](fg:color_copper bg:color_pcb)\
[](fg:color_led bg:color_pcb)\

$time\
[](fg:color_led bg:color_pcb)\
[╼━●](fg:color_copper bg:color_pcb)\
[](fg:color_pcb bg:transparent)\
\n$character"""

palette = 'art_circuit_board'

[palettes.art_circuit_board]
color_pcb      = '#0b3d1f' # FR-4 solder mask green
color_copper   = '#e0a24a' # Copper trace (HASL-tinned edge)
color_solder   = '#cfd5dc' # Solder pad (tin-silver)
color_chip     = '#16171b' # IC package (black epoxy)
color_resistor = '#d8b98a' # Resistor body (beige carbon film)
color_cap      = '#2563c4' # Electrolytic capacitor sleeve (blue)
color_led      = '#ff3b30' # LED (red, lit)
color_silk     = '#f4f6f2' # Silkscreen white (component labels)

# 1. MICROCONTROLLER (the black epoxy brain)
[os]
disabled = false
style = "bg:color_chip fg:color_silk bold"
format = '[ 󰘚 ]($style)'

# 2. RESISTOR (the path limits the current)
[directory]
style = "bg:color_resistor fg:color_chip bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. CAPACITOR (stores the branch state)
[git_branch]
symbol = " "
style = "bg:color_cap fg:color_silk bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_cap fg:color_silk bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. LOGIC IC (the toolchain gates)
[c]
symbol = " "
style = "bg:color_chip fg:color_silk bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_chip fg:color_silk bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_chip fg:color_silk bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_chip fg:color_silk bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_chip fg:color_silk bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_chip fg:color_silk bold"
format = '[ $symbol($version) ]($style)'

# 5. STATUS LED (blinks the time)
[time]
disabled = false
time_format = "%R"
style = "bg:color_led fg:color_chip bold"
format = '[ $time ]($style)'

# 6. THE TRACE (a solder pad leads to the cursor; errors short the circuit)
[character]
success_symbol = "[●](bold color_solder)[━╾](bold color_copper)[ ❯](bold color_led)"
error_symbol = "[●](bold color_solder)[━╳](bold color_led)[ ✗](bold color_led)"
