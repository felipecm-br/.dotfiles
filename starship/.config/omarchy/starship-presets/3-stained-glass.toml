# ==============================================================================
#  Preset: Stained Glass (Sainte-Chapelle Edition)
#  Inspired by: Sainte-Chapelle, Paris (1248) - jewel-toned panes held in lead cames
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: each segment is a pane; the lead came is a half block (U+258C / U+2590) in dark
# lead. Between panes a small mosaic: diagonal quadrants (U+259E, U+259A) of two other jewels
# over a third, split by a heavy came line U+2503, like the medallions of a lancet window.
# The modules cascade through: Sapphire -> Amber -> Ruby -> Emerald -> Opal
format = """
[▐](fg:color_sapphire bg:transparent)\
$os\
[▌](fg:color_sapphire bg:color_lead)\
[▞](fg:color_ruby bg:color_opal)\
[┃](fg:color_lead bg:color_opal)\
[▚](fg:color_emerald bg:color_opal)\
[▐](fg:color_amber bg:color_lead)\

$directory\
[▌](fg:color_amber bg:color_lead)\
[▞](fg:color_amethyst bg:color_opal)\
[┃](fg:color_lead bg:color_opal)\
[▚](fg:color_sapphire bg:color_opal)\
[▐](fg:color_ruby bg:color_lead)\

$git_branch$git_status\
[▌](fg:color_ruby bg:color_lead)\
[▞](fg:color_amber bg:color_sapphire)\
[┃](fg:color_lead bg:color_sapphire)\
[▚](fg:color_opal bg:color_sapphire)\
[▐](fg:color_emerald bg:color_lead)\

$c$rust$golang$nodejs$deno$python\
[▌](fg:color_emerald bg:color_lead)\
[▞](fg:color_ruby bg:color_amber)\
[┃](fg:color_lead bg:color_amber)\
[▚](fg:color_amethyst bg:color_amber)\
[▐](fg:color_opal bg:color_lead)\

$time\
[▌](fg:color_opal bg:color_lead)\
[▞](fg:color_opal bg:color_ruby)\
[┃](fg:color_lead bg:color_ruby)\
[▚](fg:color_amber bg:color_ruby)\
[▌](fg:color_lead bg:transparent)\
\n$character"""

palette = 'art_stained_glass'

[palettes.art_stained_glass]
color_lead     = '#141018' # Lead came (the H-section strip holding the glass)
color_ruby     = '#c8102e' # Ruby glass (gold chloride)
color_sapphire = '#1f4fd1' # Sapphire glass (cobalt oxide)
color_emerald  = '#16a36a' # Emerald glass (copper oxide)
color_amber    = '#f2a900' # Amber glass (silver stain)
color_amethyst = '#8a3fd1' # Amethyst glass (manganese oxide)
color_opal     = '#f3ead2' # Opal glass (the light coming through)
color_ink      = '#141018' # Ink (text on light glass)

# 1. SAPPHIRE (the cobalt field behind the saints)
[os]
disabled = false
style = "bg:color_sapphire fg:color_opal bold"
format = '[ 󰅄 ]($style)'

# 2. AMBER (the silver-stained halo, where you are)
[directory]
style = "bg:color_amber fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. RUBY (the branching tracery)
[git_branch]
symbol = " "
style = "bg:color_ruby fg:color_opal bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_ruby fg:color_opal bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. EMERALD (the borders of the medallions)
[c]
symbol = " "
style = "bg:color_emerald fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_emerald fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_emerald fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_emerald fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_emerald fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_emerald fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

# 5. OPAL (daylight through the rose)
[time]
disabled = false
time_format = "%R"
style = "bg:color_opal fg:color_ink bold"
format = '[ $time ]($style)'

# 6. THE ROSE (three panes at the cursor; errors flood them ruby)
[character]
success_symbol = "[▞](bold color_ruby)[▚](bold color_sapphire)[▞](bold color_amber)[ ❯](bold color_emerald)"
error_symbol = "[▞▚▞](bold color_ruby)[ ✗](bold color_ruby)"
