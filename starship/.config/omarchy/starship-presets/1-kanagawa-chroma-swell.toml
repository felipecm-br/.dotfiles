# ==============================================================================
#  Preset: Kanagawa Chroma Swell (Rising Tide)
#  Inspired by: Katsushika Hokusai, The Great Wave off Kanagawa (c. 1831), evolved from aaa.toml
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Each seam is a ramp of eighth blocks (U+2582 U+2584 U+2586): the next segment's OKLab color rises
# from the floor of the previous one like a swell, one profile per seam. The line ends on the same ramp
# reversed, so the wave ebbs back into the terminal background.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

# Prussian abyss -> indigo swell -> seafoam claw -> lead-white crest -> ochre horizon
format = """
[▂▄▆](fg:color_s0)\
$os\
[▂](fg:color_x2 bg:color_s0)\
[▄](fg:color_x3 bg:color_s0)\
[▆](fg:color_x4 bg:color_s0)\

$directory\
[▂](fg:color_x5 bg:color_s1)\
[▄](fg:color_x6 bg:color_s1)\
[▆](fg:color_x7 bg:color_s1)\

$git_branch$git_status\
[▂](fg:color_x8 bg:color_s2)\
[▄](fg:color_x9 bg:color_s2)\
[▆](fg:color_x10 bg:color_s2)\

$c$rust$golang$nodejs$deno$python\
[▂](fg:color_x11 bg:color_s3)\
[▄](fg:color_x12 bg:color_s3)\
[▆](fg:color_x13 bg:color_s3)\

$time\
[▆](fg:color_s4 bg:transparent)\
[▄](fg:color_x0 bg:transparent)\
[▂](fg:color_x1 bg:transparent)\

\n$character"""

palette = 'kanagawa_chroma_swell'

[palettes.kanagawa_chroma_swell]
color_s0      = '#071e3d' # t=0.00 segment fill, Prussian Blue abyss
color_s1      = '#1f4e70' # t=0.25 segment fill, Indigo swell
color_s2      = '#6d94a6' # t=0.50 segment fill, Seafoam slate
color_s3      = '#f2f5f7' # t=0.75 segment fill, Lead-white foam
color_s4      = '#c7ad7f' # t=1.00 segment fill, Ochre horizon
color_t0      = '#ffffff' # text on s0 (contrast 16.6:1)
color_t1      = '#ffffff' # text on s1 (contrast 8.8:1)
color_t2      = '#051329' # text on s2 (contrast 5.7:1)
color_t3      = '#051329' # text on s3 (contrast 16.9:1)
color_t4      = '#051329' # text on s4 (contrast 8.6:1)
color_x0      = '#af976e' # transition step (OKLab sample between neighbouring segments)
color_x1      = '#98825e' # transition step (OKLab sample between neighbouring segments)
color_x2      = '#0f2e4e' # transition step (OKLab sample between neighbouring segments)
color_x3      = '#163d5e' # transition step (OKLab sample between neighbouring segments)
color_x4      = '#1c496b' # transition step (OKLab sample between neighbouring segments)
color_x5      = '#3b6683' # transition step (OKLab sample between neighbouring segments)
color_x6      = '#527b93' # transition step (OKLab sample between neighbouring segments)
color_x7      = '#658da1' # transition step (OKLab sample between neighbouring segments)
color_x8      = '#9bb5c2' # transition step (OKLab sample between neighbouring segments)
color_x9      = '#c2d2da' # transition step (OKLab sample between neighbouring segments)
color_x10     = '#e4ebef' # transition step (OKLab sample between neighbouring segments)
color_x11     = '#e3dccd' # transition step (OKLab sample between neighbouring segments)
color_x12     = '#d6c6a9' # transition step (OKLab sample between neighbouring segments)
color_x13     = '#cbb48b' # transition step (OKLab sample between neighbouring segments)
color_error   = '#c84b31' # Cinnabar (Hokusai hanko seal)
color_ok      = '#9fc3d3' # Seafoam glint (success)

# 1. THE DEEP ABYSS
[os]
disabled = false
style = "bg:color_s0 fg:color_t0 bold"
format = '[ 🌊 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_s1 fg:color_t1 bold"
format = "[󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURLING SEAFOAM
[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[$symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_t2 bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE BREAKING CREST (languages ride on the foam)
[c]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

# 5. THE OCHRE HORIZON
[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_t4 bold"
format = '[ $time ]($style)'

# THE HANKO SEAL
[character]
success_symbol = "[≋❯](bold color_ok)"
error_symbol = "[≋❯](bold color_error)"
