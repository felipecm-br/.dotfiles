# ==============================================================================
#  Preset: Santorini (Oia Sunset Edition)
#  Inspired by: Oia, Santorini - whitewashed cube houses and blue-domed churches on the caldera cliff
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: on the red pumice cliff the village climbs in eighth blocks of whitewash, and
# each church cupola is a left and right half circle (U+E0B6 U+E0B4) in dome blue set on a
# whitewashed cell: a round blue dome. A Braille dot of bougainvillea hangs off a wall.
# The modules cascade through: Aegean -> Whitewash -> Dome Blue -> Bougainvillea -> Oia Sunset
format = """
[](fg:color_aegean bg:transparent)\
$os\
[](fg:color_aegean bg:color_cliff)\
[▄▆](fg:color_white bg:color_cliff)\
[](fg:color_dome bg:color_white)\
[](fg:color_dome bg:color_white)\
[▆▃](fg:color_white bg:color_cliff)\
[⠂](fg:color_bougainvillea bg:color_cliff)\
[](fg:color_white bg:color_cliff)\

$directory\
[](fg:color_white bg:color_cliff)\
[▄▆](fg:color_white bg:color_cliff)\
[](fg:color_dome bg:color_white)\
[](fg:color_dome bg:color_white)\
[▆▃](fg:color_white bg:color_cliff)\
[▅](fg:color_white bg:color_cliff)\
[](fg:color_dome bg:color_cliff)\

$git_branch$git_status\
[](fg:color_dome bg:color_cliff)\
[▄▆](fg:color_white bg:color_cliff)\
[](fg:color_dome bg:color_white)\
[](fg:color_dome bg:color_white)\
[▆▃](fg:color_white bg:color_cliff)\
[⠂](fg:color_bougainvillea bg:color_cliff)\
[](fg:color_bougainvillea bg:color_cliff)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_bougainvillea bg:color_cliff)\
[▄▆](fg:color_white bg:color_cliff)\
[](fg:color_dome bg:color_white)\
[](fg:color_dome bg:color_white)\
[▆▃](fg:color_white bg:color_cliff)\
[▅](fg:color_white bg:color_cliff)\
[](fg:color_oia bg:color_cliff)\

$time\
[](fg:color_oia bg:color_cliff)\
[▄▆](fg:color_white bg:color_cliff)\
[](fg:color_dome bg:color_white)\
[](fg:color_dome bg:color_white)\
[▃](fg:color_white bg:color_cliff)\
[](fg:color_cliff bg:transparent)\
\n$character"""

palette = 'place_santorini'

[palettes.place_santorini]
color_cliff         = '#c99a72' # Caldera cliff (sunlit pumice and tuff)
color_white         = '#f7f5ef' # Whitewash (lime on the cube houses)
color_dome          = '#1e5fbf' # Dome blue (the church cupolas)
color_aegean        = '#0d4f8b' # Aegean deep blue
color_bougainvillea = '#c2186b' # Bougainvillea magenta
color_oia           = '#e8552a' # Oia sunset
color_olive         = '#6b7a3a' # Olive grove green
color_paper         = '#ffffff' # Paper (text on dark fills)
color_ink           = '#14202e' # Ink (text on light fills)

# 1. AEGEAN (the caldera sea)
[os]
disabled = false
style = "bg:color_aegean fg:color_paper bold"
format = '[ 󱁏 ]($style)'

# 2. WHITEWASH (the alley where you are)
[directory]
style = "bg:color_white fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. DOME BLUE (the churches at every turn)
[git_branch]
symbol = " "
style = "bg:color_dome fg:color_paper bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_dome fg:color_paper bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. BOUGAINVILLEA (the flowers over the doorways)
[c]
symbol = " "
style = "bg:color_bougainvillea fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_bougainvillea fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_bougainvillea fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_bougainvillea fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_bougainvillea fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_bougainvillea fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

# 5. OIA SUNSET (the most watched clock in Greece)
[time]
disabled = false
time_format = "%R"
style = "bg:color_oia fg:color_ink bold"
format = '[ $time ]($style)'

# 6. THE DOME (a blue cupola at the cursor; errors blush it bougainvillea)
[character]
success_symbol = "[](bold color_dome)[](bold color_dome)[ ❯](bold color_oia)"
error_symbol = "[](bold color_bougainvillea)[](bold color_bougainvillea)[ ✗](bold color_bougainvillea)"
