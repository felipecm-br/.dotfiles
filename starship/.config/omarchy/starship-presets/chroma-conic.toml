# ==============================================================================
#  Preset: Chroma Conic (Color Wheel Loop Edition)
#  Inspired by: notMyShell Chroma treatment, extended (OKLCH L=0.74 C=0.15, hue 330 -> 690 (one full turn))
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# A conic gradient unrolled: the hue makes one full turn of the OKLCH wheel (330 -> 690 degrees)
# at constant lightness and chroma, so the last segment is the same color as the first and the
# bar is a closed loop. Transitions are pearls, half circles U+E0B4 stepping through the hue angle.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_s0 bg:transparent)\
$os\
[](fg:color_s0 bg:color_s01a)\
[](fg:color_s01a bg:color_s01b)\
[](fg:color_s01b bg:color_s1)\

$directory\
[](fg:color_s1 bg:color_s12a)\
[](fg:color_s12a bg:color_s12b)\
[](fg:color_s12b bg:color_s2)\

$git_branch$git_status\
[](fg:color_s2 bg:color_s23a)\
[](fg:color_s23a bg:color_s23b)\
[](fg:color_s23b bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_s3 bg:color_s34a)\
[](fg:color_s34a bg:color_s34b)\
[](fg:color_s34b bg:color_s4)\

$time\
[](fg:color_s4 bg:transparent)\
\n$character"""

palette = 'chroma_conic'

[palettes.chroma_conic]
color_s0    = '#df86d7' # hue 330 segment fill
color_s1    = '#ee9138' # hue 60 segment fill
color_s2    = '#5ac576' # hue 150 segment fill
color_s3    = '#39b5ff' # hue 240 segment fill
color_s4    = '#df86d7' # hue 330 segment fill
color_s01a  = '#f57fa7' # hue 0 step
color_s01b  = '#fb8371' # hue 30 step
color_s12a  = '#cfa508' # hue 90 step
color_s12b  = '#9fb83c' # hue 120 step
color_s23a  = '#00c9ae' # hue 180 step
color_s23b  = '#00c3df' # hue 210 step
color_s34a  = '#86a4ff' # hue 270 step
color_s34b  = '#ba93fb' # hue 300 step
color_ink   = '#15131a' # Ink (text on light fills)
color_error = '#ff3355' # Error (paired with the ✗ shape)

[os]
disabled = false
style = "bg:color_s0 fg:color_ink bold"
format = '[ 󱦙 ]($style)'

[directory]
style = "bg:color_s1 fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_ink bold"
format = '[ $time ]($style)'

# A three-step gradient chevron (starting at the first fill visible on a dark terminal); errors swap to a single-hue ✗ so they never blend into the gradient.
[character]
success_symbol = "[❯](bold color_s0)[❯](bold color_s2)[❯](bold color_s4)"
error_symbol = "[✗❯](bold color_error)"
