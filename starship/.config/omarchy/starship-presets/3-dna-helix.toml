# ==============================================================================
#  Preset: Double Helix (Photo 51 Edition)
#  Inspired by: Rosalind Franklin and Raymond Gosling, "Photo 51" (1952) - the X of the B-form helix
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: the backbones cross as U+2573 (the X that Photo 51 revealed); between crossings a
# base pair is a heavy-left bond U+257E plus a heavy-right bond U+257C, colored by base and
# always paired Watson-Crick (A-T, G-C). Segments are stained in backbone and base colors.
# The modules cascade through: Backbone -> Adenine -> Thymine -> Guanine -> Cytosine
format = """
[](fg:color_strand bg:transparent)\
$os\
[](fg:color_strand bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_adenine bg:color_lab)\
[╼](fg:color_thymine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[](fg:color_adenine bg:color_lab)\

$directory\
[](fg:color_adenine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_guanine bg:color_lab)\
[╼](fg:color_cytosine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_thymine bg:color_lab)\
[╼](fg:color_adenine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[](fg:color_thymine bg:color_lab)\

$git_branch$git_status\
[](fg:color_thymine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_cytosine bg:color_lab)\
[╼](fg:color_guanine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[](fg:color_guanine bg:color_lab)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_guanine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_adenine bg:color_lab)\
[╼](fg:color_thymine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_guanine bg:color_lab)\
[╼](fg:color_cytosine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[](fg:color_cytosine bg:color_lab)\

$time\
[](fg:color_cytosine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[╾](fg:color_thymine bg:color_lab)\
[╼](fg:color_adenine bg:color_lab)\
[╳](fg:color_strand bg:color_lab)\
[](fg:color_lab bg:transparent)\
\n$character"""

palette = 'art_dna_helix'

[palettes.art_dna_helix]
color_lab      = '#0e1426' # Lab dark (fluorescence imaging background)
color_strand   = '#7fd1ff' # Sugar-phosphate backbone (SYBR-stained blue)
color_adenine  = '#ff6b6b' # Adenine (A)
color_thymine  = '#ffd166' # Thymine (T)
color_guanine  = '#06d6a0' # Guanine (G)
color_cytosine = '#b49cff' # Cytosine (C)

# 1. BACKBONE (the sugar-phosphate rail)
[os]
disabled = false
style = "bg:color_strand fg:color_lab bold"
format = '[ 󰚄 ]($style)'

# 2. ADENINE (where the read starts)
[directory]
style = "bg:color_adenine fg:color_lab bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THYMINE (the branch that pairs with it)
[git_branch]
symbol = " "
style = "bg:color_thymine fg:color_lab bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_thymine fg:color_lab bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. GUANINE (the toolchain)
[c]
symbol = " "
style = "bg:color_guanine fg:color_lab bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_guanine fg:color_lab bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_guanine fg:color_lab bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_guanine fg:color_lab bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_guanine fg:color_lab bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_guanine fg:color_lab bold"
format = '[ $symbol($version) ]($style)'

# 5. CYTOSINE (the clock that closes the sequence)
[time]
disabled = false
time_format = "%R"
style = "bg:color_cytosine fg:color_lab bold"
format = '[ $time ]($style)'

# 6. THE BASE PAIR (G-C at the cursor; an error is a G-A mismatch, a mutation)
[character]
success_symbol = "[╾](bold color_guanine)[╼](bold color_cytosine)[ ❯](bold color_strand)"
error_symbol = "[╾](bold color_guanine)[╼](bold color_adenine)[ ✗](bold color_adenine)"
