# ==============================================================================
#  Preset: The Great Wave off Kanagawa v9 (Panorama Mixed-Media Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - Kanagawa oki nami ura, Thirty-Six Views of Mount Fuji
#  Derived from: aaa.toml (Ukiyo-e Crest Edition)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph family: blocks + shades + quadrants + Braille + geometric: one glyph family per physical layer
# The modules cascade through: Rising Sea -> Bokashi Abyss -> Swell -> Shattering Claws -> Spray -> Curl -> Falling Crest -> Paper Sky and Fuji
format = """
[▁▂▄▆](fg:color_abyss)\
$os\
[▓▒░](fg:color_abyss bg:color_swell)\

$directory\
[▄▆](fg:color_foam bg:color_swell)\
[▜▚](fg:color_foam bg:color_seafoam)\
[⠂⠁](fg:color_white bg:color_seafoam)\

$git_branch$git_status\
[⣀⣠⣴⣾](fg:color_foam bg:color_seafoam)\

$c$rust$golang$nodejs$deno$python\
[▇▅▃▁](fg:color_foam bg:color_sky)\

$time\
[▲](fg:color_fuji bg:color_sky)\
[▓▒░](fg:color_sky bg:transparent)\
\n$character"""

palette = 'kanagawa_v9'

[palettes.kanagawa_v9]
color_trench  = '#051329' # Midnight trench (dark text)
color_abyss   = '#071e3d' # Prussian Blue (Berlin blue, the wave's base)
color_swell   = '#1f4e70' # Ai indigo (the rising swell)
color_seafoam = '#6d94a6' # Seafoam slate (the curling claws)
color_foam    = '#f2f5f7' # Gofun shell white (breaking crest, Fuji snow)
color_white   = '#ffffff' # Bare paper highlight (airborne spray)
color_sky     = '#d8c49a' # Yellowed kōzo paper sky
color_fuji    = '#3e5770' # Fuji slate (the distant cone)
color_hanko   = '#c84b31' # Shuniku cinnabar (Hokusai's seal)

# 1. THE ABYSS (block-rise out of the void, bokashi into the swell)
[os]
disabled = false
style = "bg:color_abyss fg:color_foam bold"
format = '[ 󰠳 ]($style)'

# 2. THE SWELL (foam climbing, the lip shattering into quadrants, spray as dots)
[directory]
style = "bg:color_swell fg:color_foam bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURL (Braille dots rolling over diagonally into the crest)
[git_branch]
symbol = " "
style = "bg:color_seafoam fg:color_trench bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_seafoam fg:color_trench bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE GOFUN CREST (falling in eighth blocks)
[c]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

# 5. THE PAPER SKY AND MOUNT FUJI (dithering off into the terminal)
[time]
disabled = false
time_format = "%R"
style = "bg:color_sky fg:color_trench bold"
format = '[ $time ]($style)'

# 6. THE SWELL PROMPT AND THE HANKO SEAL
[character]
success_symbol = "[≋❯](bold color_seafoam)"
error_symbol = "[≋❯](bold color_hanko)"
