# ==============================================================================
#  Preset: Grand Piano (Recital Hall Edition)
#  Inspired by: The concert grand keyboard - the 2 + 3 grouping of sharps that every pianist reads by touch
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: on an ivory ground each sharp is a right half block U+2590 followed by a left half
# block U+258C, so the black key straddles the seam between two naturals. Sharps come in the
# real groups of two (C#, D#) and three (F#, G#, A#), split by the E-F gap.
# The modules cascade through: Ebony Case -> Velvet Bench -> Brass Pedals -> Walnut Desk -> Spotlight
format = """
[](fg:color_ebony bg:transparent)\
$os\
[](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[](fg:color_velvet bg:color_ivory)\

$directory\
[](fg:color_velvet bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[](fg:color_brass bg:color_ivory)\

$git_branch$git_status\
[](fg:color_brass bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[ ](bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[](fg:color_walnut bg:color_ivory)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_walnut bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[](fg:color_gold bg:color_ivory)\

$time\
[](fg:color_gold bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[▐](fg:color_ebony bg:color_ivory)\
[▌](fg:color_ebony bg:color_ivory)\
[](fg:color_ivory bg:transparent)\
\n$character"""

palette = 'art_grand_piano'

[palettes.art_grand_piano]
color_ebony  = '#0d0c0f' # Ebony lacquer (the case and the sharps)
color_ivory  = '#f4eedf' # Ivory (the naturals)
color_velvet = '#7a1f2b' # Burgundy velvet (the bench and the hall seats)
color_brass  = '#c9a24a' # Brass (pedals and pin plate)
color_walnut = '#5a3a22' # Walnut (the music desk)
color_gold   = '#e6a532' # Stage light (the spotlight on the keys)

# 1. EBONY CASE (the lid open on its stick)
[os]
disabled = false
style = "bg:color_ebony fg:color_ivory bold"
format = '[ 󰙽 ]($style)'

# 2. VELVET BENCH (where you sit)
[directory]
style = "bg:color_velvet fg:color_ivory bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. BRASS PEDALS (sustain, sostenuto, una corda: the branches)
[git_branch]
symbol = " "
style = "bg:color_brass fg:color_ebony bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_brass fg:color_ebony bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. WALNUT DESK (the scores on the music stand)
[c]
symbol = " "
style = "bg:color_walnut fg:color_ivory bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_walnut fg:color_ivory bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_walnut fg:color_ivory bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_walnut fg:color_ivory bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_walnut fg:color_ivory bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_walnut fg:color_ivory bold"
format = '[ $symbol($version) ]($style)'

# 5. SPOTLIGHT (the tempo of the evening)
[time]
disabled = false
time_format = "%R"
style = "bg:color_gold fg:color_ebony bold"
format = '[ $time ]($style)'

# 6. THE NOTE (a gold note at the cursor; a wrong note turns velvet red)
[character]
success_symbol = "[󰎇](bold color_gold)[ ❯](bold color_ivory)"
error_symbol = "[󰎇](bold color_velvet)[ ✗](bold color_velvet)"
