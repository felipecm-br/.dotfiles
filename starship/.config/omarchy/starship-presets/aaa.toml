# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# The modules cascade from Deep Ocean -> Swell -> Seafoam -> White Crest -> Sandy Horizon
format = """
[](fg:color_os)\
$os\
[](fg:color_white bg:color_os)\
[](fg:color_white bg:color_dir)\
[](fg:color_lang bg:color_git)\
$git_branch$git_status\

[](fg:color_white bg:color_git)\
[](fg:color_lang bg:color_dark_bubbles)\
[](fg:color_dark_bubbles bg:color_dir)\
$directory\

[](fg:color_white bg:color_dir)\
[](fg:color_lang bg:color_wet_sand)\
[](fg:color_wet_sand bg:color_time)\
$deno\

$time\
[](fg:color_white bg:color_time)\
[](fg:color_lang bg:color_dark)\
[](fg:color_dark bg:transparent)\


\n$character"""

palette = 'kanagawa_great_wave'

[palettes.kanagawa_great_wave]
color_bg   = '#051329' # Deepest Midnight Trench (High-contrast dark text)
color_os   = '#071e3d' # Deep Prussian Blue (Base of the Great Wave)
color_dir  = '#1f4e70' # Mid-Wave Indigo (Rising swell)
color_git  = '#6d94a6' # Seafoam Slate (Curling wave claws)
color_lang = '#f2f5f7' # Crisp White Foam (Breaking crest & Mt. Fuji snow)
color_time = '#c7ad7f' # Warm Ochre Sand (Rowboats & warm sky horizon)
color_fuji = '#58636d' # Stormy Grey (Mist behind Mount Fuji)
color_rose = '#3a2c2c' # Stormy Grey (Mist behind Mount Fuji)
color_wet_sand = '#887656' #s
color_dark_bubbles = '#4590c6' #s
color_dark = '#e07777' # Stormy Grey (Mist behind Mount Fuji)
color_sky = '#87b5e0' # Stormy Grey (Mist behind Mount Fuji)
color_white = '#ffffff'

[deno]
symbol = "o"
style = "bg:color_lang fg:color_os bold"
format = '[$symbol]($style)'

# 1. THE DEEP ABYSS
[os]
disabled = false
style = "bg:color_os fg:color_lang bold"
format = '[ 󰠳 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_dir fg:color_lang bold"
format = "[󰲋 $path ]($style)"

# 3. THE CURLING SEAFOAM
[git_branch]
symbol = " "
style = "bg:color_git fg:color_bg bold"
format = '[$symbol$branch ]($style)'

[git_status]
style = "bg:color_git fg:color_bg bold"
format = '([$all_status$ahead_behind ]($style))'

[wave_crest]
symbol = ""
style = "bg:color_lang fg:color_os bold"
format = '[ $symbol($version) ]($style)'

[wave3_crest]
symbol = ""
style = "bg:color_sky fg:color_os bold"
format = '[ $symbol($version) ]($style)'

# [wave3crestshadow]
# symbol = ""
# style = "bg:color_wet_sand fg:color_os bold"
# format = ' [$symbol]($style) '

# [wave2_crest_shadow]
# symbol = ""
# style = "bg:color_wet_sand fg:color_os bold"
# format = '[$symbol]($style)'

# [wave1_crest_shadow]
# symbol = ""
# style = "bg:color_wet_sand fg:color_os bold"
# format = '[$symbol]($style)'

[bubbles]
symbol = ""
style = "bg:color_rose fg:color_os bold"
format = '[$symbol]($style)'

# 5. THE WOODEN BOATS & HORIZON SKY
[time]
disabled = false
time_format = "%R"
style = "bg:color_time fg:color_bg bold"
format = '[ $time ]($style)'

# THE SWELL PROMPT
[character]
success_symbol = "[≈❯](bold #6d94a6)"
error_symbol = "[≈❯](bold #c84b31)" # Traditional Japanese Hokusai Hanko Stamp Red