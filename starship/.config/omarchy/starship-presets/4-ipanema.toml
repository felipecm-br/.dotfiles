# ==============================================================================
#  Preset: Ipanema (Calcadao Edition)
#  Inspired by: The Rio calcadao - Portuguese-pavement waves in black basalt and white limestone, Arpoador sunset
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: each gap is a strip of the calcadao. The black basalt wave is Braille filled
# below a sine (braille.py area(wave)) on the white limestone ground, so the stripe undulates
# like the pavement Roberto Burle Marx and the Portuguese calceteiros laid along the beach;
# its phase shifts per gap. The bar ends on Dois Irmaos: two peaks (U+E0BA U+E0B8 twice) at dusk.
# The modules cascade through: Atlantic -> Sand -> Quiosque -> Arpoador Sunset -> Dusk
format = """
[](fg:color_atlantic bg:transparent)\
$os\
[](fg:color_atlantic bg:color_pedra)\
[⣼⣿⣆⣀](fg:color_basalto bg:color_pedra)\
[](fg:color_sand bg:color_pedra)\

$directory\
[](fg:color_sand bg:color_pedra)\
[⣿⣆⣀⣼](fg:color_basalto bg:color_pedra)\
[](fg:color_coco bg:color_pedra)\

$git_branch$git_status\
[](fg:color_coco bg:color_pedra)\
[⣆⣀⣼⣿](fg:color_basalto bg:color_pedra)\
[](fg:color_sunset bg:color_pedra)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_sunset bg:color_pedra)\
[⣀⣼⣿⣆](fg:color_basalto bg:color_pedra)\
[](fg:color_dusk bg:color_pedra)\

$time\
[](fg:color_rock bg:color_dusk)\
[](fg:color_rock bg:color_dusk)\
[](fg:color_rock bg:color_dusk)\
[](fg:color_rock bg:transparent)\
\n$character"""

palette = 'place_ipanema'

[palettes.place_ipanema]
color_pedra    = '#f1ece0' # Calcario branco (white limestone setts)
color_basalto  = '#1c1a1a' # Basalto negro (black basalt setts)
color_atlantic = '#0b6e8a' # Atlantic teal (the surf at Posto 9)
color_sand     = '#dcbf7e' # Ipanema sand
color_coco     = '#3f9b5a' # Coconut-stand green (the quiosques)
color_sunset   = '#f28c38' # Arpoador sunset (the applause hour)
color_dusk     = '#5a3f7a' # Dusk violet behind the mountains
color_rock     = '#241a33' # Dois Irmaos granite (the two brothers in silhouette)
color_paper    = '#fdf8ee' # Paper (text on dark fills)
color_ink      = '#1c1a1a' # Ink (text on light fills)

# 1. ATLANTIC (the surf at Posto 9)
[os]
disabled = false
style = "bg:color_atlantic fg:color_paper bold"
format = '[ 󱁕 ]($style)'

# 2. SAND (where you lay your canga)
[directory]
style = "bg:color_sand fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. QUIOSQUE (coconut water, the branches of the beach)
[git_branch]
symbol = " "
style = "bg:color_coco fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_coco fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. ARPOADOR SUNSET (the crowd applauds the sun)
[c]
symbol = " "
style = "bg:color_sunset fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_sunset fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_sunset fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_sunset fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_sunset fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_sunset fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

# 5. DUSK (the hour behind Dois Irmaos)
[time]
disabled = false
time_format = "%R"
style = "bg:color_dusk fg:color_paper bold"
format = '[ $time ]($style)'

# 6. THE WAVE (the calcadao at the cursor; errors burn it sunset orange)
[character]
success_symbol = "[⠼⠙⣆](bold color_pedra)[ ❯](bold color_sunset)"
error_symbol = "[⠼⠙⣆](bold color_sunset)[ ✗](bold color_sunset)"
