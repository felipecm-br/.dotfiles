# ==============================================================================
#  Preset: Kanagawa Chroma Bokashi (Woodblock Gradation)
#  Inspired by: Katsushika Hokusai, The Great Wave off Kanagawa (c. 1831), evolved from aaa.toml
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Bokashi is the woodblock technique Hokusai used to fade Prussian blue into the sky: the printer
# wipes the ink off the block so one tone dissolves into the next. Here each seam is three shade
# cells (U+2593 U+2592 U+2591) whose fg slides from the left segment and whose bg slides to the
# right one, so the dither density and the OKLab color move together.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

# Prussian abyss -> indigo swell -> seafoam claw -> lead-white crest -> ochre horizon
format = """
[](fg:color_s0)\
$os\
[▓](fg:color_s0 bg:color_x2)\
[▒](fg:color_x3 bg:color_x4)\
[░](fg:color_x5 bg:color_s1)\

$directory\
[▓](fg:color_s1 bg:color_x6)\
[▒](fg:color_x7 bg:color_x8)\
[░](fg:color_x9 bg:color_s2)\

$git_branch$git_status\
[▓](fg:color_s2 bg:color_x10)\
[▒](fg:color_x11 bg:color_x12)\
[░](fg:color_x13 bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[▓](fg:color_s3 bg:color_x14)\
[▒](fg:color_x15 bg:color_x16)\
[░](fg:color_x17 bg:color_s4)\

$time\
[▓](fg:color_s4 bg:transparent)\
[▒](fg:color_x0 bg:transparent)\
[░](fg:color_x1 bg:transparent)\

\n$character"""

palette = 'kanagawa_chroma_bokashi'

[palettes.kanagawa_chroma_bokashi]
color_s0      = '#071e3d' # t=0.00 segment fill, Prussian Blue abyss
color_s1      = '#1f4e70' # t=0.25 segment fill, Indigo swell
color_s2      = '#6d94a6' # t=0.50 segment fill, Seafoam slate
color_s3      = '#f2f5f7' # t=0.75 segment fill, Lead-white foam
color_s4      = '#c7ad7f' # t=1.00 segment fill, Ochre horizon
color_t0      = '#ffffff' # text on s0 (contrast 16.6:1)
color_t1      = '#ffffff' # text on s1 (contrast 8.8:1)
color_t2      = '#051329' # text on s2 (contrast 5.7:1)
color_t3      = '#051329' # text on s3 (contrast 16.9:1)
color_t4      = '#051329' # text on s4 (contrast 8.6:1)
color_x0      = '#b49c71' # transition step (OKLab sample between neighbouring segments)
color_x1      = '#a18b64' # transition step (OKLab sample between neighbouring segments)
color_x2      = '#163e5f' # transition step (OKLab sample between neighbouring segments)
color_x3      = '#0a2645' # transition step (OKLab sample between neighbouring segments)
color_x4      = '#1a4567' # transition step (OKLab sample between neighbouring segments)
color_x5      = '#0e2d4d' # transition step (OKLab sample between neighbouring segments)
color_x6      = '#537c94' # transition step (OKLab sample between neighbouring segments)
color_x7      = '#2d5a79' # transition step (OKLab sample between neighbouring segments)
color_x8      = '#60889d' # transition step (OKLab sample between neighbouring segments)
color_x9      = '#396582' # transition step (OKLab sample between neighbouring segments)
color_x10     = '#c5d4dc' # transition step (OKLab sample between neighbouring segments)
color_x11     = '#83a4b3' # transition step (OKLab sample between neighbouring segments)
color_x12     = '#dbe4e9' # transition step (OKLab sample between neighbouring segments)
color_x13     = '#98b3c0' # transition step (OKLab sample between neighbouring segments)
color_x14     = '#d5c5a7' # transition step (OKLab sample between neighbouring segments)
color_x15     = '#ebe9e2' # transition step (OKLab sample between neighbouring segments)
color_x16     = '#ceb993' # transition step (OKLab sample between neighbouring segments)
color_x17     = '#e4ddcf' # transition step (OKLab sample between neighbouring segments)
color_error   = '#c84b31' # Cinnabar (Hokusai hanko seal)
color_ok      = '#9fc3d3' # Seafoam glint (success)

# 1. THE DEEP ABYSS
[os]
disabled = false
style = "bg:color_s0 fg:color_t0 bold"
format = '[ 🌊 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_s1 fg:color_t1 bold"
format = "[󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURLING SEAFOAM
[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[$symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_t2 bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE BREAKING CREST (languages ride on the foam)
[c]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

# 5. THE OCHRE HORIZON
[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_t4 bold"
format = '[ $time ]($style)'

# THE HANKO SEAL
[character]
success_symbol = "[░▒❯](bold color_ok)"
error_symbol = "[░▒❯](bold color_error)"
