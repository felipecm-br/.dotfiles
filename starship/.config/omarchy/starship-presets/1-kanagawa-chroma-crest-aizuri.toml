# ==============================================================================
#  Preset: Kanagawa Chroma Crest (Aizuri-e Blue Print Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - Thirty-six Views of Mount Fuji, launched as aizuri-e
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Aizuri-e are prints in Prussian blue alone: the publisher sold the series on the new
# imported Berlin blue, printed at several dilutions, with the bare paper left for foam and
# snow. Every fill here sits on one OKLCH hue line (about 250 deg) and only lightness moves;
# the claw highlights are the paper itself, not white paint. The cinnabar seal is the only
# warm color, so an error is the one thing that breaks the blue.
# Claw per seam: U+E0C7 paper spray, U+E0C0 crest, U+E0C4 spray (aaa.toml signature).

"$schema" = 'https://starship.rs/config-schema.json'

# Full-strength ink -> first dilution -> second dilution -> bare paper -> bokashi sky
format = """
[](fg:color_s0)\
$os\
[](fg:color_w01a bg:color_s0)\
[](fg:color_w01b bg:color_w01m)\
[](fg:color_w01m bg:color_s1)\

$directory\
[](fg:color_w12a bg:color_s1)\
[](fg:color_w12b bg:color_w12m)\
[](fg:color_w12m bg:color_s2)\

$git_branch$git_status\
[](fg:color_w23a bg:color_s2)\
[](fg:color_w23b bg:color_w23m)\
[](fg:color_w23m bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_w34a bg:color_s3)\
[](fg:color_w34b bg:color_w34m)\
[](fg:color_w34m bg:color_s4)\

$time\
[](fg:color_w4xa bg:color_s4)\
[](fg:color_w4xb bg:color_w4xm)\
[](fg:color_w4xm bg:transparent)\

\n$character"""

palette = 'kanagawa_crest_aizuri'

[palettes.kanagawa_crest_aizuri]
color_s0   = '#06234a' # Prussian Blue at full strength (bero-ai, the abyss)
color_s1   = '#18487e' # Prussian Blue, first dilution (the swell)
color_s2   = '#5a8bb7' # Prussian Blue, second dilution (the wave wall)
color_s3   = '#f4efe3' # Bare kozo washi (unprinted paper = the foam)
color_s4   = '#a4c3d8' # Prussian Blue wash, bokashi sky
color_t0   = '#f4efe3' # text on s0 (13.6:1)
color_t1   = '#f4efe3' # text on s1 (8.1:1)
color_t2   = '#051833' # text on s2 (4.9:1)
color_t3   = '#051833' # text on s3 (15.4:1)
color_t4   = '#051833' # text on s4 (9.6:1)
color_seal = '#c23b22' # Cinnabar (shuniku seal paste): the only warm color in the print
color_w01a = '#4c6381' # seam 01: lit spray (OKLab t=.25, 30% light)
color_w01b = '#3d5c82' # seam 01: lit crest (OKLab t=.60, 20% light)
color_w01m = '#0e3563' # seam 01: body midpoint (OKLab t=.50)
color_w12a = '#829bb5' # seam 12: lit spray (OKLab t=.25, 45% light)
color_w12b = '#7e9cb9' # seam 12: lit crest (OKLab t=.60, 35% light)
color_w12m = '#39699a' # seam 12: body midpoint (OKLab t=.50)
color_w23a = '#d1d8da' # seam 23: lit spray (OKLab t=.25, 70% light)
color_w23b = '#dbdfdd' # seam 23: lit crest (OKLab t=.60, 60% light)
color_w23m = '#a6bdce' # seam 23: body midpoint (OKLab t=.50)
color_w34a = '#e7e8e2' # seam 34: lit spray (OKLab t=.25, 35% light)
color_w34b = '#d0dcdf' # seam 34: lit crest (OKLab t=.60, 25% light)
color_w34m = '#ccd9de' # seam 34: body midpoint (OKLab t=.50)
color_w4xa = '#afc6d6' # seam 4x: lit spray (OKLab t=.25, 30% light)
color_w4xb = '#90b1cb' # seam 4x: lit crest (OKLab t=.60, 20% light)
color_w4xm = '#7fa7c8' # seam 4x: body midpoint (OKLab t=.50)

# 1. THE DEEP
[os]
disabled = false
style = "bg:color_s0 fg:color_t0 bold"
format = '[ 🌊 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_s1 fg:color_t1 bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURLING WATER
[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_t2 bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE CREST (languages ride the foam)
[c]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

# 5. THE HORIZON
[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_t4 bold"
format = '[  $time ]($style)'

# THE SEAL
[character]
success_symbol = "[≈](bold color_s2)[❯](bold color_s4)"
error_symbol = "[ ✗ ](bold fg:color_s3 bg:color_seal)[ ❯](bold color_seal)"
