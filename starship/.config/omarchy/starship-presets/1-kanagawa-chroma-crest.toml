# ==============================================================================
#  Preset: Kanagawa Chroma Crest (Foam-Lit Claw)
#  Inspired by: Katsushika Hokusai, The Great Wave off Kanagawa (c. 1831), evolved from aaa.toml
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# aaa.toml claw (U+E0C7 mirrored spray, U+E0C0 flame, U+E0C4 airborne spray), now with OKLab colors.
# Segments sit at t = 0, .25, .5, .75, 1 of the Prussian > indigo > seafoam > foam > ochre ramp;
# each claw steps through samples between its neighbours and the leading glyphs are lightened
# toward white, so the spray reads as foam lit from above over a continuous body of water.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

# Prussian abyss -> indigo swell -> seafoam claw -> lead-white crest -> ochre horizon
format = """
[](fg:color_s0)\
$os\
[](fg:color_x3 bg:color_s0)\
[](fg:color_x4 bg:color_x5)\
[](fg:color_x5 bg:color_s1)\

$directory\
[](fg:color_x6 bg:color_s1)\
[](fg:color_x7 bg:color_x8)\
[](fg:color_x8 bg:color_s2)\

$git_branch$git_status\
[](fg:color_x9 bg:color_s2)\
[](fg:color_x10 bg:color_x11)\
[](fg:color_x11 bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_x12 bg:color_s3)\
[](fg:color_x13 bg:color_x14)\
[](fg:color_x14 bg:color_s4)\

$time\
[](fg:color_x0 bg:color_s4)\
[](fg:color_x1 bg:color_x2)\
[](fg:color_x2 bg:transparent)\

\n$character"""

palette = 'kanagawa_chroma_crest'

[palettes.kanagawa_chroma_crest]
color_s0      = '#071e3d' # t=0.00 segment fill, Prussian Blue abyss
color_s1      = '#1f4e70' # t=0.25 segment fill, Indigo swell
color_s2      = '#6d94a6' # t=0.50 segment fill, Seafoam slate
color_s3      = '#f2f5f7' # t=0.75 segment fill, Lead-white foam
color_s4      = '#c7ad7f' # t=1.00 segment fill, Ochre horizon
color_t0      = '#ffffff' # text on s0 (contrast 16.6:1)
color_t1      = '#ffffff' # text on s1 (contrast 8.8:1)
color_t2      = '#051329' # text on s2 (contrast 5.7:1)
color_t3      = '#051329' # text on s3 (contrast 16.9:1)
color_t4      = '#051329' # text on s4 (contrast 8.6:1)
color_x0      = '#c7b599' # transition step (OKLab sample between neighbouring segments)
color_x1      = '#a59377' # transition step (OKLab sample between neighbouring segments)
color_x2      = '#98825e' # transition step (OKLab sample between neighbouring segments)
color_x3      = '#5a6e86' # transition step (OKLab sample between neighbouring segments)
color_x4      = '#57718a' # transition step (OKLab sample between neighbouring segments)
color_x5      = '#123556' # transition step (OKLab sample between neighbouring segments)
color_x6      = '#7894a9' # transition step (OKLab sample between neighbouring segments)
color_x7      = '#819eb1' # transition step (OKLab sample between neighbouring segments)
color_x8      = '#46708b' # transition step (OKLab sample between neighbouring segments)
color_x9      = '#b5c8d2' # transition step (OKLab sample between neighbouring segments)
color_x10     = '#d0dce2' # transition step (OKLab sample between neighbouring segments)
color_x11     = '#aec4ce' # transition step (OKLab sample between neighbouring segments)
color_x12     = '#efede6' # transition step (OKLab sample between neighbouring segments)
color_x13     = '#e4dac7' # transition step (OKLab sample between neighbouring segments)
color_x14     = '#ddd1bb' # transition step (OKLab sample between neighbouring segments)
color_error   = '#c84b31' # Cinnabar (Hokusai hanko seal)
color_ok      = '#9fc3d3' # Seafoam glint (success)

# 1. THE DEEP ABYSS
[os]
disabled = false
style = "bg:color_s0 fg:color_t0 bold"
format = '[ 🌊 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_s1 fg:color_t1 bold"
format = "[󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURLING SEAFOAM
[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[$symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_t2 bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE BREAKING CREST (languages ride on the foam)
[c]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[$symbol($version) ]($style)'

# 5. THE OCHRE HORIZON
[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_t4 bold"
format = '[ $time ]($style)'

# THE HANKO SEAL
[character]
success_symbol = "[≈❯](bold color_ok)"
error_symbol = "[≈❯](bold color_error)"
