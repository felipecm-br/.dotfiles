# ==============================================================================
#  Preset: Zen Garden (Ryoan-ji Edition)
#  Inspired by: Ryoan-ji karesansui, Kyoto (late 15th c.) - fifteen stones in five groups on raked gravel
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: every gap is a patch of raked gravel: furrows U+224B around a group of stones
# (U+25CF large, U+2219 small). The five gaps hold 5 + 2 + 3 + 2 + 3 = 15 stones, the
# Ryoan-ji count, where from any seat one stone stays hidden. Segments are the materials
# around the garden: moss, veranda, clay wall, maple, tatami.
# The modules cascade through: Moss -> Hinoki Veranda -> Clay Wall -> Maple -> Tatami
format = """
[](fg:color_moss bg:transparent)\
$os\
[](fg:color_moss bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[∙●●∙●](fg:color_stone bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[](fg:color_hinoki bg:color_gravel)\

$directory\
[](fg:color_hinoki bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[●∙](fg:color_stone bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[](fg:color_clay bg:color_gravel)\

$git_branch$git_status\
[](fg:color_clay bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[●∙●](fg:color_stone bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[](fg:color_maple bg:color_gravel)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_maple bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[∙●](fg:color_stone bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[](fg:color_tatami bg:color_gravel)\

$time\
[](fg:color_tatami bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[●∙●](fg:color_stone bg:color_gravel)\
[≋](fg:color_rake bg:color_gravel)\
[](fg:color_gravel bg:transparent)\
\n$character"""

palette = 'art_zen_garden'

[palettes.art_zen_garden]
color_gravel = '#e8e2d0' # Shirakawa-suna (white river gravel)
color_rake   = '#a59d88' # Rake furrow (the shadow in the gravel lines)
color_stone  = '#4a4744' # Garden stone (weathered granite)
color_moss   = '#3f5b2a' # Sugi-goke (haircap moss)
color_hinoki = '#6b4a2f' # Hinoki veranda (cypress boards)
color_clay   = '#75624f' # Clay wall (oil-earth wall, abura-dobei)
color_maple  = '#a8391c' # Momiji (autumn maple)
color_tatami = '#c9b98a' # Tatami straw
color_paper  = '#f4efe2' # Washi (text on dark materials)
color_ink    = '#2a2622' # Sumi (text on light materials)

# 1. MOSS (the islands around the stones)
[os]
disabled = false
style = "bg:color_moss fg:color_paper bold"
format = '[ 󰚀 ]($style)'

# 2. HINOKI VERANDA (where you sit and look)
[directory]
style = "bg:color_hinoki fg:color_paper bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. CLAY WALL (the oil-earth wall, branching stains)
[git_branch]
symbol = " "
style = "bg:color_clay fg:color_paper bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_clay fg:color_paper bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. MOMIJI (the maples over the wall)
[c]
symbol = " "
style = "bg:color_maple fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_maple fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_maple fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_maple fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_maple fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_maple fg:color_paper bold"
format = '[ $symbol($version) ]($style)'

# 5. TATAMI (the hour of contemplation)
[time]
disabled = false
time_format = "%R"
style = "bg:color_tatami fg:color_ink bold"
format = '[ $time ]($style)'

# 6. THE STONE (a stone in raked gravel at the cursor; an error is a maple leaf on the gravel)
[character]
success_symbol = "[≋](color_rake)[●](bold color_gravel)[≋](color_rake)[ ❯](bold color_tatami)"
error_symbol = "[≋](color_rake)[󰌪](bold color_maple)[≋](color_rake)[ ✗](bold color_maple)"
