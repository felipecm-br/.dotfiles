# ==============================================================================
#  Preset: The Great Wave off Kanagawa v1 (Refined Crest Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - Kanagawa oki nami ura, Thirty-Six Views of Mount Fuji
#  Derived from: aaa.toml (Ukiyo-e Crest Edition)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: the claw: breaking foam U+E0C7 -> convex crest U+E0C0 -> airborne spray U+E0C4
# The modules cascade through: Prussian Abyss -> Seafoam Claws -> Indigo Swell -> Gofun Crest -> Ochre Boats -> Hanko Seal
format = """
[](fg:color_abyss)\
$os\
[](fg:color_white bg:color_abyss)\
[](fg:color_white bg:color_swell)\
[](fg:color_swell bg:color_seafoam)\

$git_branch$git_status\
[](fg:color_white bg:color_seafoam)\
[](fg:color_foam bg:color_spray)\
[](fg:color_spray bg:color_swell)\

$directory\
[](fg:color_white bg:color_swell)\
[](fg:color_swell bg:color_seafoam)\
[](fg:color_seafoam bg:color_foam)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_foam bg:color_wet_sand)\
[](fg:color_wet_sand bg:color_ochre)\

$time\
[](fg:color_white bg:color_ochre)\
[](fg:color_foam bg:color_hanko)\
[](fg:color_hanko bg:transparent)\
\n$character"""

palette = 'kanagawa_v1'

[palettes.kanagawa_v1]
color_trench   = '#051329' # Midnight trench (dark text)
color_abyss    = '#071e3d' # Prussian Blue (Berlin blue, the wave's base)
color_swell    = '#1f4e70' # Ai indigo (the rising swell)
color_spray    = '#4590c6' # Hanada blue (spray caught in the light)
color_seafoam  = '#6d94a6' # Seafoam slate (the curling claws)
color_foam     = '#f2f5f7' # Gofun shell white (breaking crest, Fuji snow)
color_white    = '#ffffff' # Bare paper highlight (the foam's leading edge)
color_wet_sand = '#887656' # Wet ochre (shadowed hull planks)
color_ochre    = '#c7ad7f' # Yellow ochre (oshiokuri-bune boats, hazy sky)
color_hanko    = '#c84b31' # Shuniku cinnabar (Hokusai's seal)

# 1. THE DEEP ABYSS (Prussian Blue, the helm of the boats)
[os]
disabled = false
style = "bg:color_abyss fg:color_foam bold"
format = '[ 󰠳 ]($style)'

# 3. THE RISING SWELL (indigo body of the wave)
[directory]
style = "bg:color_swell fg:color_foam bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 2. THE CURLING SEAFOAM (the claws reaching over the boats)
[git_branch]
symbol = " "
style = "bg:color_seafoam fg:color_trench bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_seafoam fg:color_trench bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE GOFUN CREST (white foam, the same white as Fuji's snow)
[c]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_foam fg:color_abyss bold"
format = '[ $symbol($version) ]($style)'

# 5. THE WOODEN BOATS AND HAZY SKY (oshiokuri-bune)
[time]
disabled = false
time_format = "%R"
style = "bg:color_ochre fg:color_trench bold"
format = '[ $time ]($style)'

# 6. THE SWELL PROMPT AND THE HANKO SEAL
[character]
success_symbol = "[≈❯](bold color_seafoam)"
error_symbol = "[≈❯](bold color_hanko)"
