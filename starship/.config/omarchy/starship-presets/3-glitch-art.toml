# ==============================================================================
#  Preset: Glitch Art (Datamosh Edition)
#  Inspired by: Glitch art and datamoshing (2000s) - broken codecs, RGB channel splits and scanline tears
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: each segment tears into a misregistered color channel: a left half block U+258C
# smears it, upper and lower half blocks (U+2580, U+2584) offset two channels by half a row like
# a slipped scanline, and shade noise (U+2591 U+2592) trails off into dead signal.
# The modules cascade through: White -> Cyan -> Magenta -> Yellow -> White
format = """
[▐](fg:color_white bg:transparent)\
$os\
[▌](fg:color_white bg:color_magenta)\
[▀](fg:color_cyan bg:color_magenta)\
[▄](fg:color_magenta bg:color_void)\
[░](fg:color_cyan bg:color_void)\
[▐](fg:color_cyan bg:color_void)\

$directory\
[▌](fg:color_cyan bg:color_magenta)\
[▀](fg:color_yellow bg:color_magenta)\
[▄](fg:color_magenta bg:color_void)\
[▒░](fg:color_yellow bg:color_void)\
[▐](fg:color_magenta bg:color_void)\

$git_branch$git_status\
[▌](fg:color_magenta bg:color_cyan)\
[▀](fg:color_magenta bg:color_cyan)\
[▄](fg:color_cyan bg:color_void)\
[░](fg:color_magenta bg:color_void)\
[▐](fg:color_yellow bg:color_void)\

$c$rust$golang$nodejs$deno$python\
[▌](fg:color_yellow bg:color_magenta)\
[▀](fg:color_cyan bg:color_magenta)\
[▄](fg:color_magenta bg:color_void)\
[▒░](fg:color_cyan bg:color_void)\
[▐](fg:color_white bg:color_void)\

$time\
[▌](fg:color_white bg:color_magenta)\
[▀](fg:color_cyan bg:color_magenta)\
[▄](fg:color_magenta bg:color_void)\
[▒░](fg:color_cyan bg:color_void)\
[▌](fg:color_void bg:transparent)\
\n$character"""

palette = 'art_glitch_art'

[palettes.art_glitch_art]
color_void    = '#000000' # Dead signal black
color_white   = '#f5f5f5' # Full signal white
color_cyan    = '#00f0ff' # Cyan channel (red dropped out)
color_magenta = '#ff00c8' # Magenta channel (green dropped out)
color_yellow  = '#fff200' # Yellow channel (blue dropped out)
color_ink     = '#000000' # Ink (text on the channels)

# 1. FULL SIGNAL (before the corruption)
[os]
disabled = false
style = "bg:color_white fg:color_void bold"
format = '[ 󰋮 ]($style)'

# 2. CYAN CHANNEL (where you are, red dropped out)
[directory]
style = "bg:color_cyan fg:color_void bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. MAGENTA CHANNEL (the branch, green dropped out)
[git_branch]
symbol = " "
style = "bg:color_magenta fg:color_void bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_magenta fg:color_void bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. YELLOW CHANNEL (the toolchain, blue dropped out)
[c]
symbol = " "
style = "bg:color_yellow fg:color_void bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_yellow fg:color_void bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_yellow fg:color_void bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_yellow fg:color_void bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_yellow fg:color_void bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_yellow fg:color_void bold"
format = '[ $symbol($version) ]($style)'

# 5. RESYNC (the signal back, with the time)
[time]
disabled = false
time_format = "%R"
style = "bg:color_white fg:color_void bold"
format = '[ $time ]($style)'

# 6. THE CHANNELS (an RGB split at the cursor; errors decay into noise)
[character]
success_symbol = "[▌](bold color_cyan)[▌](bold color_magenta)[▌](bold color_yellow)[ ❯](bold color_white)"
error_symbol = "[▒░](bold color_magenta)[ ✗](bold color_magenta)"
