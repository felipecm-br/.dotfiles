# ==============================================================================
#  Preset: Rasengan (Spiralling Sphere Edition)
#  Inspired by: Naruto Uzumaki, Naruto (Masashi Kishimoto, 1999) - the Spiralling Sphere
#  Fan tribute; no logos or official artwork, only colors and motion.
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: vortex pairs: flame U+E0C0 meets mirrored flame U+E0C2 (counter-rotating); the sphere is a Braille ring U+288E U+2871
# The attack travels left to right: Orange Jumpsuit -> Black Shoulders -> Deep Chakra -> Chakra -> Swirl -> Spinning Sphere
format = """
[](fg:color_orange bg:transparent)\
$os\
[](fg:color_orange bg:color_black)\

$directory\
[](fg:color_black bg:color_swirl)\
[](fg:color_chakra_deep bg:color_swirl)\

$git_branch$git_status\
[](fg:color_chakra_deep bg:color_swirl)\
[](fg:color_chakra bg:color_swirl)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_chakra bg:color_core)\
[](fg:color_swirl bg:color_core)\

$time\
[](fg:color_swirl bg:transparent)\
[⢎⡱](fg:color_core bg:transparent)\
\n$character"""

palette = 'power_rasengan'

[palettes.power_rasengan]
color_orange      = '#ff8a1c' # Jumpsuit orange
color_black       = '#1b1b1f' # Jumpsuit black shoulders
color_chakra_deep = '#0d2f6e' # Deep chakra
color_chakra      = '#2a7de1' # Chakra blue
color_swirl       = '#86d0ff' # Spiralling chakra
color_core        = '#f0fbff' # Compressed sphere core
color_kyuubi      = '#ff3d1f' # Nine-Tails red chakra (for errors)
color_ink         = '#0b0d14' # Ink (text on light fills)
color_paper       = '#ffffff' # Paper (text on dark fills)

# 1. NARUTO (jumpsuit orange, cut by a ninja slant)
[os]
disabled = false
style = "bg:color_orange fg:color_ink bold"
format = '[ 󰝴 ]($style)'

# 2. THE SHOULDERS (black, the first vortex opening)
[directory]
style = "bg:color_black fg:color_paper bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. DEEP CHAKRA (two flames rotating against each other)
[git_branch]
symbol = " "
style = "bg:color_chakra_deep fg:color_paper bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_chakra_deep fg:color_paper bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. CHAKRA (the spin tightening)
[c]
symbol = " "
style = "bg:color_chakra fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_chakra fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_chakra fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_chakra fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_chakra fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_chakra fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

# 5. THE SWIRL AND THE SPHERE (a ring of dots spinning past the end)
[time]
disabled = false
time_format = "%R"
style = "bg:color_swirl fg:color_ink bold"
format = '[ $time ]($style)'

# 6. THE SPHERE, AND THE NINE-TAILS RED CHAKRA FOR ERRORS
[character]
success_symbol = "[⢎⡱❯](bold color_swirl)"
error_symbol = "[⢎⡱❯](bold color_kyuubi)"
