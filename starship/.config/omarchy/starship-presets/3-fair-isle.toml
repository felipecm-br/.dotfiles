# ==============================================================================
#  Preset: Fair Isle (Shetland Knit Edition)
#  Inspired by: Fair Isle knitting from the Shetland Islands - two colors per row, peerie bands and OXO stars
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: each gap is a knitted band. Checker stitches (U+259E U+259A) flank a diamond
# U+25C6 on a contrasting ground, two colors per row as in real stranded knitting, and the band
# closes on a lower half block U+2584: the yarn change into the next row (segment).
# The modules cascade through: Navy Row -> Madder Row -> Forest Row -> Cream Row -> Madder Row
format = """
[▐](fg:color_navy bg:transparent)\
$os\
[▞▚](fg:color_navy bg:color_cream)\
[◆](fg:color_red bg:color_cream)\
[▚▞](fg:color_navy bg:color_cream)\
[▄](fg:color_red bg:color_cream)\

$directory\
[▞▚](fg:color_cream bg:color_navy)\
[◆](fg:color_gold bg:color_navy)\
[▚▞](fg:color_cream bg:color_navy)\
[▄](fg:color_green bg:color_navy)\

$git_branch$git_status\
[▞▚](fg:color_cream bg:color_red)\
[◆](fg:color_gold bg:color_red)\
[▚▞](fg:color_cream bg:color_red)\
[▄](fg:color_cream bg:color_red)\

$c$rust$golang$nodejs$deno$python\
[▞▚](fg:color_cream bg:color_navy)\
[◆](fg:color_gold bg:color_navy)\
[▚▞](fg:color_cream bg:color_navy)\
[▄](fg:color_red bg:color_navy)\

$time\
[▞▚](fg:color_cream bg:color_brown)\
[◆](fg:color_gold bg:color_brown)\
[▚▞](fg:color_cream bg:color_brown)\
[▌](fg:color_brown bg:transparent)\
\n$character"""

palette = 'art_fair_isle'

[palettes.art_fair_isle]
color_navy  = '#1c2a4a' # Navy wool (Shetland ground)
color_red   = '#b3202c' # Madder red wool
color_green = '#1f5a3a' # Forest green wool
color_cream = '#f1e6d0' # Undyed moorit cream
color_gold  = '#d9a441' # Weld gold wool
color_brown = '#5a3a24' # Shaela brown (natural dark Shetland)

# 1. NAVY ROW (the cast-on at the hem)
[os]
disabled = false
style = "bg:color_navy fg:color_cream bold"
format = '[ 󰳆 ]($style)'

# 2. MADDER ROW (where you are)
[directory]
style = "bg:color_red fg:color_cream bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. FOREST ROW (the branching OXO band)
[git_branch]
symbol = " "
style = "bg:color_green fg:color_cream bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_green fg:color_cream bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. CREAM ROW (the yoke)
[c]
symbol = " "
style = "bg:color_cream fg:color_navy bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_cream fg:color_navy bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_cream fg:color_navy bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_cream fg:color_navy bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_cream fg:color_navy bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_cream fg:color_navy bold"
format = '[ $symbol($version) ]($style)'

# 5. MADDER ROW (the collar)
[time]
disabled = false
time_format = "%R"
style = "bg:color_red fg:color_cream bold"
format = '[ $time ]($style)'

# 6. THE STITCH (a motif at the cursor; an error is a dropped stitch)
[character]
success_symbol = "[▞](bold color_red)[◆](bold color_gold)[▚](bold color_red)[ ❯](bold color_cream)"
error_symbol = "[▞](bold color_red)[╳](bold color_red)[▚](bold color_red)[ ✗](bold color_red)"
