# ==============================================================================
#  Preset: Chroma Aurora Panorama (Polar Night Edition)
#  Inspired by: The aurora borealis over a mountain ridge - nitrogen violet tops, oxygen 557.7 nm green curtains
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Aurora curtains hang across the empty middle of the status line: violet (nitrogen) in the top
# half, oxygen green below where a curtain is long, night sky in the gaps, a black ridge at both
# ends. The hue shimmers along the curtains.
# Compact: the scene lives in the empty middle of the status line, so the prompt is two lines tall
# like any other preset. Each scene column is an upper half block (U+2580) whose fg is the top half
# and bg the bottom half, followed by a $fill styled fg:prev_fg bg:prev_bg that stretches it, so the
# horizon runs through the middle of the row and the scene scales with the terminal, with no fork.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_s0)$os[](fg:color_s0 bg:color_s01)[](fg:color_s01 bg:color_s1)$directory[](fg:color_s1 bg:color_s12)[](fg:color_s12 bg:color_s2)$git_branch$git_status[](fg:color_s2 bg:color_s23)[](fg:color_s23 bg:color_s3)$c$rust$golang$nodejs$deno$python[▀](fg:color_v00 bg:color_v01)$fill[▀](fg:color_v02 bg:color_v03)$fill[▀](fg:color_v04 bg:color_v05)$fill[▀](fg:color_v06 bg:color_v07)$fill[▀](fg:color_v08 bg:color_v07)$fill[▀](fg:color_v09 bg:color_v10)$fill[▀](fg:color_v11 bg:color_v12)$fill[▀](fg:color_v13 bg:color_v07)$fill[▀](fg:color_v06 bg:color_v07)$fill[▀](fg:color_v14 bg:color_v15)$fill[▀](fg:color_v16 bg:color_v07)$fill[▀](fg:color_v17 bg:color_v01)$fill$time[](fg:color_s4)
$character"""

palette = 'chroma_aurora_panorama'

[palettes.chroma_aurora_panorama]
color_s0    = '#2a1b5e' # segment 1: polar night
color_s1    = '#5b3fd0' # segment 2: nitrogen violet
color_s2    = '#2bb58a' # segment 3: deep oxygen green
color_s3    = '#3ee8b5' # segment 4: oxygen green
color_s4    = '#b8ffd0' # segment 5: lower fringe
color_s01   = '#422d95' # OKLab midpoint, segment 1 to 2
color_s12   = '#4b83b3' # OKLab midpoint, segment 2 to 3
color_s23   = '#34ce9f' # OKLab midpoint, segment 3 to 4
color_v00   = '#b04cff' # aurora: nitrogen violet curtain top, column 0
color_v01   = '#03040a' # aurora: ridge silhouette, column 0
color_v02   = '#c455ef' # aurora: nitrogen violet curtain top, column 1
color_v03   = '#33dfa5' # aurora: oxygen green curtain, column 1
color_v04   = '#d85bdf' # aurora: nitrogen violet curtain top, column 2
color_v05   = '#3be6b1' # aurora: oxygen green curtain, column 2
color_v06   = '#070b1f' # aurora: night sky, column 3
color_v07   = '#10204a' # aurora: night sky near the horizon, column 3
color_v08   = '#ab69ec' # aurora: nitrogen violet curtain top, column 4
color_v09   = '#b44efc' # aurora: nitrogen violet curtain top, column 5
color_v10   = '#2dda9c' # aurora: oxygen green curtain, column 5
color_v11   = '#c856ec' # aurora: nitrogen violet curtain top, column 6
color_v12   = '#35e1a8' # aurora: oxygen green curtain, column 6
color_v13   = '#dc5bdb' # aurora: nitrogen violet curtain top, column 7
color_v14   = '#a36aee' # aurora: nitrogen violet curtain top, column 9
color_v15   = '#42d6e3' # aurora: oxygen green curtain, column 9
color_v16   = '#b850f8' # aurora: nitrogen violet curtain top, column 10
color_v17   = '#cc58e8' # aurora: nitrogen violet curtain top, column 11
color_error = '#ff4d6d' # Error: oxygen-red storm, paired with the ✗ shape
color_paper = '#fbfbff' # Paper (text on dark fills)
color_ink   = '#15131a' # Ink (text on light fills)

[fill]
symbol = "▀"
style = "fg:prev_fg bg:prev_bg"

[os]
disabled = false
style = "bg:color_s0 fg:color_paper bold"
format = '[ 󰼱 ]($style)'

[directory]
style = "bg:color_s1 fg:color_paper bold"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_ink bold"
format = '[ $time ]($style)'

[character]
success_symbol = "[❯](bold color_s3)[❯](bold color_s4)"
error_symbol = "[✗❯](bold color_error)"
