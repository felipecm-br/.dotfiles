# ==============================================================================
#  Preset: Chroma Monument Valley (Mittens at Sunset Edition)
#  Inspired by: The Mittens buttes, Monument Valley (Navajo Nation) - sandstone towers at sunset
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# The two Mittens buttes stand in the middle of the status line: each butte column fills both
# halves of the cell, piercing the horizon, while the far mesas sit low in haze and the desert
# floor fills the bottom half. The sun sets in the west (left): sky from glow to dusk, west faces
# of the rock lit. $fill only makes flat tops, which is the geology of mesas and buttes.
# Compact: the scene lives in the empty middle of the status line, so the prompt is two lines tall
# like any other preset. Each scene column is an upper half block (U+2580) whose fg is the top half
# and bg the bottom half, followed by a $fill styled fg:prev_fg bg:prev_bg that stretches it, so the
# horizon runs through the middle of the row and the scene scales with the terminal, with no fork.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_s0)$os[](fg:color_s0 bg:color_s01)[](fg:color_s01 bg:color_s1)$directory[](fg:color_s1 bg:color_s12)[](fg:color_s12 bg:color_s2)$git_branch$git_status[](fg:color_s2 bg:color_s23)[](fg:color_s23 bg:color_s3)$c$rust$golang$nodejs$deno$python[▀](fg:color_v00 bg:color_v01)$fill[▀](fg:color_v02 bg:color_v03)$fill[▀](fg:color_v04 bg:color_v05)$fill[▀](fg:color_v06 bg:color_v07)$fill[▀](fg:color_v08 bg:color_v09)$fill[▀](fg:color_v10 bg:color_v11)$fill[▀](fg:color_v12 bg:color_v13)$fill[▀](fg:color_v14 bg:color_v15)$fill[▀](fg:color_v16 bg:color_v17)$fill[▀](fg:color_v18 bg:color_v19)$fill[▀](fg:color_v20 bg:color_v21)$fill[▀](fg:color_v22 bg:color_v23)$fill$time[](fg:color_s4)
$character"""

palette = 'chroma_monument_valley'

[palettes.chroma_monument_valley]
color_s0    = '#2a1630' # segment 1: night shadow
color_s1    = '#7c2a1c' # segment 2: deep sandstone
color_s2    = '#b5441f' # segment 3: mid sandstone
color_s3    = '#e8703a' # segment 4: sunlit sandstone
color_s4    = '#ffb067' # segment 5: sunset glow
color_s01   = '#51222b' # OKLab midpoint, segment 1 to 2
color_s12   = '#98371e' # OKLab midpoint, segment 2 to 3
color_s23   = '#ce5a2c' # OKLab midpoint, segment 3 to 4
color_v00   = '#ffb067' # panorama: sky, column 0
color_v01   = '#e8844a' # panorama: far mesa in haze, column 0
color_v02   = '#fb9a5e' # panorama: sky, column 1
color_v03   = '#e57846' # panorama: far mesa in haze, column 1
color_v04   = '#f68455' # panorama: sky, column 2
color_v05   = '#7a3127' # panorama: desert floor, column 2
color_v06   = '#d55c30' # panorama: butte, sunlit upper wall, column 3
color_v07   = '#b04f38' # panorama: butte, lower wall, column 3
color_v08   = '#d75f67' # panorama: sky, column 4
color_v09   = '#6f2e27' # panorama: desert floor, column 4
color_v10   = '#c24e75' # panorama: sky, column 5
color_v11   = '#6a2c27' # panorama: desert floor, column 5
color_v12   = '#a64278' # panorama: sky, column 6
color_v13   = '#652b27' # panorama: desert floor, column 6
color_v14   = '#833a74' # panorama: sky, column 7
color_v15   = '#602927' # panorama: desert floor, column 7
color_v16   = '#bb4928' # panorama: butte, sunlit upper wall, column 8
color_v17   = '#9c4131' # panorama: butte, lower wall, column 8
color_v18   = '#4b2761' # panorama: sky, column 9
color_v19   = '#562627' # panorama: desert floor, column 9
color_v20   = '#371e50' # panorama: sky, column 10
color_v21   = '#7e3e4b' # panorama: far mesa in haze, column 10
color_v22   = '#24163f' # panorama: sky, column 11
color_v23   = '#743942' # panorama: far mesa in haze, column 11
color_error = '#4dd2ff' # Error: the one cold hue, paired with the ✗ shape
color_paper = '#fbfbff' # Paper (text on dark fills)
color_ink   = '#15131a' # Ink (text on light fills)

[fill]
symbol = "▀"
style = "fg:prev_fg bg:prev_bg"

[os]
disabled = false
style = "bg:color_s0 fg:color_paper bold"
format = '[ 󰖨 ]($style)'

[directory]
style = "bg:color_s1 fg:color_paper bold"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_paper bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_paper bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_ink bold"
format = '[ $time ]($style)'

[character]
success_symbol = "[❯](bold color_s3)[❯](bold color_s4)"
error_symbol = "[✗❯](bold color_error)"
