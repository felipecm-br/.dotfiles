# ==============================================================================
#  Preset: Kanagawa Chroma Crest (Open Sea Horizon Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - The Great Wave off Kanagawa, widened to the open sea
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# The crest breaks on the left as in crest, then falls (U+2586 U+2585) to sea level and the
# open sea runs the full width of the terminal: every column is an upper half block whose
# fg is the sky and bg is the sea, so the horizon runs through the middle of the row.
# Six bands stretched by $fill ([fill] inherits prev_fg/prev_bg) and three-cell seams keep
# both tracks smooth with no fork. A far swell rises and breaks into the ochre time.

"$schema" = 'https://starship.rs/config-schema.json'

# Abyss -> swell -> wall -> crest -> open sea (full width) -> far swell -> ochre horizon
format = """
[](fg:color_s0)\
$os\
[](fg:color_w01a bg:color_s0)\
[](fg:color_w01b bg:color_w01m)\
[](fg:color_w01m bg:color_s1)\

$directory\
[](fg:color_w12a bg:color_s1)\
[](fg:color_w12b bg:color_w12m)\
[](fg:color_w12m bg:color_s2)\

$git_branch$git_status$c$rust$golang$nodejs$deno$python\
[](fg:color_foam bg:color_s2)\
[](fg:color_foam bg:color_v00)\
[▆](fg:color_fall6 bg:color_v00)\
[▅](fg:color_w00 bg:color_v00)\

[▀](fg:color_v00 bg:color_w00)$fill[▀](fg:color_v01 bg:color_w01)[▀](fg:color_v02 bg:color_w02)[▀](fg:color_v03 bg:color_w03)[▀](fg:color_v04 bg:color_w04)$fill[▀](fg:color_v05 bg:color_w05)[▀](fg:color_v06 bg:color_w06)[▀](fg:color_v07 bg:color_w07)[▀](fg:color_v08 bg:color_w08)$fill[▀](fg:color_v09 bg:color_w09)[▀](fg:color_v10 bg:color_w10)[▀](fg:color_v11 bg:color_w11)[▀](fg:color_v12 bg:color_w12)$fill[▀](fg:color_v13 bg:color_w13)[▀](fg:color_v14 bg:color_w14)[▀](fg:color_v15 bg:color_w15)[▀](fg:color_v16 bg:color_w16)$fill[▀](fg:color_v17 bg:color_w17)[▀](fg:color_v18 bg:color_w18)[▀](fg:color_v19 bg:color_w19)[▀](fg:color_v20 bg:color_w20)$fill[▀](fg:color_v21 bg:color_w21)[▀](fg:color_v22 bg:color_w22)[▀](fg:color_v23 bg:color_w23)\

[▅](fg:color_far5 bg:color_v23)\
[▆](fg:color_far6 bg:color_v23)\
[▇](fg:color_far7 bg:color_v23)\
[](fg:color_farc bg:color_s3)\

$time\
[](fg:color_s3)\

\n$character"""

palette = 'kanagawa_crest_horizon'

[palettes.kanagawa_crest_horizon]
color_s0    = '#071e3d' # Prussian Blue (the abyss)
color_s1    = '#1f4e70' # Ai indigo (the swell)
color_s2    = '#6d94a6' # Seafoam slate (the wave wall, git and languages)
color_t0    = '#ffffff' # text on s0 (16.6:1)
color_t1    = '#ffffff' # text on s1 (8.8:1)
color_t2    = '#051329' # text on s2 (5.7:1)
color_w01a  = '#4f647d' # seam 01: lit spray (OKLab t=.25, 30% light)
color_w01b  = '#46627e' # seam 01: lit crest (OKLab t=.60, 22% light)
color_w01m  = '#123556' # seam 01: body midpoint (OKLab t=.50)
color_w12a  = '#96acbd' # seam 12: lit spray (OKLab t=.25, 50% light)
color_w12b  = '#93acbc' # seam 12: lit crest (OKLab t=.60, 40% light)
color_w12m  = '#46708b' # seam 12: body midpoint (OKLab t=.50)
color_foam  = '#fbfaf6' # Foam (the breaking claws)
color_v00   = '#f1ece0' # sky, column 0
color_fall6 = '#6691a5' # falling water, 6/8
color_w00   = '#5f8ea3' # sea, column 0
color_v01   = '#f0e9da' # sky, column 1
color_w01   = '#58899f' # sea, column 1
color_v02   = '#efe7d5' # sky, column 2
color_w02   = '#51839b' # sea, column 2
color_v03   = '#eee4cf' # sky, column 3
color_w03   = '#4a7e97' # sea, column 3
color_v04   = '#ede2c9' # sky, column 4
color_w04   = '#437892' # sea, column 4
color_v05   = '#ebdfc4' # sky, column 5
color_w05   = '#3d738f' # sea, column 5
color_v06   = '#eadcbe' # sky, column 6
color_w06   = '#396f8c' # sea, column 6
color_v07   = '#e8d9b8' # sky, column 7
color_w07   = '#356b89' # sea, column 7
color_v08   = '#e6d6b3' # sky, column 8
color_w08   = '#306786' # sea, column 8
color_v09   = '#e4d3ad' # sky, column 9
color_w09   = '#2c6383' # sea, column 9
color_v10   = '#e2cfa8' # sky, column 10
color_w10   = '#296080' # sea, column 10
color_v11   = '#dfcba3' # sky, column 11
color_w11   = '#275c7d' # sea, column 11
color_v12   = '#ddc89d' # sky, column 12
color_w12   = '#25597a' # sea, column 12
color_v13   = '#dac498' # sky, column 13
color_w13   = '#235677' # sea, column 13
color_v14   = '#d8c093' # sky, column 14
color_w14   = '#215475' # sea, column 14
color_v15   = '#d5bd8f' # sky, column 15
color_w15   = '#205172' # sea, column 15
color_v16   = '#d3b98a' # sky, column 16
color_w16   = '#1f4f70' # sea, column 16
color_v17   = '#d0b585' # sky, column 17
color_w17   = '#1e4d6e' # sea, column 17
color_v18   = '#ceb181' # sky, column 18
color_w18   = '#1c4b6c' # sea, column 18
color_v19   = '#ccaf7d' # sky, column 19
color_w19   = '#1c496a' # sea, column 19
color_v20   = '#cbac7a' # sky, column 20
color_w20   = '#1b4869' # sea, column 20
color_v21   = '#caaa77' # sky, column 21
color_w21   = '#1b4768' # sea, column 21
color_v22   = '#c8a774' # sky, column 22
color_w22   = '#1a4567' # sea, column 22
color_v23   = '#c7a571' # sky, column 23
color_w23   = '#1a4466' # sea, column 23
color_s3    = '#c7a571' # Ochre sky (the time, sunlit horizon)
color_t3    = '#051329' # text on the ochre sky
color_far5  = '#244d6e' # far swell at 5/8 (sunlit as it rises)
color_far6  = '#2e5675' # far swell at 6/8 (sunlit as it rises)
color_far7  = '#38607d' # far swell at 7/8 (sunlit as it rises)
color_farc  = '#f1e8db' # far crest foam
color_seal  = '#c84b31' # Cinnabar (Hokusai hanko seal)

[fill]
symbol = "▀"
style = "fg:prev_fg bg:prev_bg"

# 1. THE DEEP
[os]
disabled = false
style = "bg:color_s0 fg:color_t0 bold"
format = '[ 🌊 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_s1 fg:color_t1 bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURLING WATER
[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_t2 bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE CREST (languages ride the foam)
[c]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol($version) ]($style)'

# 5. THE HORIZON
[time]
disabled = false
time_format = "%R"
style = "bg:color_s3 fg:color_t3 bold"
format = '[  $time ]($style)'

# THE SEAL
[character]
success_symbol = "[≈](bold color_s2)[❯](bold color_s3)"
error_symbol = "[≈❯](bold color_seal)"
