# ==============================================================================
#  Preset: Kanagawa Chroma Crest (Nocturne Moonlit Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - The Great Wave off Kanagawa, imagined under a full moon
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# The same wave at night. The light source is the moon, so every claw highlight mixes
# toward moonlight silver instead of white, and it grows brighter toward the crest
# (25% in the abyss, 70% at the foam): foam is brightest where the wave breaks.
# The bar breaks into the night (the terminal itself), and the time floats free as a
# full moon inside a 22-degree halo: two stacked round caps per side.
# Claw per seam: U+E0C7 spray, U+E0C0 crest, U+E0C4 spray; moon: U+E0B6/U+E0B4 x2.

"$schema" = 'https://starship.rs/config-schema.json'

# Night sea -> indigo swell -> moonlit wall -> silver foam -> (night) -> the moon
format = """
[](fg:color_s0)\
$os\
[](fg:color_w01a bg:color_s0)\
[](fg:color_w01b bg:color_w01m)\
[](fg:color_w01m bg:color_s1)\

$directory\
[](fg:color_w12a bg:color_s1)\
[](fg:color_w12b bg:color_w12m)\
[](fg:color_w12m bg:color_s2)\

$git_branch$git_status\
[](fg:color_w23a bg:color_s2)\
[](fg:color_w23b bg:color_w23m)\
[](fg:color_w23m bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_w3xa bg:color_s3)\
[](fg:color_w3xb bg:color_w3xm)\
[](fg:color_w3xm bg:transparent)\
 \
[](fg:color_halo)\
[](fg:color_moon bg:color_halo)\
$time\
[](fg:color_moon bg:color_halo)\
[](fg:color_halo)\

\n$character"""

palette = 'kanagawa_crest_nocturne'

[palettes.kanagawa_crest_nocturne]
color_s0    = '#0c1532' # Sumi-indigo night sea (the abyss)
color_s1    = '#1d2e57' # Moonless indigo (the swell)
color_s2    = '#47678c' # Moonlit slate (the wave wall)
color_s3    = '#dce4f2' # Moonlit foam (silver crest)
color_t0    = '#eef2ff' # text on s0 (16.1:1)
color_t1    = '#eef2ff' # text on s1 (11.9:1)
color_t2    = '#eef2ff' # text on s2 (5.2:1)
color_t3    = '#141a33' # text on s3 (13.4:1)
color_halo  = '#33375e' # Lunar corona (22-degree halo, ice crystals)
color_moon  = '#f2e3b3' # Full moon (Naples yellow, the time disc)
color_tmoon = '#141a33' # text on the moon
color_seal  = '#d2462f' # Paper lantern red (errors)
color_w01a  = '#3d4968' # seam 01: lit spray (OKLab t=.25, 25% light)
color_w01b  = '#364467' # seam 01: lit crest (OKLab t=.60, 18% light)
color_w01m  = '#142144' # seam 01: body midpoint (OKLab t=.50)
color_w12a  = '#6d7ea0' # seam 12: lit spray (OKLab t=.25, 40% light)
color_w12b  = '#697fa0' # seam 12: lit crest (OKLab t=.60, 32% light)
color_w12m  = '#314a71' # seam 12: body midpoint (OKLab t=.50)
color_w23a  = '#becbe3' # seam 23: lit spray (OKLab t=.25, 70% light)
color_w23b  = '#c9d4ea' # seam 23: lit crest (OKLab t=.60, 62% light)
color_w23m  = '#8fa4be' # seam 23: body midpoint (OKLab t=.50)
color_w3xa  = '#b9c4da' # seam 3x: lit spray (OKLab t=.25, 30% light)
color_w3xb  = '#7583a3' # seam 3x: lit crest (OKLab t=.60, 15% light)
color_w3xm  = '#7684a2' # seam 3x: body midpoint (OKLab t=.50)

# 1. THE DEEP
[os]
disabled = false
style = "bg:color_s0 fg:color_t0 bold"
format = '[ 🌊 ]($style)'

# 2. THE RISING SWELL
[directory]
style = "bg:color_s1 fg:color_t1 bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CURLING WATER
[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_t2 bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_t2 bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE CREST (languages ride the foam)
[c]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_t3 bold"
format = '[ $symbol($version) ]($style)'

# 5. THE HORIZON
[time]
disabled = false
time_format = "%R"
style = "bg:color_moon fg:color_tmoon bold"
format = '[ $time ]($style)'

# THE SEAL
[character]
success_symbol = "[≈](bold color_s2)[❯](bold color_moon)"
error_symbol = "[≈❯](bold color_seal)"
