# ==============================================================================
#  Preset: The Great Wave off Kanagawa v4 (Kanagawa Wave Key-Block Edition)
#  Inspired by: Katsushika Hokusai (c. 1831) - Kanagawa oki nami ura, Thirty-Six Views of Mount Fuji
#  Derived from: aaa.toml (Ukiyo-e Crest Edition)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: droplets U+E0C4 -> key-block ink line U+E0C1 (thin flame outline) -> crest U+E0C0
# The modules cascade through: Sumi Ink -> Wave Blue -> Deep Wave -> Crystal Crest -> Boat Yellow
format = """
[](fg:color_sumi_ink0)\
$os\
[](fg:color_sumi_ink0 bg:color_spring_blue)\
[](fg:color_fuji_white bg:color_spring_blue)\
[](fg:color_spring_blue bg:color_wave_blue1)\

$directory\
[](fg:color_wave_blue1 bg:color_spring_blue)\
[](fg:color_fuji_white bg:color_spring_blue)\
[](fg:color_spring_blue bg:color_wave_blue2)\

$git_branch$git_status\
[](fg:color_wave_blue2 bg:color_sumi_ink0)\
[](fg:color_fuji_white bg:color_sumi_ink0)\
[](fg:color_sumi_ink0 bg:color_crystal_blue)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_crystal_blue bg:color_carp_yellow)\
[](fg:color_carp_yellow bg:color_boat_yellow)\

$time\
[](fg:color_boat_yellow bg:color_sumi_ink4)\
[](fg:color_fuji_white bg:color_sumi_ink4)\
[](fg:color_sumi_ink4 bg:transparent)\
\n$character"""

palette = 'kanagawa_v4'

[palettes.kanagawa_v4]
color_sumi_ink0    = '#16161d' # sumiInk0 (lamp-black ground)
color_sumi_ink4    = '#2a2a37' # sumiInk4 (wet ink)
color_wave_blue1   = '#223249' # waveBlue1 (the trough)
color_wave_blue2   = '#2d4f67' # waveBlue2 (the swell)
color_crystal_blue = '#7e9cd8' # crystalBlue (the crest in light)
color_spring_blue  = '#7fb4ca' # springBlue (spray)
color_fuji_white   = '#dcd7ba' # fujiWhite (foam, the key-block line)
color_boat_yellow  = '#c0a36e' # boatYellow2 (oshiokuri-bune hulls)
color_carp_yellow  = '#e6c384' # carpYellow (sunlit plank)
color_peach_red    = '#ff5d62' # peachRed (the alarm)

# 1. SUMI INK (the key-block ground)
[os]
disabled = false
style = "bg:color_sumi_ink0 fg:color_fuji_white bold"
format = '[ 󰠳 ]($style)'

# 2. WAVE BLUE (the trough)
[directory]
style = "bg:color_wave_blue1 fg:color_fuji_white bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. DEEP WAVE (the swell)
[git_branch]
symbol = " "
style = "bg:color_wave_blue2 fg:color_fuji_white bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_wave_blue2 fg:color_fuji_white bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. CRYSTAL CREST
[c]
symbol = " "
style = "bg:color_crystal_blue fg:color_sumi_ink0 bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_crystal_blue fg:color_sumi_ink0 bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_crystal_blue fg:color_sumi_ink0 bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_crystal_blue fg:color_sumi_ink0 bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_crystal_blue fg:color_sumi_ink0 bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_crystal_blue fg:color_sumi_ink0 bold"
format = '[ $symbol($version) ]($style)'

# 5. BOAT YELLOW (the hulls)
[time]
disabled = false
time_format = "%R"
style = "bg:color_boat_yellow fg:color_sumi_ink0 bold"
format = '[ $time ]($style)'

# 6. THE WAVE PROMPT
[character]
success_symbol = "[≈❯](bold color_spring_blue)"
error_symbol = "[≈❯](bold color_peach_red)"
