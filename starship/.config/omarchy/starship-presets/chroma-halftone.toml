# ==============================================================================
#  Preset: Chroma Halftone (Pop Art Print Edition)
#  Inspired by: notMyShell Chroma treatment, extended (stops: #00a8e8 #6f5cff #ff2d87 #ff8a1a #ffd400)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# A printed gradient: no mixed inks, only dot size. Each transition grows dots of the next ink on
# the current one (U+00B7 U+2219 U+2022 U+25CF), then shrinks dots of the current ink on the next
# (U+25CF U+2022 U+2219 U+00B7), like the Ben-Day dots of a Lichtenstein panel.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[·∙•](fg:color_s0)\
$os\
[·](fg:color_s1 bg:color_s0)\
[∙](fg:color_s1 bg:color_s0)\
[•](fg:color_s1 bg:color_s0)\
[●](fg:color_s1 bg:color_s0)\
[●](fg:color_s0 bg:color_s1)\
[•](fg:color_s0 bg:color_s1)\
[∙](fg:color_s0 bg:color_s1)\
[·](fg:color_s0 bg:color_s1)\

$directory\
[·](fg:color_s2 bg:color_s1)\
[∙](fg:color_s2 bg:color_s1)\
[•](fg:color_s2 bg:color_s1)\
[●](fg:color_s2 bg:color_s1)\
[●](fg:color_s1 bg:color_s2)\
[•](fg:color_s1 bg:color_s2)\
[∙](fg:color_s1 bg:color_s2)\
[·](fg:color_s1 bg:color_s2)\

$git_branch$git_status\
[·](fg:color_s3 bg:color_s2)\
[∙](fg:color_s3 bg:color_s2)\
[•](fg:color_s3 bg:color_s2)\
[●](fg:color_s3 bg:color_s2)\
[●](fg:color_s2 bg:color_s3)\
[•](fg:color_s2 bg:color_s3)\
[∙](fg:color_s2 bg:color_s3)\
[·](fg:color_s2 bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[·](fg:color_s4 bg:color_s3)\
[∙](fg:color_s4 bg:color_s3)\
[•](fg:color_s4 bg:color_s3)\
[●](fg:color_s4 bg:color_s3)\
[●](fg:color_s3 bg:color_s4)\
[•](fg:color_s3 bg:color_s4)\
[∙](fg:color_s3 bg:color_s4)\
[·](fg:color_s3 bg:color_s4)\

$time\
[•∙·](fg:color_s4)\
\n$character"""

palette = 'chroma_halftone'

[palettes.chroma_halftone]
color_s0       = '#00a8e8' # t=0.00 segment fill
color_s1       = '#6f5cff' # t=0.25 segment fill
color_s2       = '#ff2d87' # t=0.50 segment fill
color_s3       = '#ff8a1a' # t=0.75 segment fill
color_s4       = '#ffd400' # t=1.00 segment fill
color_ink      = '#15131a' # Ink (text on light fills)
color_ink_deep = '#000000' # Pure black (contrast correction)
color_error    = '#ff3355' # Error (paired with the ✗ shape)

[os]
disabled = false
style = "bg:color_s0 fg:color_ink bold"
format = '[ 󰐪 ]($style)'

[directory]
style = "bg:color_s1 fg:color_ink_deep bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_ink bold"
format = '[ $time ]($style)'

# A three-step gradient chevron (starting at the first fill visible on a dark terminal); errors swap to a single-hue ✗ so they never blend into the gradient.
[character]
success_symbol = "[❯](bold color_s0)[❯](bold color_s2)[❯](bold color_s4)"
error_symbol = "[✗❯](bold color_error)"
