# ==============================================================================
#  Preset: Chroma Oil Slick (Thin-Film Edition)
#  Inspired by: notMyShell Chroma treatment, extended (stops: #1a1035 #24608a #2fb59a #d6c64a #c43f8c #3b1f7a)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Thin-film interference: as an oil film thickens, the reflected color cycles violet, blue,
# teal, gold, magenta and back to violet. Segments sample that cycle in OKLab; transitions are
# ice waveforms U+E0C8 that ripple like the film on water.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_s0 bg:transparent)\
$os\
[](fg:color_s0 bg:color_s01a)\
[](fg:color_s01a bg:color_s01b)\
[](fg:color_s01b bg:color_s1)\

$directory\
[](fg:color_s1 bg:color_s12a)\
[](fg:color_s12a bg:color_s12b)\
[](fg:color_s12b bg:color_s2)\

$git_branch$git_status\
[](fg:color_s2 bg:color_s23a)\
[](fg:color_s23a bg:color_s23b)\
[](fg:color_s23b bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_s3 bg:color_s34a)\
[](fg:color_s34a bg:color_s34b)\
[](fg:color_s34b bg:color_s4)\

$time\
[](fg:color_s4 bg:transparent)\
\n$character"""

palette = 'chroma_oil_slick'

[palettes.chroma_oil_slick]
color_s0    = '#24375e' # t=0.10 segment fill
color_s1    = '#288a94' # t=0.30 segment fill
color_s2    = '#93bf7b' # t=0.50 segment fill
color_s3    = '#d18978' # t=0.70 segment fill
color_s4    = '#7d3585' # t=0.90 segment fill
color_s01a  = '#25527b' # t=0.167 transition step
color_s01b  = '#256e8d' # t=0.233 transition step
color_s12a  = '#2da798' # t=0.367 transition step
color_s12b  = '#5bb991' # t=0.433 transition step
color_s23a  = '#c1c45e' # t=0.567 transition step
color_s23b  = '#d5b25f' # t=0.633 transition step
color_s34a  = '#c95b87' # t=0.767 transition step
color_s34b  = '#ac3d8a' # t=0.833 transition step
color_paper = '#fbfbff' # Paper (text on dark fills)
color_ink   = '#15131a' # Ink (text on light fills)
color_error = '#ff3355' # Error (paired with the ✗ shape)

[os]
disabled = false
style = "bg:color_s0 fg:color_paper bold"
format = '[ 󰏇 ]($style)'

[directory]
style = "bg:color_s1 fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_paper bold"
format = '[ $time ]($style)'

# A three-step gradient chevron (starting at the first fill visible on a dark terminal); errors swap to a single-hue ✗ so they never blend into the gradient.
[character]
success_symbol = "[❯](bold color_s1)[❯](bold color_s2)[❯](bold color_s3)"
error_symbol = "[✗❯](bold color_error)"
