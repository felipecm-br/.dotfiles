# ==============================================================================
#  Preset: Mjolnir Thunder (God of Thunder Edition)
#  Inspired by: Thor, The Mighty Thor (Lee, Lieber and Kirby, 1962) - lightning called down through Mjolnir
#  Fan tribute; no logos or official artwork, only colors and motion.
#  Configured for: Omarchy / Starship Studio
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Glyph chain: box diagonals U+2571 U+2572 as forked lightning, Braille zigzags as arcs, slants U+E0BC as strike cuts
# The attack travels left to right: Crimson Cape -> Uru Silver -> Storm Sky -> Charged Cloud -> Ionised Violet -> Arc Blue -> Lightning
format = """
[](fg:color_cape bg:transparent)\
$os\
[](fg:color_cape bg:color_silver)\
[](fg:color_silver bg:color_storm)\

$directory\
[╲╱╲](fg:color_arc bg:color_storm)\
[](fg:color_storm bg:color_cloud)\
[](fg:color_cloud bg:color_violet)\

$git_branch$git_status\
[╱╲╱](fg:color_bolt bg:color_violet)\
[](fg:color_violet bg:color_arc)\

$c$rust$golang$nodejs$deno$python\
[⠢⠔⠢](fg:color_storm bg:color_arc)\
[](fg:color_arc bg:color_bolt)\

$time\
[](fg:color_bolt bg:transparent)\
[╲╱](fg:color_arc bg:transparent)\
\n$character"""

palette = 'power_mjolnir_thunder'

[palettes.power_mjolnir_thunder]
color_cape      = '#a3161a' # Asgardian cape crimson
color_silver    = '#c3c9d2' # Uru metal silver (the hammer head)
color_storm     = '#121729' # Storm sky
color_cloud     = '#2d3654' # Charged cloud
color_violet    = '#5b45d6' # Ionised violet
color_arc       = '#79a8ff' # Electric arc blue
color_bolt      = '#eef5ff' # Lightning white
color_red_alert = '#ff3b3b' # Alarm red (for errors)
color_ink       = '#0b0d14' # Ink (text on light fills)
color_paper     = '#ffffff' # Paper (text on dark fills)

# 1. THOR (the cape, then the hammer head swinging up)
[os]
disabled = false
style = "bg:color_cape fg:color_paper bold"
format = '[ 󰣪 ]($style)'

# 2. THE STORM (forked lightning cracking across the sky)
[directory]
style = "bg:color_storm fg:color_paper bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

# 3. THE CHARGED CLOUD (ionised violet)
[git_branch]
symbol = " "
style = "bg:color_violet fg:color_paper bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_violet fg:color_paper bold"
format = '([$all_status$ahead_behind ]($style))'

# 4. THE ARC (electricity crawling in Braille zigzags)
[c]
symbol = " "
style = "bg:color_arc fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_arc fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_arc fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_arc fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_arc fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_arc fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

# 5. THE STRIKE (white lightning, forking off the end)
[time]
disabled = false
time_format = "%R"
style = "bg:color_bolt fg:color_ink bold"
format = '[ $time ]($style)'

# 6. THE BOLT
[character]
success_symbol = "[󱐋❯](bold color_arc)"
error_symbol = "[󱐋❯](bold color_red_alert)"
