# ==============================================================================
#  Preset: Chroma Supernova (Center-Out Edition)
#  Inspired by: notMyShell Chroma treatment, extended (center-out layout, stops: #fff6d8 #ffc14d #ff5a3c #a3207a #2a0f5c)
#  Configured for: Omarchy / Starship Studio
# ==============================================================================
# glyph-stacking: gradient
# Port of notMyShell's center-out direction: the gradient starts at the middle segment (git, the
# white-hot core) and runs outward to both ends, so the edges are the cold shock shell. Left of
# the core the chains use mirrored thick flames U+E0C2 (fg = the hotter, right-hand color), right
# of it normal flames U+E0C0, so every flame points away from the core like a blast front.
# Regenerate colors with .agents/skills/starship-glyph-stacking/scripts/gradient.py.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_s0 bg:transparent)\
$os\
[](fg:color_s010 bg:color_s0)\
[](fg:color_s011 bg:color_s010)\
[](fg:color_s1 bg:color_s011)\

$directory\
[](fg:color_s120 bg:color_s1)\
[](fg:color_s121 bg:color_s120)\
[](fg:color_s2 bg:color_s121)\

$git_branch$git_status\
[](fg:color_s2 bg:color_s230)\
[](fg:color_s230 bg:color_s231)\
[](fg:color_s231 bg:color_s3)\

$c$rust$golang$nodejs$deno$python\
[](fg:color_s3 bg:color_s340)\
[](fg:color_s340 bg:color_s341)\
[](fg:color_s341 bg:color_s4)\

$time\
[](fg:color_s4 bg:transparent)\
\n$character"""

palette = 'chroma_supernova'

[palettes.chroma_supernova]
color_s0    = '#2a0f5c' # t=1.00 segment fill (distance from the core)
color_s1    = '#ff5a3c' # t=0.50 segment fill (distance from the core)
color_s2    = '#fff6d8' # t=0.00 segment fill (distance from the core)
color_s3    = '#ff5a3c' # t=0.50 segment fill (distance from the core)
color_s4    = '#2a0f5c' # t=1.00 segment fill (distance from the core)
color_s010  = '#69335e' # OKLab step 1/2 (s0 to s1)
color_s011  = '#b14956' # OKLab step 2/2 (s0 to s1)
color_s120  = '#ff9473' # OKLab step 1/2 (s1 to s2)
color_s121  = '#ffc6a5' # OKLab step 2/2 (s1 to s2)
color_s230  = '#ffc6a5' # OKLab step 1/2 (s2 to s3)
color_s231  = '#ff9473' # OKLab step 2/2 (s2 to s3)
color_s340  = '#b14956' # OKLab step 1/2 (s3 to s4)
color_s341  = '#69335e' # OKLab step 2/2 (s3 to s4)
color_paper = '#fbfbff' # Paper (text on dark fills)
color_ink   = '#15131a' # Ink (text on light fills)
color_error = '#ff3355' # Error (paired with the ✗ shape)

[os]
disabled = false
style = "bg:color_s0 fg:color_paper bold"
format = '[ 󰝨 ]($style)'

[directory]
style = "bg:color_s1 fg:color_ink bold"
format = "[ 󰲋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "bg:color_s2 fg:color_ink bold"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:color_s2 fg:color_ink bold"
format = '([$all_status$ahead_behind ]($style))'

[c]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[deno]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:color_s3 fg:color_ink bold"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_s4 fg:color_paper bold"
format = '[ $time ]($style)'

# A three-step gradient chevron (starting at the first fill visible on a dark terminal); errors swap to a single-hue ✗ so they never blend into the gradient.
[character]
success_symbol = "[❯](bold color_s2)[❯](bold color_s1)[❯](bold color_s1)"
error_symbol = "[✗❯](bold color_error)"
