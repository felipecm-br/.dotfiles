# Waymaker Agent Worktree Preset (`wm -o awt`)
# Interactive worktree switcher with Nav Mode, BASE branch column, ANSI colors, and multi-tab previews.

[tui]
mouse = true
percentage = 100
max = 9999
restore_fullscreen = false

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"
color = "black"
hints = false

[ui.border]
sides = ""

[ui.parent_peek]
enabled = false

[query]
status_inline = true
prompt = " "
show = true

[header]
header_lines = 1
style.fg = "Cyan"
style.modifier = "BOLD"

[footer]
content = " {cyan,bold:Enter} {darkgray:Connect} {darkgray:│} {cyan,bold:Tab} {darkgray:Cockpit} {darkgray:│} {cyan,bold:c} {darkgray:New} {darkgray:│} {cyan,bold:S} {darkgray:Ship} {darkgray:│} {cyan,bold:m} {darkgray:Merge} {darkgray:│} {cyan,bold:R} {darkgray:Rebase} {darkgray:│} {cyan,bold:P} {darkgray:PR} {darkgray:│} {cyan,bold:d} {darkgray:Delete} {darkgray:│} {cyan,bold:p} {darkgray:Preview} {darkgray:│} {cyan,bold:Esc} {darkgray:Exit}"
row_connection = "Full"
match_indent = false
separator = "light"

[matcher]
typo_tolerance = true

[matcher.sort]
threshold = "smart"

[results]
reverse = false
current_nav_bar = "Plain"
column_spacing = 2
row_connection = "Full"

[results.border]
sides = ""

[results.symlink]
active = false

[results.current_style]
bg = "reset"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[columns]
split = "\t"
default = "branch"
max_columns = 10
names = [
    { name = "branch" },
    { name = "base" },
    { name = "status" },
    { name = "main" },
    { name = "remote" },
    { name = "age" },
    { name = "commit" },
    { name = "session", hidden = true },
    { name = "path", hidden = true },
    { name = "raw", hidden = true },
]

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
show = true
wrap = false

[preview.border]
sides = "LEFT"
color = "Darkgray"

# ── Preview Layout 1: Status & Local Changes + Recent Commits ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Git Status & Local Changes ━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" status -s --branch 2>/dev/null
    echo ""
    echo "━━━ Recent Commits ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" log --oneline --graph --color=always -n 8 2>/dev/null
fi
'''
side = "right"
percentage = 60

# ── Preview Layout 2: Diff vs Main (Merge Base) ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Diff vs main (Merge Base) ━━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" diff --color=always main...HEAD 2>/dev/null | head -n 120
fi
'''
side = "right"
percentage = 60

# ── Preview Layout 3: Commit History & Stats ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Commit History & Statistics ━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" log --stat --color=always -n 5 2>/dev/null
fi
'''
side = "right"
percentage = 60

[start.command]
command = '''
main_branch="main"
current_wt=$(git rev-parse --show-toplevel 2>/dev/null)
TAB=$'\t'

printf "BRANCH\tBASE\tSTATUS\tMAIN ↕\tREMOTE ⇅\tAGE\tCOMMIT\tSESSION\tPATH\n"

declare -A br_base=()
while read -r k v; do
    b="${k#branch.}"
    b="${b%.base}"
    br_base["$b"]="$v"
done < <(git config --get-regexp '^branch\..*\.base$' 2>/dev/null || true)

declare -A br_up=()
declare -A br_track=()
declare -A br_age=()
while IFS='|' read -r b u tr ag; do
    br_up["$b"]="$u"
    br_track["$b"]="$tr"
    ag="${ag% ago}"
    ag="${ag// minutes/m}"; ag="${ag// minute/m}"
    ag="${ag// hours/h}";   ag="${ag// hour/h}"
    ag="${ag// days/d}";    ag="${ag// day/d}"
    ag="${ag// weeks/w}";   ag="${ag// week/w}"
    br_age["$b"]="$ag"
done < <(git for-each-ref --format='%(refname:short)|%(upstream:short)|%(upstream:track,nobracket)|%(committerdate:relative)' refs/heads 2>/dev/null || true)

while IFS="$TAB" read -r wt_path branch head; do
    [[ -z "$wt_path" ]] && continue
    wt_parent="${wt_path%/*}"
    repo_parent="${wt_parent##*/}"
    repo_base="${wt_path##*/}"
    if [[ "$repo_parent" == ".dotfiles" ]]; then
        session_name="_dotfiles/$repo_base"
    else
        session_name="${repo_parent}/${repo_base}"
    fi

    if [[ "$wt_path" == "$current_wt" ]]; then
        branch_display="\033[1;36m $branch\033[0m"
    elif [[ "$branch" == "$main_branch" ]]; then
        branch_display="\033[1;33m $branch\033[0m"
    else
        branch_display=" $branch"
    fi

    base_branch="${br_base[$branch]:-}"
    if [[ -z "$base_branch" ]]; then
        [[ "$branch" == "$main_branch" ]] && base_display="\033[2m-\033[0m" || base_display="\033[35m$main_branch\033[0m"
    else
        base_display="\033[35m$base_branch\033[0m"
    fi

    porcelain=$(git -C "$wt_path" --no-optional-locks status --porcelain 2>/dev/null)
    if [[ -n "$porcelain" ]]; then
        dirty_count=0
        while IFS= read -r _; do ((dirty_count++)); done <<< "$porcelain"
        status_icon="\033[1;31m󰅖\033[0m \033[31m(+${dirty_count})\033[0m"
    else
        status_icon="\033[1;32m󰄬\033[0m"
    fi

    counts=$(git -C "$wt_path" --no-optional-locks rev-list --left-right --count "${main_branch}...HEAD" 2>/dev/null)
    read -r behind ahead <<< "$counts"
    if [[ -z "$counts" ]]; then
        main_div="\033[2m-\033[0m"
    elif [[ "${ahead:-0}" -eq 0 && "${behind:-0}" -eq 0 ]]; then
        main_div="\033[32mSynced\033[0m"
    else
        main_div=""
        [[ "${ahead:-0}" -gt 0 ]] && main_div+="\033[1;32m󰞕${ahead}\033[0m "
        [[ "${behind:-0}" -gt 0 ]] && main_div+="\033[1;31m󰞒${behind}\033[0m"
        main_div="${main_div% }"
    fi

    upstream_div="\033[2m-\033[0m"
    if [[ -n "${br_up[$branch]:-}" ]]; then
        tr="${br_track[$branch]:-}"
        if [[ -z "$tr" ]]; then
            upstream_div="\033[32mSynced\033[0m"
        else
            u_ahead=0; u_behind=0
            [[ "$tr" =~ ahead\ ([0-9]+) ]] && u_ahead="${BASH_REMATCH[1]}"
            [[ "$tr" =~ behind\ ([0-9]+) ]] && u_behind="${BASH_REMATCH[1]}"
            upstream_div=""
            [[ "$u_ahead" -gt 0 ]] && upstream_div+="\033[1;32m󰞕${u_ahead}\033[0m "
            [[ "$u_behind" -gt 0 ]] && upstream_div+="\033[1;31m󰞒${u_behind}\033[0m"
            upstream_div="${upstream_div% }"
            [[ -z "$upstream_div" ]] && upstream_div="\033[32mSynced\033[0m"
        fi
    fi

    age="${br_age[$branch]:-now}"
    printf "%b\t%b\t%b\t%b\t%b\t\033[2m%s\033[0m\t\033[33m%s\033[0m\t%s\t%s\t%s\n" \
        "$branch_display" "$base_display" "$status_icon" "$main_div" "$upstream_div" "$age" "$head" "$session_name" "$wt_path" "$branch"
done < <(git worktree list --porcelain 2>/dev/null | awk '
/^worktree / { if (path && !bare) printf "%s\t%s\t%s\n", path, (branch ? branch : head), head; path = substr($0, 10); branch = ""; head = ""; bare = 0 }
/^bare$/     { bare = 1 }
/^HEAD /     { head = substr($0, 6, 7) }
/^branch /   { branch = substr($0, 8); sub("refs/heads/", "", branch) }
END          { if (path && !bare) printf "%s\t%s\t%s\n", path, (branch ? branch : head), head }
')
'''

[start]
ansi = true
output_template = "{=session}\t{=path}"

[binds]
"@delete_worktree" = '''Confirm({red,bold:󱓌} Delete worktree {=raw}? (Enter/Esc) | $HOME/.config/waymaker/scripts/awt-delete.sh "{=session}" "{=path}" "{=raw}" -f)'''
"@new_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-new.sh "{=raw}")''',
    "Reload",
]
"@merge_worktree"  = '''Confirm({magenta,bold:} Merge {=raw} into {=base}? (Enter/Esc) | $HOME/.config/waymaker/scripts/awt-merge.sh "{=raw}" "{=path}" "{=session}" "{=base}")'''
"@ship_worktree"   = '''Confirm({cyan,bold:🚀} Ship {=raw} -> {=base} & push? (Enter/Esc) | $HOME/.config/waymaker/scripts/awt-merge.sh "{=raw}" "{=path}" "{=session}" "{=base}" --push)'''
"@rebase_worktree" = '''Confirm({yellow,bold:󱓎} Rebase {=raw} onto {=base}? (Enter/Esc) | $HOME/.config/waymaker/scripts/awt-rebase.sh "{=raw}" "{=path}" "{=base}")'''
"@rename_worktree" = '''Prompt({cyan,bold:} Rename {=raw} to: | $HOME/.config/waymaker/scripts/awt-rename.sh "{=raw}" "{=path}" "{input}" | {=raw})'''
"@bg_agent"        = '''Prompt({yellow,bold:󱐋} Dispatch Background Agent Task: | $HOME/.local/bin/awt -c -A "{input}" --no-tmux -- agy -p "{input}")'''
"@pr_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-pr.sh)''',
    "Reload",
]
"@fetch_remotes" = [
    '''Execute(
        echo "Fetching remotes for {=raw}..."
        git -C "{=path}" fetch --all --prune
    )''',
    "Reload",
]

# Standard & fallback keys (active in filter mode)
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-shift-j" = "PreviewDown(5)"
"ctrl-shift-k" = "PreviewUp(5)"
"ctrl-shift-J" = "PreviewDown(5)"
"ctrl-shift-K" = "PreviewUp(5)"
"ctrl-p" = "SwitchPreview"
"ctrl-c" = "Quit"
"ctrl-n" = "@new_worktree"
"ctrl-d" = "@delete_worktree"
"ctrl-m" = "@merge_worktree"
"ctrl-s" = "@ship_worktree"
"ctrl-shift-s" = "@ship_worktree"
"ctrl-shift-S" = "@ship_worktree"
"ctrl-r" = "@rename_worktree"
"ctrl-shift-r" = "@rebase_worktree"
"ctrl-shift-R" = "@rebase_worktree"
"ctrl-shift-p" = "@pr_worktree"
"ctrl-shift-P" = "@pr_worktree"
"ctrl-u" = "@fetch_remotes"
"esc" = "FocusNav"
"tab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"shift-tab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"backtab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"shift-backtab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]

# Nav Mode Binds (compatibility with nav^^ prefix in [binds])
"nav^^tab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"nav^^shift-tab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"nav^^backtab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"nav^^shift-backtab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"nav^^/" = "FocusFilter"
"nav^^i" = "FocusFilter"
"nav^^j" = "Down"
"nav^^k" = "Up"
"nav^^down" = "Down"
"nav^^up" = "Up"
"nav^^enter" = "Accept"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^p" = "SwitchPreview"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^c" = "@new_worktree"
"nav^^m" = "@merge_worktree"
"nav^^S" = "@ship_worktree"
"nav^^R" = "@rebase_worktree"
"nav^^r" = "@rename_worktree"
"nav^^P" = "@pr_worktree"
"nav^^d" = "@delete_worktree"
"nav^^u" = "@fetch_remotes"
"nav^^B" = "@bg_agent"

# Nav Mode Binds (active when Results / Nav Mode is focused)
[ui.nav.binds]
"tab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"shift-tab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"backtab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"shift-backtab" = ["Print(__SWITCH_COCKPIT__)", "Quit"]
