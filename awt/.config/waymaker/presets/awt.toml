# Matchmaker Agent Worktree Preset (`mm -o awt`)
# Interactive worktree switcher with Nav Mode, BASE branch column, ANSI colors, and multi-tab previews.

[tui]
percentage = 30
min = 12
max = 25
restore_fullscreen = false

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"
color = "white"
hints = false

[ui.parent_peek]
enabled = false

[query]
status_inline = true
prompt = "> "
prompt_style.fg = "white"
prompt_style.modifier = "BOLD"

[header]
header_lines = 1
style.fg = "Cyan"
style.modifier = "BOLD"

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Connect}  •  {yellow,bold:[c]} {darkgray:New}  •  {magenta,bold:[m]} {darkgray:Merge}  •  {magenta,bold:[S]} {darkgray:Ship}  •  {yellow,bold:[R]} {darkgray:Rebase}  •  {cyan,bold:[r]} {darkgray:Rename}  •  {blue,bold:[P]} {darkgray:PR}  •  {red,bold:[d]} {darkgray:Delete}  •  {blue,bold:[p]} {darkgray:Preview}  •  {darkgray,bold:[q]} {darkgray:Quit}"
row_connection = "Full"
match_indent = false
style.fg = "gray"
style.modifier = "DIM"

[matcher]
typo_tolerance = true

[matcher.sort]
threshold = "smart"

[results]
reverse = false
column_spacing = 2

[results.symlink]
active = false

[results.current_style]
bg = "darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[columns]
split = "\t"
default = "branch"
max_columns = 10
names = [
    { name = "branch" },
    { name = "base" },
    { name = "status" },
    { name = "main" },
    { name = "remote" },
    { name = "age" },
    { name = "commit" },
    { name = "session", hidden = true },
    { name = "path", hidden = true },
    { name = "raw", hidden = true },
]

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
show = true

# ── Preview Layout 1: Status & Local Changes + Recent Commits ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Git Status & Local Changes ━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" status -s --branch 2>/dev/null
    echo ""
    echo "━━━ Recent Commits ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" log --oneline --graph --color=always -n 8 2>/dev/null
fi
'''
side = "right"
percentage = 55

# ── Preview Layout 2: Diff vs Main (Merge Base) ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Diff vs main (Merge Base) ━━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" diff --color=always main...HEAD 2>/dev/null | head -n 120
fi
'''
side = "right"
percentage = 55

# ── Preview Layout 3: Commit History & Stats ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Commit History & Statistics ━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" log --stat --color=always -n 5 2>/dev/null
fi
'''
side = "right"
percentage = 55

[start.command]
command = '''
main_branch="main"
current_wt=$(git rev-parse --show-toplevel 2>/dev/null)
TAB="$(printf '\t')"

# Header line (consumed by header_lines = 1)
printf "BRANCH\tBASE\tSTATUS\tMAIN ↕\tREMOTE ⇅\tAGE\tCOMMIT\tSESSION\tPATH\n"

git worktree list --porcelain 2>/dev/null | awk '
/^worktree / { if (path && !bare) printf "%s\t%s\t%s\n", path, (branch ? branch : head), head; path = substr($0, 10); branch = ""; head = ""; bare = 0 }
/^bare$/     { bare = 1 }
/^HEAD /     { head = substr($0, 6, 7) }
/^branch /   { branch = substr($0, 8); sub("refs/heads/", "", branch) }
END          { if (path && !bare) printf "%s\t%s\t%s\n", path, (branch ? branch : head), head }
' | while IFS="$TAB" read -r wt_path branch head; do
    # Session name calculation for Sesh
    repo_parent=$(basename "$(dirname "$wt_path")")
    repo_base=$(basename "$wt_path")
    if [[ "$repo_parent" == ".dotfiles" ]]; then
        session_name="_dotfiles/$repo_base"
    else
        session_name="${repo_parent}/${repo_base}"
    fi

    # Marker & Branch formatting with colors
    if [[ "$wt_path" == "$current_wt" ]]; then
        branch_display="\033[1;36m $branch\033[0m"
    elif [[ "$branch" == "$main_branch" ]]; then
        branch_display="\033[1;33m $branch\033[0m"
    else
        branch_display=" $branch"
    fi

    # Base branch detection
    base_branch=$(git -C "$wt_path" config "branch.${branch}.base" 2>/dev/null)
    if [[ -z "$base_branch" ]]; then
        if [[ "$branch" == "$main_branch" ]]; then
            base_display="\033[2m-\033[0m"
        else
            base_display="\033[35m$main_branch\033[0m"
        fi
    else
        base_display="\033[35m$base_branch\033[0m"
    fi

    # Dirty / Clean status with colors
    dirty_count=$(git -C "$wt_path" status --porcelain 2>/dev/null | wc -l)
    if [[ "$dirty_count" -gt 0 ]]; then
        status_icon="\033[1;31m󰅖\033[0m \033[31m(+${dirty_count})\033[0m"
    else
        status_icon="\033[1;32m󰄬\033[0m"
    fi

    # Main divergence (Ahead / Behind) with colored arrows
    counts=$(git -C "$wt_path" rev-list --left-right --count "${main_branch}...HEAD" 2>/dev/null)
    behind=$(echo "$counts" | awk '{print $1}')
    ahead=$(echo "$counts" | awk '{print $2}')
    if [[ -z "$counts" ]]; then
        main_div="\033[2m-\033[0m"
    elif [[ "$ahead" -eq 0 && "$behind" -eq 0 ]]; then
        main_div="\033[32mSynced\033[0m"
    else
        main_div=""
        [[ "$ahead" -gt 0 ]] && main_div+="\033[1;32m󰞕${ahead}\033[0m "
        [[ "$behind" -gt 0 ]] && main_div+="\033[1;31m󰞒${behind}\033[0m"
        main_div="${main_div% }"
    fi

    # Remote upstream divergence with colored arrows
    upstream_div="\033[2m-\033[0m"
    if git -C "$wt_path" rev-parse --abbrev-ref '@{u}' >/dev/null 2>&1; then
        u_counts=$(git -C "$wt_path" rev-list --left-right --count '@{u}...HEAD' 2>/dev/null)
        u_behind=$(echo "$u_counts" | awk '{print $1}')
        u_ahead=$(echo "$u_counts" | awk '{print $2}')
        if [[ "$u_ahead" -eq 0 && "$u_behind" -eq 0 ]]; then
            upstream_div="\033[32mSynced\033[0m"
        else
            upstream_div=""
            [[ "$u_ahead" -gt 0 ]] && upstream_div+="\033[1;32m󰞕${u_ahead}\033[0m "
            [[ "$u_behind" -gt 0 ]] && upstream_div+="\033[1;31m󰞒${u_behind}\033[0m"
            upstream_div="${upstream_div% }"
        fi
    fi

    # Age & Commit hash
    age=$(git -C "$wt_path" log -1 --format="%cr" 2>/dev/null | sed "s/ ago//; s/ minutes/m/; s/ hours/h/; s/ days/d/; s/ weeks/w/")
    age_display="\033[2m${age:-now}\033[0m"
    head_display="\033[33m$head\033[0m"

    printf "%b\t%b\t%b\t%b\t%b\t%b\t%b\t%s\t%s\t%s\n" \
        "$branch_display" "$base_display" "$status_icon" "$main_div" "$upstream_div" "$age_display" "$head_display" "$session_name" "$wt_path" "$branch"
done
'''

[start]
ansi = true
output_template = "{=session}\t{=path}"

[binds]
"@delete_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-delete.sh --confirm "{=session}" "{=path}" "{=raw}")''',
    "Reload",
]
"@new_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-new.sh "{=raw}")''',
    "Reload",
]
"@merge_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-merge.sh --confirm "{=raw}" "{=path}" "{=session}" "{=base}")''',
    "Reload",
]
"@ship_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-merge.sh --confirm "{=raw}" "{=path}" "{=session}" "{=base}" --push)''',
    "Reload",
]
"@rebase_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-rebase.sh --confirm "{=raw}" "{=path}" "{=base}")''',
    "Reload",
]
"@rename_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-rename.sh "{=raw}" "{=path}")''',
    "Reload",
]
"@pr_worktree" = [
    '''Execute($HOME/.config/waymaker/scripts/awt-pr.sh)''',
    "Reload",
]
"@fetch_remotes" = [
    '''Execute(
        echo "Fetching remotes for {=raw}..."
        git -C "{=path}" fetch --all --prune
    )''',
    "Reload",
]

# Standard & fallback keys (active in filter mode)
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-shift-j" = "PreviewDown(5)"
"ctrl-shift-k" = "PreviewUp(5)"
"ctrl-shift-J" = "PreviewDown(5)"
"ctrl-shift-K" = "PreviewUp(5)"
"ctrl-p" = "SwitchPreview"
"ctrl-c" = "Quit"
"ctrl-n" = "@new_worktree"
"ctrl-d" = "@delete_worktree"
"ctrl-m" = "@merge_worktree"
"ctrl-s" = "@ship_worktree"
"ctrl-shift-s" = "@ship_worktree"
"ctrl-shift-S" = "@ship_worktree"
"ctrl-r" = "@rename_worktree"
"ctrl-shift-r" = "@rebase_worktree"
"ctrl-shift-R" = "@rebase_worktree"
"ctrl-shift-p" = "@pr_worktree"
"ctrl-shift-P" = "@pr_worktree"
"ctrl-u" = "@fetch_remotes"
"esc" = "FocusNav"

# Nav Mode Binds (compatibility with nav^^ prefix in [binds])
"nav^^/" = "FocusFilter"
"nav^^i" = "FocusFilter"
"nav^^j" = "Down"
"nav^^k" = "Up"
"nav^^down" = "Down"
"nav^^up" = "Up"
"nav^^enter" = "Accept"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^p" = "SwitchPreview"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^c" = "@new_worktree"
"nav^^m" = "@merge_worktree"
"nav^^S" = "@ship_worktree"
"nav^^R" = "@rebase_worktree"
"nav^^r" = "@rename_worktree"
"nav^^P" = "@pr_worktree"
"nav^^d" = "@delete_worktree"
"nav^^u" = "@fetch_remotes"

