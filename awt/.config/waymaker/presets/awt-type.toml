# Matchmaker Agent Worktree Conventional Type Preset (`mm -o awt-type`)

[tui]
percentage = 30
min = 10
max = 20
restore_fullscreen = false

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"
color = "white"
hints = false

[ui.parent_peek]
enabled = false

[query]
status_inline = false
prompt = "> "
prompt_style.fg = "white"
prompt_style.modifier = "BOLD"

[status]
show = false

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Select Type}  •  {darkgray,bold:[Esc/q]} {darkgray:Cancel}"
row_connection = "Full"
match_indent = false
style.fg = "gray"
style.modifier = "DIM"

[matcher]
typo_tolerance = true

[matcher.sort]
threshold = "smart"

[results]
reverse = false
column_spacing = 2

[results.symlink]
active = false

[results.current_style]
bg = "darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[columns]
split = "\t"
default = "type"
max_columns = 5
names = [
    { name = "type" },
    { name = "description" },
    { name = "icon", hidden = true },
    { name = "prefix", hidden = true },
]

[preview]
show = false

[start.command]
command = '''
printf "\033[1;36m feat\033[0m\tNew feature\t\tfeat/\n\
\033[1;31m fix\033[0m\tBug fix\t\tfix/\n\
\033[1;33m󰣪 refactor\033[0m\tCode restructuring\t󰣪\trefactor/\n\
\033[1;35m󰓅 perf\033[0m\tPerformance optimization\t󰓅\tperf/\n\
\033[1;36m ci\033[0m\tCI/CD workflows / pipelines\t\tci/\n\
\033[1;34m chore\033[0m\tMaintenance / config\t\tchore/\n\
\033[1;32m󰧮 docs\033[0m\tDocumentation\t󰧮\tdocs/\n\
\033[1;36m󰙨 test\033[0m\tTest suites\t󰙨\ttest/\n\
\033[1;33m󰏖 build\033[0m\tDependencies / build\t󰏖\tbuild/\n\
\033[2m󰓹 custom\033[0m\tNo prefix / freeform\t󰓹\t\n"
'''

[start]
ansi = true
output_template = "{=icon}\t{=prefix}"

[binds]
"enter" = "Accept"
"esc" = "Quit"
"ctrl-c" = "Quit"
"ctrl-j" = "Down"
"ctrl-k" = "Up"

[ui.nav.binds]
"enter" = "Accept"
"esc" = "Quit"
"q" = "Quit"
"j" = "Down"
"k" = "Up"
"down" = "Down"
"up" = "Up"
"g" = "Pos(0)"
"G" = "Pos(-1)"
"/" = "FocusFilter"
