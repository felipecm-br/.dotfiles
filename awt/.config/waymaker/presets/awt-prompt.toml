[tui]
mouse = true
percentage = 30
min = 8
max = 20
restore_fullscreen = false

[ui.nav]
active = true
bar = "Plain"
color = "black"

[ui.border]
sides = ""

[query]
status_inline = true
prompt = " "
show = true

[status]
show = false

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Confirm}  •  {blue,bold:[Esc]} {darkgray:Back}"
row_connection = "Full"
match_indent = false
separator = "light"

[exit]
allow_empty = true

[start]
ansi = true
mode = "standard"
output_template = "{=query}"

[start.command]
command = "echo ''"

[binds]
"enter" = "Accept"
"esc" = "Quit"
"ctrl-c" = "Quit"
