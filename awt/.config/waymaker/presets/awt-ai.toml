# Matchmaker Agent Worktree AI Conversation Preset (`mm -o awt-ai`)

[tui]
mouse = true
percentage = 30
min = 8
max = 20
restore_fullscreen = false

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"
color = "black"
hints = false

[ui.border]
sides = ""

[ui.parent_peek]
enabled = false

[query]
status_inline = true
prompt = " "
show = true

[status]
show = false

[footer]
content = " {cyan,bold:Enter} {darkgray:Select AI Session} {darkgray:│} {cyan,bold:Esc} {darkgray:Back}"
row_connection = "Full"
match_indent = false
separator = "light"

[matcher]
typo_tolerance = true

[matcher.sort]
threshold = "smart"

[results]
reverse = false
column_spacing = 2
row_connection = "Full"

[results.border]
sides = ""

[results.symlink]
active = false

[results.current_style]
bg = "darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[columns]
split = "\t"
default = "title"
max_columns = 5
names = [
    { name = "title" },
    { name = "source" },
    { name = "action" },
    { name = "cmd", hidden = true },
]

[preview]
show = false

[start.command]
command = '''
"$HOME/.config/waymaker/scripts/awt-ai-list.sh"
'''

[start]
ansi = true
output_template = "{=cmd}"

[binds]
"enter" = "Accept"
"esc" = "Quit"
"ctrl-c" = "Quit"
"ctrl-j" = "Down"
"ctrl-k" = "Up"

[ui.nav.binds]
"enter" = "Accept"
"esc" = "Quit"
"q" = "Quit"
"j" = "Down"
"k" = "Up"
"down" = "Down"
"up" = "Up"
"g" = "Pos(0)"
"G" = "Pos(-1)"
"/" = "FocusFilter"
