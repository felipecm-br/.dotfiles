# Matchmaker Scrollback Extractor (`mm -o scrollback`)
# Extrakto-style: stdin = all-list (recent-first); Tab cycles explicit filter
# modes (all -> url -> path -> sha -> all) via mode-specific binds + SetMode.
# (Deliberately NOT @reloadnext/additional_commands: cycle state lives in the
# mode, each Tab does Reload(<filter file>) + SetPrompt + SetMode.)
# Enter copies (stdout -> wl-copy by the caller), Ctrl+V inserts the current
# token into the origin pane (extrakto insert_key). Space multi-selects.
# Keymap mirrors jump.toml; nav starts in filter; preview shows the token's
# scrollback context with highlight (toggle with Ctrl+P).

[ui.nav]
active = true
profile = "list"
focus_on_start = "filter"
bar = "Plain"
color = "Darkgray"
hints = false

[tui]
percentage = 100
max = 9999

[start]
sort = false
mode = "all"

[start.command]
command = "cat /tmp/scrollback-extract-all.txt"
additional = [
  "cat /tmp/scrollback-extract-cmd.txt",
  "cat /tmp/scrollback-extract-path.txt",
  "cat /tmp/scrollback-extract-url.txt",
  "cat /tmp/scrollback-extract-sha.txt",
  "cat /tmp/scrollback-extract-all.txt",
]

[matcher.sort]
threshold = false

[query]
prompt = "> "
status_inline = true

[results]
scroll_wrap = true
max = 15
row_connection = "Full"

[results.current_style]
fg = "black"
bg = "Darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "white"

[preview]
show = true
wrap = true
scrollbar = true

[[preview.layout]]
command = 'grep -n -C 2 -F -m 3 --color=always {} /tmp/scrollback-extract-src.txt | head -40'
side = "right"
percentage = 60

# Layout 1: Overrides and disables subsequent layouts (no fullscreen preview in yank popup)
[[preview.layout]]
max = 0

[preview.border]
sides = "LEFT"
color = "Gray"

[previewer]
debounce_ms = 200
delay_clear = true

[footer]
content = " {cyan,bold:[enter]} {darkgray:yank} {cyan,bold:[C-v]} {darkgray:insert} {cyan,bold:[C-e]} {darkgray:open} {cyan,bold:[tab]} {darkgray:filter} {cyan,bold:[spc]} {darkgray:multi}"
match_indent = false

[exit]
abort_empty = true

[binds]
"enter" = "Accept"
"esc" = "ToggleFocus"
"ctrl-c" = "Quit"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-v" = 'ExecuteSilent(test -n "$MM_ORIGIN_PANE" && tmux send-keys -t "$MM_ORIGIN_PANE" -l -- {})'
"ctrl-e" = 'ExecuteSilent(~/.config/tmux/scrollback-open.sh {} "$MM_ORIGIN_CWD")'
"tab" = ["SetPrompt(cmd> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-cmd.txt)", "SetMode(cmd)", "Pos(0)"]
"shift-backtab" = ["SetPrompt(sha> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-sha.txt)", "SetMode(sha)", "Pos(0)"]
"backtab" = ["SetPrompt(sha> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-sha.txt)", "SetMode(sha)", "Pos(0)"]

# Filter modes: Tab advances, Shift-Tab goes back. Each state reloads its own
# file explicitly — no dependence on additional_commands cycling.
"all^^tab" = ["SetPrompt(cmd> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-cmd.txt)", "SetMode(cmd)", "Pos(0)"]
"all^^shift-backtab" = ["SetPrompt(sha> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-sha.txt)", "SetMode(sha)", "Pos(0)"]
"all^^backtab" = ["SetPrompt(sha> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-sha.txt)", "SetMode(sha)", "Pos(0)"]
"cmd^^tab" = ["SetPrompt(path> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-path.txt)", "SetMode(path)", "Pos(0)"]
"cmd^^shift-backtab" = ["SetPrompt(> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-all.txt)", "SetMode(all)", "Pos(0)"]
"cmd^^backtab" = ["SetPrompt(> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-all.txt)", "SetMode(all)", "Pos(0)"]
"path^^tab" = ["SetPrompt(url> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-url.txt)", "SetMode(url)", "Pos(0)"]
"path^^shift-backtab" = ["SetPrompt(cmd> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-cmd.txt)", "SetMode(cmd)", "Pos(0)"]
"path^^backtab" = ["SetPrompt(cmd> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-cmd.txt)", "SetMode(cmd)", "Pos(0)"]
"url^^tab" = ["SetPrompt(sha> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-sha.txt)", "SetMode(sha)", "Pos(0)"]
"url^^shift-backtab" = ["SetPrompt(path> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-path.txt)", "SetMode(path)", "Pos(0)"]
"url^^backtab" = ["SetPrompt(path> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-path.txt)", "SetMode(path)", "Pos(0)"]
"sha^^tab" = ["SetPrompt(> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-all.txt)", "SetMode(all)", "Pos(0)"]
"sha^^shift-backtab" = ["SetPrompt(url> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-url.txt)", "SetMode(url)", "Pos(0)"]
"sha^^backtab" = ["SetPrompt(url> )", "SetQuery()", "Reload(cat /tmp/scrollback-extract-url.txt)", "SetMode(url)", "Pos(0)"]

[ui.nav.binds]
"enter" = "Accept"
"esc" = "Quit"
"q" = "Quit"
"/" = "FocusFilter"
"ctrl-c" = "Quit"
"ctrl-v" = 'ExecuteSilent(test -n "$MM_ORIGIN_PANE" && tmux send-keys -t "$MM_ORIGIN_PANE" -l -- {})'
"j" = "Down"
"k" = "Up"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
" " = "Toggle"
"e" = 'ExecuteSilent(~/.config/tmux/scrollback-open.sh {} "$MM_ORIGIN_CWD")'
