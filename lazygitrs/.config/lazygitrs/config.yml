git:
  commit:
    # Title + body from the staged diff (stdin); fastest-first chain: claude haiku → agy flash → opencode.
    # lazycommit's single-line output and stale model list are why this replaced it (see the script header).
    generateCommand: "ai-commit-msg"

gui:
  border: "rounded"
  # Fallback palette; the `border-gradient` toggle overrides it through
  # LAZYGITRS_BORDER_GRADIENT (lazygitrs-popup.sh and the zsh wrapper).
  borderGradient: "aurora"

keybinding:
  universal:
    refresh: "r"
    quit: "q"
    quit-alt1: "<c-c>"
    return: "<escape>"
  files:
    # c opens the commit popup pre-filled by AI; G opens it empty (manual message)
    generateAICommit: "c"
    commitChanges: "G"
  commitMessage:
    commitMenu: "<c-o>"
    aiGenerate: "<c-a>"

aiNotes:
  enabled: true

os:
  # Aliases/functions sourced before `:` and custom commands (was hardcoded).
  shellFunctionsFile: "~/.dotfiles/main/git/.zsh/packages/git.zsh"
