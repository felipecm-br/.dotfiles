# Layered over ai-launch.toml by `ai-launch --pick`: the caller closes on Esc
[footer]
content = " {cyan,bold:Enter} {darkgray:Launch} {darkgray:│} {cyan,bold:C-h/l} {darkgray:Effort} {darkgray:│} {white,bold:⠛} {darkgray:Recommended} {darkgray:│} {cyan,bold:type} {darkgray:Filter} {darkgray:│} {cyan,bold:Esc} {darkgray:Close}"

# No image previews here: skip the terminal graphics probe, which holds the first frame
# for up to 100 ms inside tmux (tests/popup_render_perf.test.sh).
[preview.media]
active = false
