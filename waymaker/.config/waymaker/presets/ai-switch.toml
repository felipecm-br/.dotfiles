[ui.nav]
active = true
basic = true
passthrough = true
bar = "Plain"
color = "black"
prompt = ""
focus_on_start = "picker"
hints = false

[start]
sort = false
ansi = true

[preview]
show = false

[tui]
mouse = true
percentage = 100
max = 9999

[matcher.sort]
threshold = false

[ui.border]
sides = ""

[query]
prompt = " "
prompt_style.fg = "blue"
status_inline = true
show = true

[footer]
content = " {cyan,bold:Enter} {darkgray:Switch} {darkgray:│} {white,bold:⠛} {darkgray:Current} {darkgray:│} {cyan,bold:type} {darkgray:Filter} {darkgray:│} {cyan,bold:Esc} {darkgray:Cancel}"
row_connection = "Full"
match_indent = false
separator = "light"

[results]
multi = false
spinner_inline = true
current_prefix = ""
unselected_prefix = "  "
current_nav_bar = "Plain"
row_connection = "Full"
column_spacing = 1

[results.style]
fg = "gray"
modifier = "DIM"

[results.current_style]
fg = "white"
bg = "reset"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "lightcyan"
modifier = "BOLD"

[results.border]
sides = ""

[ui.nav.binds]
"esc" = "Quit"
"q"   = "Quit"

[binds]
# --pos parks the cursor on the current model; typing must jump back to the best match
"QueryChange" = "Pos(0)"
"esc"    = "Quit"
"ctrl-c" = "Quit"
