[ui.nav]
active = true
basic = true
bar = "Plain"
color = "black"
prompt = ""
focus_on_start = "filter"
hints = false

[start]
sort = false
ansi = true

[start.command]
command = "wm session list --icons | grep -Ev '(_lazygitrs|_popups|[[:space:]]+\\.)'"
additional = [
    "wm session list --icons | grep -Ev '(_lazygitrs|_popups|[[:space:]]+\\.)'",
    "wm session list -t --icons | grep -Ev '(_lazygitrs|_popups|[[:space:]]+\\.)'",
    "wm session list -z --icons",
]

[tui]
mouse = true
percentage = 100
max = 9999

[matcher.sort]
threshold = false

[ui.border]
sides = ""

[query]
prompt = " "
status_inline = true
show = true

[query.local]
prompt = " "
prompt_style.fg = "cyan"

[query.frecency]
prompt = " "
prompt_style.fg = "blue"

[query.bookmarks]
prompt = " "
prompt_style.fg = "yellow"

[footer]
content = " {cyan,bold:Enter} {darkgray:Menu} {darkgray:│} {cyan,bold:r} {darkgray:Auto} {darkgray:│} {cyan,bold:a} {darkgray:Agy} {darkgray:│} {cyan,bold:c} {darkgray:Claude} {darkgray:│} {cyan,bold:u} {darkgray:Quota} {darkgray:│} {cyan,bold:s} {darkgray:Cockpit} {darkgray:│} {cyan,bold:Tab} {darkgray:Cycle} {darkgray:│} {cyan,bold:/} {darkgray:Filter} {darkgray:│} {cyan,bold:d} {darkgray:Kill} {darkgray:│} {cyan,bold:Esc} {darkgray:Exit}"
row_connection = "Full"
match_indent = false
separator = "light"

[results]
multi = false
spinner_inline = true
current_prefix = " "
unselected_prefix = "  "
row_connection = "Full"
column_spacing = 1

[results.prefix_style]
fg = "cyan"
modifier = "BOLD"

[results.current_style]
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[results.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.border]
sides = "LEFT"
color = "Darkgray"

[[preview.layout]]
command = 'wm session preview {=}'
side = "right"
percentage = 60

[ui.nav.binds]
"tab"           = "@reloadnext"
"shift-tab"     = "@reloadprev"
"backtab"       = "@reloadprev"
"shift-backtab" = "@reloadprev"
"/"             = "FocusFilter"
"esc"           = "Quit"
"q"             = "Quit"
"r"             = ["Print(@agent=auto)", "Accept"]
"a"             = ["Print(@agent=agy)", "Accept"]
"A"             = ["Print(@agent=agyy)", "Accept"]
"c"             = ["Print(@agent=claude)", "Accept"]
"C"             = ["Print(@agent=claude)", "Accept"]
"u"             = "Execute(bash -c 'ai-quota --visual; read -rsn1')"
"w"             = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"W"             = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"s"             = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"S"             = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"ctrl-s"        = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"d"             = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
"D"             = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
"ctrl-d"        = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
","             = []

[binds]
"tab"           = "@reloadnext"
"shift-tab"     = "@reloadprev"
"backtab"       = "@reloadprev"
"shift-backtab" = "@reloadprev"
"esc"           = "ToggleFocus"
"ctrl-c"        = "Quit"
"ctrl-s"        = ["Print(__SWITCH_COCKPIT__)", "Quit"]
"ctrl-d"        = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
","             = []

