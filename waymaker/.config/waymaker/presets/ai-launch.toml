[ui.nav]
active = true
basic = true
passthrough = true
bar = "Plain"
color = "black"
prompt = ""
focus_on_start = "picker"
hints = false

[start]
sort = false
ansi = true

[preview]
show = false

[tui]
mouse = true
percentage = 100
max = 9999

[matcher.sort]
threshold = false

[ui.border]
sides = ""

[query]
prompt = " "
prompt_style.fg = "blue"
status_inline = true
show = true

[footer]
content = " {cyan,bold:Enter} {darkgray:Launch} {darkgray:│} {cyan,bold:C-h/l} {darkgray:Effort} {darkgray:│} {white,bold:⠛} {darkgray:Recommended} {darkgray:│} {cyan,bold:type} {darkgray:Filter} {darkgray:│} {cyan,bold:Esc} {darkgray:Shell}"
row_connection = "Full"
match_indent = false
separator = "light"

[results]
multi = false
spinner_inline = true
current_prefix = ""
unselected_prefix = "  "
current_nav_bar = "Plain"
row_connection = "Full"
column_spacing = 1

[results.style]
fg = "gray"
modifier = "DIM"

[results.current_style]
fg = "white"
bg = "reset"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "lightcyan"
modifier = "BOLD"

[results.border]
sides = ""

[ui.nav.binds]
"esc" = "Quit"
"q"   = "Quit"

[binds]
# --pos parks the cursor on the recommended row; typing must jump back to the best match
"QueryChange" = "Pos(0)"
"esc"    = "Quit"
"ctrl-c" = "Quit"
# Effort of the agent under the cursor: the gauge after "Effort" in the footer follows the
# cursor; C-h/l (or ←/→) step it and Enter starts or switches with it (waymux launch --effort)
"CursorChange" = "Transform(waymux launch --effort 0 {})"
"ctrl-h" = "Transform(waymux launch --effort -1 {})"
"left"   = "Transform(waymux launch --effort -1 {})"
"ctrl-l" = "Transform(waymux launch --effort 1 {})"
"right"  = "Transform(waymux launch --effort 1 {})"

# No image previews here: skip the terminal graphics probe, which holds the first frame
# for up to 100 ms inside tmux (tests/popup_render_perf.test.sh).
[preview.media]
active = false
