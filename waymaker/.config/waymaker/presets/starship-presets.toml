# Waymaker Starship Preset & Theme Selector (`wm -o starship-presets`)
# Interactive picker to browse, preview, and apply starship prompt presets & Omarchy themes

[ui.nav]
active = true
bar = "Plain"
color = "Cyan"

[tui]
percentage = 80
min = 15
max = 95

[query]
prompt = " Starship > "
status_inline = true

[matcher.sort]
threshold = "smart"

[preview]
show = true
wrap = true

[preview.border]
sides = "LEFT"
color = "Darkgray"
title_fg = "Cyan"

[previewer]
debounce_ms = 10
delay_clear = false

# Layout 1: Starship live prompt + TOML configuration preview
# poll_ms = hot reload: the preview re-runs every 500 ms, so edits to the previewed preset or
# theme show up without moving the cursor (scroll position is kept). Remove to disable.
[[preview.layout]]
command = 'omarchy-starship-preset --render-preview {path} {label}'
side = "right"
percentage = 65
poll_ms = 500

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
command = 'omarchy-starship-preset --list "${OMARCHY_STARSHIP_FILTER:-all}"'
additional = [
  "omarchy-starship-preset --list themes",
  "omarchy-starship-preset --list presets",
  "omarchy-starship-preset --list all"
]

[footer]
content = " {cyan,bold:Enter} {darkgray:Selecionar} {darkgray:│} {cyan,bold:Tab} {darkgray:Filtro (Todos ↔ Temas ↔ Presets)} {darkgray:│} {cyan,bold:j/k} {darkgray:Navegar} {darkgray:│} {cyan,bold:C-l/h} {darkgray:Modo Vim} {darkgray:│} {cyan,bold:C-d} {darkgray:Deletar preset} {darkgray:│} {cyan,bold:Esc} {darkgray:Cancelar}"
row_connection = "Full"
match_indent = false
separator = "light"

[binds]
"tab" = "@next"
"shift-tab" = "@next"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-l" = ["ExecuteSilent($OMARCHY_STARSHIP_CYCLE_SCRIPT $OMARCHY_MODE_FILE fwd)", '''Preview(omarchy-starship-preset --render-preview {path} {label})''']
"ctrl-h" = ["ExecuteSilent($OMARCHY_STARSHIP_CYCLE_SCRIPT $OMARCHY_MODE_FILE bwd)", '''Preview(omarchy-starship-preset --render-preview {path} {label})''']
# Delete the custom preset under the cursor, then re-list the active filter (themes are refused).
"ctrl-d" = ["ExecuteSilent(omarchy-starship-preset --delete {path})", "Reload"]

[ui.nav.binds]
"tab" = "@next"
"shift-tab" = "@next"
"j" = "Down"
"k" = "Up"
"ctrl-l" = ["ExecuteSilent($OMARCHY_STARSHIP_CYCLE_SCRIPT $OMARCHY_MODE_FILE fwd)", '''Preview(omarchy-starship-preset --render-preview {path} {label})''']
"ctrl-h" = ["ExecuteSilent($OMARCHY_STARSHIP_CYCLE_SCRIPT $OMARCHY_MODE_FILE bwd)", '''Preview(omarchy-starship-preset --render-preview {path} {label})''']
"d" = ["ExecuteSilent(omarchy-starship-preset --delete {path})", "Reload"]
"ctrl-d" = ["ExecuteSilent(omarchy-starship-preset --delete {path})", "Reload"]
