# ── Scout ───────────────────────────────────────────────────────────────────────

[scout]
days = 45            # repositories created in the last N days
min_stars = 40
limit = 25
# GitHub search queries; `created:>` and `stars:>=` are added unless present.
queries = [
  "agent-aware terminal multiplexer",
  "coding agents tmux",
  "coding agents worktree",
  "claude code codex sessions",
  "parallel coding agents",
  "agent inbox terminal",
  "claude code hooks",
  "OSC 7501",
  "agent sandbox bubblewrap",
  "fuzzy finder rust tui",
  "git tui diff review agent",
  "git graph tui",
  "terminal file manager rust",
  "tmux session manager",
]
# Words that raise a repository's relevance (description, topics, name).
relevance = [
  "agent", "claude", "codex", "tmux", "worktree", "terminal", "multiplexer", "tui",
  "review", "diff", "sandbox", "quota", "mcp", "hook", "orchestrat", "session",
  "keyboard", "vim", "fuzzy", "rust", "git", "frecency", "picker", "file manager",
]
# Words that lower it (GUI-first, other platforms).
penalty = ["electron", "vscode", "vs code", "macos only", "ios app", "windows only", "browser extension"]
# Trending pages scraped best effort (no API exists).
trending = ["", "rust", "go"]
