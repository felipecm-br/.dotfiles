# ai-upstream sources: what the AI workflow depends on, forks, and watches.
#
# Read by `ai-upstream watch` (what changed upstream, and how it could be adopted)
# and `ai-upstream scout` (new repositories worth a look; everything listed here
# is excluded from scout results). Docs: docs/architecture/upstream-watch-and-scout.md
#
# kind = "dependency"  a tool this stack runs. Releases newer than the installed
#                      version (from `version_cmd`) are reported with their notes.
# kind = "fork"        a local fork. Upstream commits not yet in `branch` are reported
#                      with a cherry-pick dry run. Uses the `upstream` remote, or fetches
#                      `upstream_url` into refs/ai-upstream/* without adding a remote.
# kind = "reference"   a project one of ours learns from (credits, competitors).
#                      Releases and commits since the last acknowledged run.
# kind = "own"         this stack's own repositories; listed so scout skips them.
#
# feeds       which of our projects it informs: waymux, waymaker, lazygitrs, workflow
#             (`ai-upstream --for waymaker`). Reports are grouped by it.
# area        what it can improve there.
# keywords    extra words for this source, added to the global list below.
# license     checked live from GitHub; the value here is the fallback for licenses
#             GitHub cannot detect.
# commits     false: releases only (very busy repositories).
# notes_url   release-notes page read when a release body is only a link
#             ({major} {minor} {patch} {tag}).
# tag_prefix  only tags with this prefix count (monorepos).
# cargo_lock  with `crate`: read the installed version of a library from a Cargo.lock.

# Words that mark a release-note line or commit as worth reading for this stack.
keywords = [
  "hook", "statusline", "status line", "osc", "effort", "permission", "approval",
  "resume", "sandbox", "worktree", "tmux", "notification", "quota",
  "usage limit", "rate limit", "mcp", "subagent", "headless", "json", "api",
  "review", "diff", "checkpoint", "remote", "phone", "mobile", "security", "ghsa",
  "cve", "performance", "latency", "keybind", "popup", "external editor",
]

