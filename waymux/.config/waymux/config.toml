# waymux configuration — the source of truth (not generated). State colors come from
# waymux's built-in light/dark palette, so theme switches only restart the daemon
# (omarchy/.config/omarchy/hooks/theme-set) and never rewrite this file.

listen_addr = "127.0.0.1"
port = 4040
pid_file = "/tmp/waymux.pid"
shutdown_timeout_secs = 30
idle_debounce_ms = 650
log_level = "info"
# Since 0.2.4 the daemon runs the flow telemetry hook only when it is named here.
flow_log_hook = "~/.config/tmux/flow-log.sh"
keylog = true

[sound]
enabled = true
player = "pw-play"
response = "~/.local/share/sounds/ai/01-crystal-chime.wav"
question = "~/.local/share/sounds/ai/02-gentle-ping.wav"
permission = "~/.local/share/sounds/ai/06-cyber-pulse.wav"
error = "~/.local/share/sounds/ai/10-arcade-blip.wav"

# The Cockpit's y/n answer Claude Code's permission prompt through the PermissionRequest
# hook (claude/.claude/settings.json) instead of keystrokes; Claude keeps its dialog on screen
# meanwhile and the first answer wins. Set enabled = false to go back to keystrokes.
[approvals]
enabled = true
hold_seconds = 120

# A prompt still held after 15 s (not answered at the desk) alerts the phone through ntfy and
# opens /m when tapped. The topic is a secret, so it lives outside this public repo, 0600.
[phone]
ntfy_file = "~/.local/state/waymux/ntfy-topic"

# `waymux quota`: ai-quota (utils/.local/bin) sets the providers, preference and state dir through
# WAYMUX_QUOTA_*; these are the keys of its popup (Prefix + u).
[quota]
launch = "exec ~/.local/bin/ai-launch --auto"
pick = 'c=$(~/.local/bin/ai-launch --pick) && [ -n "$c" ] && printf "exec ~/.local/bin/ai-launch %s\n" "$c"'

# `waymux launch` (through ai-launch, which adds the jail rows and hook): Claude Code's model rows.
[launch]
claude_models = ["fable", "opus", "sonnet", "haiku"]

[theme]
active_spinner = "minidot"

# State colors are semantic, not themed: waymux picks them from a built-in light/dark palette
# that keeps permission, question, stalled and error distinguishable on every theme. Theme
# slots collapse them (lumon: all blue; tokyo-night: permission == stalled).
# An empty `color` means "use the built-in palette"; set `#rrggbb` to override a state.
# (Kept as an empty key so waymux <= 0.2.3, where `color` is required, still parses this.)

[theme.states.idle]
icon = "󰗡"
color = ""

[theme.states.busy]
icon = "󰑮"
color = ""

[theme.states.working]
icon = "󰑮"
color = ""

[theme.states.question]
icon = "󱜻"
color = ""

[theme.states.permission]
icon = "󰳌"
color = ""

[theme.states.stalled]
icon = "󰔟"
color = ""

[theme.states.error]
icon = ""
color = ""

# Cockpit-only: done, not reviewed (cleared by opening lazygitrs).
[theme.states.review]
icon = "󰷋"
color = ""

# Nerd Font icon registry — the single source of truth for program/agent glyphs.
# Agent-state glyphs live in [theme.states.*] above. Every consumer reads from here:
# waymux (window rename, Cockpit, alerts), the tmux window-name plugin (generated by
# ~/.config/tmux/nerd-font-icons-sync.sh), and shell scripts via `waymux icon <name>`
# or `eval "$(waymux icons --format sh)"`. See docs/architecture/nerd-font-icon-registry.md.
[icons]
# AI agents
agent = "󰚩"
agy = ""
agy-bin = ""
agyy = ""
ai = "󱚤"
ai-jail = ""
claude = ""
codex = ""
devin = ""
muse = "󱚣"
opencode = "󰅪"
# Tools and runtimes
ai-memory = "󰍛"
ai-usagebar = "󰄨"
antigravity-ide = "󰨞"
btop = "󰨜"
bun = "󰟈"
docker = ""
fonts = ""
gh = ""
htop = ""
lazygit = ""
lazygitrs = ""
mise = "󰒓"
node = "󱚤"
npm = ""
server = ""
tmux = ""
waymux = "󱐋"
worktrunk = "󰙅"
yazi = "󰇥"
zsh = ""

[spinners]
minidot = { interval = 83, frames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"] }
line = { interval = 100, frames = ["|", "/", "-", "\\"] }
jump = { interval = 100, frames = ["⢄", "⢂", "⢁", "⡁", "⡈", "⡐", "⡠"] }
pulse = { interval = 125, frames = ["█", "▓", "▒", "░"] }
points = { interval = 143, frames = ["∙∙∙", "●∙∙", "∙●∙", "∙∙●"] }
meter = { interval = 143, frames = ["▱▱▱", "▰▱▱", "▰▰▱", "▰▰▰", "▰▰▱", "▰▱▱", "▱▱▱"] }
hamburger = { interval = 333, frames = ["☱", "☲", "☴", "☲"] }
ellipsis = { interval = 333, frames = ["·", "..", "...", ".."] }
globe = { interval = 250, frames = ["🌍", "🌎", "🌏"] }
moon = { interval = 125, frames = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"] }
monkey = { interval = 333, frames = ["🙈", "🙉", "🙊"] }
arc = { interval = 150, frames = ["◜", "◠", "◝", "◞", "◡", "◟"] }
nerd = { interval = 100, frames = [" ", " ", " ", " "] }
nerdarc = { interval = 120, frames = ["◜", " ", "◝", "◞", "◡", "◟", " "] }
dot = { interval = 100, frames = ["⣾", "⣽", "⣻", "⢿", "⡿", "⣟", "⣯", "⣷"] }
